 context through selection or summarization while preserving needed state.","zh":"通过选择或摘要减少累积上下文，并尽量保留必要状态。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"deeper"},{"id":"g72","term":"Prompt versioning","cn":"提示版本管理","definition":{"en":"Recording and comparing changes to prompts alongside models, data and evaluation results.","zh":"记录和比较提示变更，并关联模型、数据与评估结果。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g73","term":"Context rot","cn":"上下文质量衰减","definition":{"en":"An informal label for degraded effectiveness as context grows noisy or difficult to use; not a universal law.","zh":"上下文因噪声增多或难以使用而效果下降的非正式称呼，不是普遍定律。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"deeper"},{"id":"g74","term":"OCR","cn":"光学字符识别","definition":{"en":"Recognizing text in images; it does not automatically preserve tables or understand business meaning.","zh":"识别图像中的文字，不自动保留表格关系或理解业务含义。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g75","term":"Document parsing","cn":"文档解析","definition":{"en":"Extracting text and structure from files while preserving relevant layout and metadata.","zh":"从文件提取文本与结构，保留相关布局和元数据。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g76","term":"ETL / ELT","cn":"提取、转换、加载","definition":{"en":"Data-pipeline patterns differing in whether transformation occurs before or after loading.","zh":"数据流水线模式，区别在于转换发生在加载之前还是之后。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"deeper"},{"id":"g77","term":"Normalization","cn":"数据归一化／标准化","definition":{"en":"Converting values to consistent representations while retaining original evidence.","zh":"在保留原始证据的同时，把数值和字段转成一致表示。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g78","term":"Entity extraction","cn":"实体提取","definition":{"en":"Identifying mentions such as companies, parts and dates in source material.","zh":"从来源材料中识别公司、零件、日期等实体提及。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g79","term":"Entity resolution","cn":"实体消歧与归并","definition":{"en":"Mapping mentions to the correct real-world or authoritative-record identity.","zh":"把实体提及映射到正确的现实身份或权威记录。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g80","term":"Canonical ID","cn":"规范标识符","definition":{"en":"A stable identity used to connect records and aliases without relying only on names.","zh":"用于连接记录与别名的稳定身份，不仅依赖名称。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g81","term":"Provenance / lineage","cn":"来源／数据血缘","definition":{"en":"The origin and transformation history needed to inspect and reproduce a data claim.","zh":"检查和复现数据陈述所需的来源与转换历史。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g82","term":"Source of truth","cn":"权威事实源","definition":{"en":"The designated authoritative system for a particular field or business record.","zh":"被指定为某字段或业务记录权威依据的系统。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g83","term":"Data freshness","cn":"数据新鲜度","definition":{"en":"How current a record is relative to the decision and the underlying source’s changes.","zh":"相对于决策需求与来源变化，记录有多及时。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g84","term":"Data drift","cn":"数据漂移","definition":{"en":"Changes in incoming data distributions that may invalidate previous performance assumptions.","zh":"输入数据分布变化，可能使先前的性能假设失效。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g85","term":"PII","cn":"个人可识别信息","definition":{"en":"Information that identifies or can be linked to a person; handling depends on context and applicable rules.","zh":"能识别或关联个人的信息，处理方式取决于情境与适用规则。"},"category":"data","module":"m4","refs":["S18","S31","S33"],"priority":"core"},{"id":"g86","term":"RAG","cn":"检索增强生成","definition":{"en":"Supplying retrieved evidence to a generation process, typically without retraining the model for each update.","zh":"向生成过程提供检索证据，通常不为每次数据更新重新训练模型。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g87","term":"Chunking","cn":"切块","definition":{"en":"Splitting content into retrieval units while balancing context, precision and source structure.","zh":"把内容分成检索单位，并权衡上下文、精度与来源结构。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g88","term":"Chunk overlap","cn":"切块重叠","definition":{"en":"Repeating boundary content across chunks to reduce lost context, at a storage and redundancy cost.","zh":"在相邻块重复边界内容以减少上下文丢失，同时增加存储与冗余。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"deeper"},{"id":"g89","term":"Metadata filtering","cn":"元数据过滤","definition":{"en":"Restricting retrieval using attributes such as tenant, date, document type and permission scope.","zh":"按租户、日期、文档类型、权限范围等属性限制检索。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g90","term":"Exact matching","cn":"精确匹配","definition":{"en":"Matching an identifier or value exactly under an explicitly defined normalization rule.","zh":"在明确定义的归一化规则下，匹配完全一致的标识或值。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g91","term":"Fuzzy matching","cn":"模糊字符串匹配","definition":{"en":"Matching similar spellings using character-level differences, not general semantic understanding.","zh":"利用字符层面的差异匹配相近拼写，不等于一般语义理解。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g92","term":"Edit / Levenshtein distance","cn":"编辑距离","definition":{"en":"The minimum number of character edits needed to transform one string into another under chosen operations.","zh":"在规定操作下，把一个字符串变成另一个字符串所需的最少字符编辑次数。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g93","term":"Lexical search","cn":"词法检索","definition":{"en":"Retrieval based on terms and their occurrence, rather than only learned dense representations.","zh":"根据词项及其出现情况检索，而不只依靠学习得到的稠密表示。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g94","term":"BM25","cn":"BM25 排序","definition":{"en":"A lexical relevance-scoring family accounting for term frequency, rarity and document length.","zh":"考虑词频、稀有程度与文档长度的词法相关性评分方法。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g95","term":"Inverted index","cn":"倒排索引","definition":{"en":"A mapping from terms to documents or positions containing them.","zh":"从词项映射到包含该词项的文档或位置的索引。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"deeper"},{"id":"g96","term":"Semantic / dense retrieval","cn":"语义／稠密检索","definition":{"en":"Retrieval using learned vector representations to find meaning-related candidates.","zh":"使用学习得到的向量表示，寻找意义相关候选。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g97","term":"Cosine similarity","cn":"余弦相似度","definition":{"en":"Comparing vector direction using a normalized dot product; relevance still depends on the embedding task.","zh":"用归一化点积比较向量方向，相关性仍取决于嵌入任务。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g98","term":"Vector database","cn":"向量数据库","definition":{"en":"A system supporting vector storage and search, usually alongside metadata and operational features.","zh":"支持向量存储与搜索的系统，通常还包含元数据和运行管理功能。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g99","term":"ANN","cn":"近似最近邻搜索","definition":{"en":"Efficiently finding approximate nearest vectors rather than exhaustively comparing every vector.","zh":"高效寻找近似最近邻向量，而非穷举比较所有向量。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"deeper"},{"id":"g100","term":"HNSW","cn":"分层可导航小世界图","definition":{"en":"A graph-based ANN indexing method; its neighbor graph is not a domain knowledge graph.","zh":"基于图的近似最近邻索引方法，其邻接图不是领域知识图谱。"},"category":"retrieval","module":"m5","refs":["P20"],"priority":"deeper"},{"id":"g101","term":"Hybrid search","cn":"混合检索","definition":{"en":"Combining complementary retrieval signals such as lexical and dense search.","zh":"组合词法与稠密等互补检索信号。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g102","term":"RRF · Reciprocal rank fusion","cn":"倒数排名融合","definition":{"en":"Combining ranked lists using reciprocal rank contributions rather than raw incompatible scores.","zh":"使用名次倒数贡献融合排序列表，而非相加不兼容的原始分数。"},"category":"retrieval","module":"m5","refs":["S40"],"priority":"core"},{"id":"g103","term":"Reranker","cn":"重排器","definition":{"en":"A model or method that reorders an initial candidate set for a query.","zh":"针对查询重新排列初始候选集的模型或方法。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g104","term":"Bi-encoder","cn":"双塔编码器","definition":{"en":"Encoding query and document separately, enabling precomputed document vectors and fast retrieval.","zh":"分别编码查询与文档，便于预计算文档向量和快速检索。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g105","term":"Cross-encoder","cn":"交叉编码器","definition":{"en":"Jointly processing a query and candidate to score their relationship, commonly for reranking.","zh":"联合处理查询与候选并评分，常用于重排。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g106","term":"Query rewriting","cn":"查询改写","definition":{"en":"Transforming a user request into a more useful retrieval query; meaning must remain controlled.","zh":"把用户请求转成更适合检索的查询，同时控制语义偏移。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"deeper"},{"id":"g107","term":"Contextual retrieval","cn":"上下文化检索","definition":{"en":"Adding document-specific context to chunks before indexing to improve their standalone interpretability.","zh":"在建索引前为切块添加文档级上下文，使其独立出现时更易理解。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g108","term":"Citation support","cn":"引用支持度","definition":{"en":"Whether the cited evidence actually supports the specific claim, not merely whether a link exists.","zh":"引用证据是否真正支持具体结论，而不仅是有没有链接。"},"category":"retrieval","module":"m5","refs":["S16","S17","S18","P06"],"priority":"core"},{"id":"g109","term":"Knowledge graph · KG","cn":"知识图谱","definition":{"en":"Explicit entities and typed relationships, often with properties, provenance and governance.","zh":"由显式实体与带类型的关系构成，常包含属性、来源和治理。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g110","term":"Node / edge / property","cn":"节点／边／属性","definition":{"en":"A graph’s entities, relationships and associated data values.","zh":"图中的实体、关系与关联数据值。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g111","term":"Triple","cn":"三元组","definition":{"en":"A subject–predicate–object statement, central to RDF’s graph model.","zh":"主语—谓语—宾语陈述，是 RDF 图模型的核心。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g112","term":"RDF","cn":"资源描述框架","definition":{"en":"A standardized graph data model for representing statements with identified resources.","zh":"通过有标识的资源表达陈述的标准化图数据模型。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g113","term":"Property graph","cn":"属性图","definition":{"en":"A graph model in which nodes and relationships can carry properties.","zh":"节点和关系都可以携带属性的图模型。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g114","term":"Ontology","cn":"本体","definition":{"en":"A formal domain vocabulary and relationship model, potentially including logical constraints.","zh":"形式化领域词汇与关系模型，也可能包含逻辑约束。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g115","term":"Graph schema","cn":"图模式","definition":{"en":"The intended entity types, relationship types and property rules for a graph.","zh":"图中预期的实体类型、关系类型与属性规则。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g116","term":"Traversal / multi-hop","cn":"遍历／多跳","definition":{"en":"Following relationship paths across multiple entities to answer a query.","zh":"沿关系路径跨越多个实体以回答查询。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g117","term":"Cypher / SPARQL","cn":"图查询语言","definition":{"en":"Query languages associated with property graphs and RDF respectively; they are not the same language.","zh":"分别与属性图和 RDF 相关的查询语言，二者不是同一种语言。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"deeper"},{"id":"g118","term":"Community detection","cn":"社区发现","definition":{"en":"Grouping graph entities by connectivity patterns, useful in some summarization pipelines.","zh":"根据连接模式对实体分组，可用于某些摘要流水线。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"deeper"},{"id":"g119","term":"GraphRAG","cn":"图增强检索生成","definition":{"en":"A broad graph-enhanced RAG label; Microsoft GraphRAG is a specific implementation and research lineage.","zh":"广义图增强 RAG；微软 GraphRAG 是具体实现与研究路线。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g120","term":"Local / global graph search","cn":"局部／全局图检索","definition":{"en":"Entity-focused versus corpus-level retrieval modes in Microsoft GraphRAG; exact mechanisms vary by mode.","zh":"微软 GraphRAG 中面向实体与面向整体语料的检索模式，具体机制依模式而异。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"core"},{"id":"g121","term":"Graph embedding","cn":"图嵌入","definition":{"en":"A learned vector representation of graph entities or structure; different from the explicit graph itself.","zh":"图实体或结构的学习向量表示，不等于显式图本身。"},"category":"graphs","module":"m6","refs":["S19","S21","S22","P16"],"priority":"deeper"},{"id":"g122","term":"Workflow","cn":"工作流","definition":{"en":"A system with predefined control flow, which may include LLM-based steps.","zh":"控制流程预先定义的系统，其中可以包含大模型步骤。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g123","term":"AI agent","cn":"AI 智能体","definition":{"en":"A system in which a model has some control over actions or next steps while pursuing a goal.","zh":"模型在实现目标时，对行动或下一步拥有一定控制权的系统。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g124","term":"Agentic","cn":"智能体式","definition":{"en":"A degree of model-directed control; it is not a binary guarantee of capability or reliability.","zh":"模型主导控制的一种程度，不是能力或可靠性的二元保证。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g125","term":"Orchestration","cn":"编排","definition":{"en":"Coordinating steps, state, tools, policies and failure handling across a task.","zh":"协调任务中的步骤、状态、工具、策略与失败处理。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g126","term":"Tool / function calling","cn":"工具／函数调用","definition":{"en":"A model requests an external capability; application-side software validates and performs it.","zh":"模型请求外部能力，由应用侧软件验证并执行。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g127","term":"Tool schema","cn":"工具结构定义","definition":{"en":"The declared inputs and outputs of a tool, separate from its execution authorization.","zh":"工具声明的输入输出结构，与执行授权不同。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g128","term":"ReAct","cn":"推理与行动交替","definition":{"en":"A research pattern interleaving reasoning, actions and observations.","zh":"交替进行推理、行动与观察的研究模式。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g129","term":"Planning","cn":"规划","definition":{"en":"Decomposing a goal into steps and potentially revising them from observations.","zh":"把目标分解为步骤，并可能根据观察修订。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g130","term":"Routing","cn":"路由","definition":{"en":"Selecting an appropriate specialist path, model or tool for an input.","zh":"针对输入选择适合的专门路径、模型或工具。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g131","term":"Multi-agent system","cn":"多智能体系统","definition":{"en":"Multiple agents coordinating on a task; added agents introduce coordination and evaluation costs.","zh":"多个智能体协作处理任务，也引入协调与评估成本。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g132","term":"HITL · Human in the loop","cn":"人在回路","definition":{"en":"A person reviews or decides within the process, with enough evidence and authority to act.","zh":"人员参与流程审核或决策，并具备足够证据与行动权限。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g133","term":"Approval gate","cn":"审批关卡","definition":{"en":"An enforced checkpoint before a consequential action, not merely advisory text.","zh":"重要行动前强制执行的检查点，而不只是建议文字。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g134","term":"Stop condition / budget","cn":"停止条件／预算","definition":{"en":"Explicit limits on completion, time, tool calls or cost that bound execution.","zh":"以完成状态、时间、工具调用或成本限制执行的明确条件。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g135","term":"Agent state","cn":"智能体状态","definition":{"en":"The task’s current durable and transient information, which should not live only in a model narrative.","zh":"任务当前的持久与临时信息，不应只存在于模型叙述中。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g136","term":"Memory","cn":"记忆","definition":{"en":"Information persisted across interactions with explicit retrieval, scope and deletion rules.","zh":"跨交互保存的信息，需要明确检索、范围与删除规则。"},"category":"agents","module":"m8","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g137","term":"MCP","cn":"模型上下文协议","definition":{"en":"A protocol connecting AI hosts to servers exposing tools, resources and prompts; not a safety guarantee.","zh":"连接 AI 宿主与工具、资源、提示服务器的协议，不是安全保证。"},"category":"agents","module":"m8","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g138","term":"MCP host / client / server","cn":"MCP 宿主／客户端／服务器","definition":{"en":"The host contains clients that connect to capability-providing servers.","zh":"宿主包含连接能力提供服务器的客户端。"},"category":"agents","module":"m8","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g139","term":"Agent Skills","cn":"智能体技能包","definition":{"en":"Packaged procedural guidance and related resources for classes of tasks; not identical to callable tools.","zh":"为一类任务打包的操作指引与相关资源，不等于可调用工具。"},"category":"agents","module":"m8","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g140","term":"Progressive disclosure","cn":"渐进式披露","definition":{"en":"Loading detailed instructions or resources only when needed rather than all at once.","zh":"按需加载详细指引或资源，而不是一次全部加载。"},"category":"agents","module":"m8","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"deeper"},{"id":"g141","term":"A2A","cn":"智能体间协议","definition":{"en":"A protocol lineage for communication across agent systems, distinct from a tool interface.","zh":"用于智能体系统之间通信的协议路线，与工具接口不同。"},"category":"agents","module":"m8","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"deeper"},{"id":"g142","term":"Idempotency","cn":"幂等性","definition":{"en":"Repeated application of the same operation does not multiply its intended side effect.","zh":"重复执行同一操作不会成倍产生预期外部影响。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g143","term":"Sandbox","cn":"沙箱","definition":{"en":"A restricted environment limiting what code or tools can affect; restrictions need enforcement.","zh":"限制代码或工具影响范围的环境，需要真正执行限制。"},"category":"agents","module":"m7","refs":["S23","S24","S26","S28","S29","S30","S32"],"priority":"core"},{"id":"g144","term":"Eval / evaluation suite","cn":"评估／评估套件","definition":{"en":"Defined test tasks, expected outcomes and scoring procedures for repeatable comparisons.","zh":"用于可重复比较的测试任务、预期结果与评分程序。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g145","term":"Ground truth / gold set","cn":"参考真值／金标准集","definition":{"en":"Curated expected answers or outcomes; these labels also require quality checks.","zh":"整理出的预期答案或结果，标注本身也需要质量检查。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g146","term":"Held-out test set","cn":"保留测试集","definition":{"en":"Data kept separate from training and iterative tuning for a less biased evaluation.","zh":"与训练和反复调优分离的数据，用于减少评估偏差。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g147","term":"Data leakage / contamination","cn":"数据泄漏／测试污染","definition":{"en":"Information from the evaluation target influences training or tuning, inflating apparent performance.","zh":"评估目标信息进入训练或调优，导致表面性能虚高。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g148","term":"Precision","cn":"精确率","definition":{"en":"Among selected positive cases, the fraction that are truly positive under a defined label.","zh":"在选为正例的情况中，真正为正例的比例，前提是明确标签定义。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g149","term":"Recall","cn":"召回率","definition":{"en":"Among all relevant or positive cases, the fraction successfully found or selected.","zh":"在所有相关或正例中，被成功找到或选中的比例。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g150","term":"Recall@k","cn":"前 k 项召回率","definition":{"en":"The fraction of relevant items retrieved within the first k candidates for a query.","zh":"某查询的相关项中，进入前 k 个候选的比例。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g151","term":"MRR / nDCG","cn":"排序评估指标","definition":{"en":"Metrics rewarding relevant results near the top; definitions depend on relevance labels and rank treatment.","zh":"奖励相关结果靠前的指标，定义取决于相关性标注与名次处理。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"deeper"},{"id":"g152","term":"Calibration","cn":"校准","definition":{"en":"Agreement between stated probabilities and observed frequencies on the relevant population.","zh":"在相关样本总体上，声称概率与实际发生频率的一致程度。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g153","term":"Coverage / automation rate","cn":"覆盖率／自动化率","definition":{"en":"The fraction of eligible tasks handled by a selected policy; denominator must be explicit.","zh":"按某策略处理的任务占适用任务的比例，必须明确分母。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g154","term":"LLM-as-judge","cn":"大模型评分器","definition":{"en":"Using a model to apply a rubric; it must be validated against task-appropriate human judgment.","zh":"让模型执行评分标准，必须用适合任务的人工判断验证。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g155","term":"Rubric","cn":"评分标准","definition":{"en":"Explicit criteria describing what qualifies as success and how partial errors are scored.","zh":"明确成功条件与部分错误如何计分的准则。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g156","term":"Task / trial / trace / outcome","cn":"任务／试验／轨迹／结果","definition":{"en":"Scenario, one execution, its event sequence and the resulting state—different units of analysis.","zh":"分别是场景、一次执行、事件序列与最终状态，是不同分析单位。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g157","term":"pass@k / pass^k","cn":"至少一次成功／全部成功","definition":{"en":"Respectively, success in at least one of k runs and success in all k runs; report assumptions.","zh":"分别表示 k 次中至少一次成功和全部成功，应报告计算假设。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g158","term":"Error slice","cn":"错误切片","definition":{"en":"A subset such as language, document type or user group used to reveal uneven quality.","zh":"按语言、文档类型或用户群等划分的子集，用于发现质量差异。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g159","term":"Regression test","cn":"回归测试","definition":{"en":"A repeatable check that a change has not broken previously required behavior.","zh":"检查变更是否破坏原有必要行为的可重复测试。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g160","term":"Shadow mode","cn":"影子运行","definition":{"en":"Running a new system alongside the existing process without letting it perform live consequential actions.","zh":"让新系统与现有流程并行运行，但不允许其执行真实重要行动。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g161","term":"Canary rollout","cn":"灰度发布","definition":{"en":"Exposing a limited population to a change before broader release, with monitoring and rollback.","zh":"先让有限人群使用变更，配合监控与回滚，再扩大范围。"},"category":"evaluation","module":"m9","refs":["S33","S34"],"priority":"core"},{"id":"g162","term":"LLMOps","cn":"大模型应用运维","definition":{"en":"Processes for versioning, evaluating, deploying and monitoring model-based applications.","zh":"对模型应用进行版本管理、评估、部署和监控的流程。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g163","term":"Observability","cn":"可观测性","definition":{"en":"The ability to investigate behavior through appropriate metrics, logs and traces.","zh":"通过适当指标、日志和轨迹调查系统行为的能力。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g164","term":"TTFT","cn":"首词元延迟","definition":{"en":"Elapsed time until the first output token; different from task completion time.","zh":"到首个输出词元出现所需时间，不同于任务完成时间。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g165","term":"p50 / p95 latency","cn":"延迟分位数","definition":{"en":"The latency values below which 50% or 95% of measured requests fall.","zh":"分别有 50% 或 95% 被测请求延迟不超过的数值。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g166","term":"Throughput","cn":"吞吐量","definition":{"en":"Work completed per unit time under stated workload and quality conditions.","zh":"在规定负载与质量条件下，单位时间完成的工作量。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g167","term":"KV cache","cn":"键值缓存","definition":{"en":"Reused attention keys and values during generation, not a permanent external knowledge store.","zh":"生成时复用的注意力键和值，不是永久外部知识库。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g168","term":"Prompt caching","cn":"提示缓存","definition":{"en":"Reusing supported repeated-prefix processing; scope, billing and semantics depend on the provider.","zh":"复用受支持的重复前缀处理，范围、计费与语义取决于服务商。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g169","term":"Quantization","cn":"量化","definition":{"en":"Representing model values at lower numerical precision to reduce resource use, with task-dependent trade-offs.","zh":"以较低数值精度表示模型值来节省资源，取舍依任务而定。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g170","term":"Batching","cn":"批处理","definition":{"en":"Processing multiple requests together for efficiency, potentially changing latency.","zh":"为提高效率一起处理多个请求，也可能改变延迟。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g171","term":"FlashAttention","cn":"FlashAttention","definition":{"en":"An exact attention implementation optimizing memory traffic; not approximate attention.","zh":"优化显存数据搬运的精确注意力实现，不是近似注意力。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"deeper"},{"id":"g172","term":"PagedAttention / vLLM","cn":"分页注意力／vLLM","definition":{"en":"KV-cache memory-management ideas and an associated serving system; assess actual workload fit.","zh":"KV 缓存管理思想及相关推理服务系统，应评估真实负载适配性。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"deeper"},{"id":"g173","term":"Least privilege","cn":"最小权限","definition":{"en":"Granting only the access needed for the authorized task and duration.","zh":"仅授予获授权任务与所需时段必需的访问能力。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g174","term":"ACL / RBAC / ABAC","cn":"访问控制列表／角色／属性授权","definition":{"en":"Different mechanisms for expressing and enforcing access policy; retrieval must respect the policy.","zh":"表达与执行访问策略的不同机制，检索必须遵守这些策略。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g175","term":"Tenant isolation","cn":"租户隔离","definition":{"en":"Preventing one customer’s data or actions from crossing another customer’s boundary.","zh":"防止一个客户的数据或行动越过另一个客户的边界。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g176","term":"Data retention / deletion","cn":"数据保留／删除","definition":{"en":"Rules for keeping and removing data across sources, indexes, traces and memory.","zh":"规定源数据、索引、轨迹与记忆如何保存和移除。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g177","term":"Fallback / rollback","cn":"降级／回滚","definition":{"en":"Switching to a safer alternative during failure, or reverting an unsuccessful release.","zh":"失败时切换更安全替代路径，或恢复失败发布前的版本。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g178","term":"Circuit breaker","cn":"熔断器","definition":{"en":"A control that stops repeated calls to a failing dependency until recovery conditions are met.","zh":"在依赖持续失败时停止重复调用，直到满足恢复条件。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"deeper"},{"id":"g179","term":"Cost per accepted task","cn":"每个被接受任务的成本","definition":{"en":"Relevant total operating cost divided by successfully completed and accepted tasks.","zh":"相关总运行成本除以成功完成且被接受的任务数量。"},"category":"production","module":"m10","refs":["S35","S36","S37","P13","P14"],"priority":"core"},{"id":"g180","term":"FDE","cn":"前线部署工程","definition":{"en":"A working role connecting customer workflows with deployed systems; exact responsibilities vary by company.","zh":"连接客户流程与已部署系统的工作角色，具体职责因公司而异。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g181","term":"ICP · Ideal customer profile","cn":"理想客户画像","definition":{"en":"A hypothesis about customers with a recurring problem, suitable constraints and a credible buying path.","zh":"对具有反复需求、适合约束和可信购买路径的客户类型的假设。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g182","term":"Workflow discovery","cn":"流程发现","definition":{"en":"Observing actual tasks, exceptions, handoffs and decision ownership before proposing a system.","zh":"提出系统前观察真实任务、例外、交接与决策责任。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g183","term":"POC / pilot / production","cn":"概念验证／试点／生产","definition":{"en":"Testing feasibility, testing bounded real use and operating a maintained live service; define each scope explicitly.","zh":"分别验证可行性、有限真实使用和维护实时服务，应明确各自范围。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g184","term":"Acceptance criteria","cn":"验收标准","definition":{"en":"Agreed observable conditions that determine whether a delivery meets its intended purpose.","zh":"双方约定、可观察的条件，用于判断交付是否达到目标。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g185","term":"Economic buyer / champion","cn":"经济买方／内部推动者","definition":{"en":"The budget decision-maker versus the person driving adoption; they may be different people.","zh":"预算决策者与推动采用的人，二者可能不同。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g186","term":"TCO · Total cost of ownership","cn":"总拥有成本","definition":{"en":"Acquisition, implementation, operation, maintenance and change costs within a defined period.","zh":"在明确周期内的购买、实施、运行、维护与变更成本。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g187","term":"ROI · Return on investment","cn":"投资回报","definition":{"en":"A comparison of attributable realized benefits with defined costs; state time horizon and assumptions.","zh":"可归因已实现收益与规定成本的比较，需说明周期与假设。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g188","term":"Capacity versus cash savings","cn":"产能释放与现金节省","definition":{"en":"Time freed is capacity; it becomes cash savings only through a demonstrated financial mechanism.","zh":"释放时间首先是产能，只有经过证明的财务实现机制才能形成现金节省。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g189","term":"Value-based pricing","cn":"价值导向定价","definition":{"en":"Charging logic linked to customer value, constrained by measurable outcomes, alternatives and delivery risk.","zh":"与客户价值关联的收费逻辑，受可测结果、替代方案和交付风险约束。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g190","term":"Root-cause analysis","cn":"根因分析","definition":{"en":"Testing competing explanations of a failure rather than accepting the first convenient label.","zh":"检验失败的不同解释，而不是接受第一个方便的标签。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"},{"id":"g191","term":"Decision owner","cn":"决策责任人","definition":{"en":"The person accountable and authorized to make a specific trade-off or accept an outcome.","zh":"对特定取舍或结果验收负责并有权决策的人。"},"category":"fde","module":"m11","refs":["S15","S23","S33","S36"],"priority":"core"}],"categories":[{"id":"foundations","title":{"en":"Foundations","zh":"基础概念"},"module":"m0"},{"id":"architecture","title":{"en":"Model internals","zh":"模型内部"},"module":"m1"},{"id":"training","title":{"en":"Learning and adaptation","zh":"学习与适配"},"module":"m2"},{"id":"context","title":{"en":"Prompts and context","zh":"提示与上下文"},"module":"m3"},{"id":"data","title":{"en":"Documents and data","zh":"文档与数据"},"module":"m4"},{"id":"retrieval","title":{"en":"Search and RAG","zh":"搜索与 RAG"},"module":"m5"},{"id":"graphs","title":{"en":"Knowledge graphs","zh":"知识图谱"},"module":"m6"},{"id":"agents","title":{"en":"Agents and tools","zh":"智能体与工具"},"module":"m7"},{"id":"evaluation","title":{"en":"Evaluation and reliability","zh":"评估与可靠性"},"module":"m9"},{"id":"production","title":{"en":"Serving and security","zh":"服务与安全"},"module":"m10"},{"id":"fde","title":{"en":"FDE and value","zh":"FDE 与价值"},"module":"m11"}],"timeline":[{"year":"1995","lane":"retrieval","title":{"en":"Lexical retrieval: the Okapi lineage","zh":"词法检索：Okapi 路线"},"problem":{"en":"Find useful documents in large text collections.","zh":"从大型文本集合中找到有用文档。"},"change":{"en":"Probabilistic term-ranking systems such as Okapi helped establish the BM25 lineage; this TREC-3 publication record is dated January 1995.","zh":"Okapi 等概率词项排序系统推动了 BM25 路线；此 TREC-3 出版记录为 1995 年 1 月。"},"now":{"en":"Exact identifiers and lexical relevance still matter. This is a historical anchor, not a claim that search began here.","zh":"精确标识和词法相关性仍然重要。这是历史锚点，不代表搜索始于此。"},"refs":["H01","S16"]},{"year":"1999","lane":"knowledge","title":{"en":"RDF standardizes explicit statements","zh":"RDF 标准化显式陈述"},"problem":{"en":"Machines need relationships with unambiguous identities, not only unstructured prose.","zh":"机器需要带明确身份的关系，而不只是非结构化文字。"},"change":{"en":"The W3C RDF recommendation formalized a graph-oriented representation of statements. Knowledge representation itself is much older.","zh":"W3C 的 RDF 推荐标准规范了面向图的陈述表示；知识表示本身历史更早。"},"now":{"en":"Triples, identity and provenance remain useful beside neural representations; they were not replaced by embeddings.","zh":"三元组、身份与来源仍可与神经表示配合，并未被嵌入取代。"},"refs":["H02","S22"]},{"year":"2013","lane":"models","title":{"en":"Word2vec: useful learned word vectors","zh":"Word2vec：可用的词向量"},"problem":{"en":"Discrete word identities do not naturally express similarity.","zh":"离散词标识不能自然表达相似性。"},"change":{"en":"Efficient word-representation learning made vector relationships practically useful at scale.","zh":"高效词表示学习推动了大规模向量关系的实际应用。"},"now":{"en":"Modern retrieval embeddings are more contextual and task-specific. Similarity remains different from verified truth.","zh":"现代检索嵌入更强调上下文与任务；相似性仍不等于已验证事实。"},"refs":["P01"]},{"year":"2014–15","lane":"models","title":{"en":"Attention addresses a bottleneck","zh":"注意力缓解序列瓶颈"},"problem":{"en":"Compressing an entire source sequence into one fixed vector limits translation models.","zh":"将完整源序列压进固定向量，会限制翻译模型。"},"change":{"en":"Bahdanau and colleagues let a decoder attend to relevant source positions; 2014 preprint, 2015 conference lineage.","zh":"Bahdanau 等让解码器关注相关源位置；预印本发表于 2014 年，会议路线为 2015 年。"},"now":{"en":"Attention is a mechanism for selecting and mixing information, not proof of human-like understanding.","zh":"注意力是选择与组合信息的机制，不是类人理解的证明。"},"refs":["P02"]},{"year":"2016","lane":"retrieval","title":{"en":"HNSW accelerates vector lookup","zh":"HNSW 加速向量查找"},"problem":{"en":"Exhaustive vector comparison becomes costly as collections grow.","zh":"集合扩大后，穷举向量比较成本很高。"},"change":{"en":"Hierarchical proximity graphs support efficient approximate nearest-neighbor search.","zh":"分层邻近图支持高效近似最近邻搜索。"},"now":{"en":"This graph is an index over vector neighborhoods, not a supplier–part knowledge graph.","zh":"这是向量邻域索引图，不是供应商—零件知识图谱。"},"refs":["P20"]},{"year":"2017","lane":"models","title":{"en":"The Transformer","zh":"Transformer"},"problem":{"en":"Sequence learning needs effective long-range interaction and parallelizable training.","zh":"序列学习需要有效的远距离交互和可并行训练。"},"change":{"en":"Attention Is All You Need introduced an encoder–decoder architecture centered on attention rather than recurrence.","zh":"Attention Is All You Need 提出以注意力而非循环为中心的编码器—解码器架构。"},"now":{"en":"Understand attention plus feed-forward blocks, positions, residuals and normalization—not attention alone.","zh":"需要理解注意力、前馈模块、位置、残差与归一化，而不只是注意力。"},"refs":["P03","S05"]},{"year":"2018","lane":"models","title":{"en":"BERT: the encoder branch","zh":"BERT：编码器分支"},"problem":{"en":"Task-specific NLP systems benefit from reusable contextual representations.","zh":"特定 NLP 任务需要可复用的上下文表示。"},"change":{"en":"Bidirectional pretraining creates an influential encoder-side route.","zh":"双向预训练形成了重要的编码器路线。"},"now":{"en":"Encoder-style representations remain useful for retrieval and ranking; decoder chat models are a parallel branch.","zh":"编码器式表示仍适用于检索和排序；解码器聊天模型是并行路线。"},"refs":["P04"]},{"year":"2020","lane":"models","title":{"en":"Scale and in-context examples","zh":"规模与上下文样例"},"problem":{"en":"Adapting a separate model for every task is burdensome.","zh":"为每个任务适配独立模型成本较高。"},"change":{"en":"GPT-3 demonstrated broad few-shot behavior by supplying examples in context rather than updating weights for each task.","zh":"GPT-3 展示了通过上下文样例获得广泛少样本表现，而不是为每个任务更新权重。"},"now":{"en":"Few-shot prompting is not training on a tiny dataset; the underlying model has extensive pretraining.","zh":"少样本提示不是只用很小数据集训练；底层模型已经过大量预训练。"},"refs":["P05"]},{"year":"2020","lane":"retrieval","title":{"en":"RAG connects retrieval and generation","zh":"RAG 连接检索与生成"},"problem":{"en":"Model parameters alone are awkward for grounded, updateable knowledge access.","zh":"仅靠模型参数，难以方便地访问有依据且可更新的知识。"},"change":{"en":"The RAG paper combined parametric generation with non-parametric retrieval for knowledge-intensive tasks.","zh":"RAG 论文将参数化生成与非参数检索结合，用于知识密集任务。"},"now":{"en":"Modern application RAG varies widely. Search, access control and data quality remain separate engineering work.","zh":"现代应用 RAG 形式多样；搜索、访问控制和数据质量仍需独立工程工作。"},"refs":["P06"]},{"year":"2020","lane":"models","title":{"en":"Diffusion: another generative branch","zh":"扩散：另一条生成路线"},"problem":{"en":"Generating rich visual data presents a different modeling problem from predicting text tokens.","zh":"生成丰富视觉数据与预测文本词元是不同的建模问题。"},"change":{"en":"DDPM learns a denoising process that supports high-quality image generation.","zh":"DDPM 学习去噪过程以支持图像生成。"},"now":{"en":"Generative AI is broader than LLMs. This atlas focuses on enterprise language-and-tool workflows, not all media generation.","zh":"生成式 AI 比大模型更广；本站重点是企业语言与工具流程，而非全部媒体生成。"},"refs":["P19"]},{"year":"2021","lane":"models","title":{"en":"LoRA and sparse experts","zh":"LoRA 与稀疏专家"},"problem":{"en":"Full adaptation and dense scaling can demand substantial resources.","zh":"全参数适配与稠密扩展可能需要大量资源。"},"change":{"en":"LoRA learns small low-rank updates. Switch Transformers explore sparse expert activation. These solve different problems.","zh":"LoRA 学习小型低秩更新；Switch Transformers 探索稀疏专家激活。两者解决不同问题。"},"now":{"en":"An adapter changes model weights; an MoE expert is inside a model, not an application agent.","zh":"适配器改变模型权重；MoE 专家在模型内部，不是应用智能体。"},"refs":["P07","P21"]},{"year":"2022","lane":"models","title":{"en":"Instruction, preference and reasoning signals","zh":"指令、偏好与推理信号"},"problem":{"en":"A useful text predictor is not automatically a helpful instruction follower.","zh":"优秀文本预测器不自动成为良好的指令执行者。"},"change":{"en":"InstructGPT combines supervised and preference-based training; chain-of-thought prompting explores intermediate reasoning.","zh":"InstructGPT 结合监督与偏好训练；思维链提示探索中间推理步骤。"},"now":{"en":"Post-training and prompting are different interventions. Helpful style does not guarantee correctness.","zh":"后训练与提示是不同干预；有帮助的表达风格不保证正确。"},"refs":["P08","P09"]},{"year":"2022","lane":"agents","title":{"en":"ReAct joins reasoning with actions","zh":"ReAct 结合推理与行动"},"problem":{"en":"A model answering from its prompt alone cannot inspect a changing environment.","zh":"只依据提示回答的模型无法检查变化中的环境。"},"change":{"en":"ReAct interleaves reasoning, tool-mediated actions and observations.","zh":"ReAct 交替使用推理、工具行动和观察。"},"now":{"en":"A production loop still needs permissions, state, budgets, recovery and verified completion.","zh":"生产循环仍需要权限、状态、预算、恢复与完成验证。"},"refs":["P10"]},{"year":"2022–23","lane":"systems","title":{"en":"Serving becomes a systems problem","zh":"推理服务成为系统工程问题"},"problem":{"en":"Memory traffic and KV-cache allocation limit efficient serving.","zh":"显存搬运与 KV 缓存分配限制服务效率。"},"change":{"en":"FlashAttention improves exact attention execution; PagedAttention addresses cache memory management in serving.","zh":"FlashAttention 改善精确注意力执行；PagedAttention 解决服务中的缓存管理。"},"now":{"en":"Optimize measured bottlenecks. These techniques do not fix missing evidence or wrong business logic.","zh":"优化实测瓶颈；这些技术不能补回缺失证据或修复错误业务逻辑。"},"refs":["P13","P14"]},{"year":"2023","lane":"models","title":{"en":"Cheaper adaptation; direct preference learning","zh":"更低成本适配与直接偏好学习"},"problem":{"en":"Adaptation must become more accessible and training pipelines simpler.","zh":"适配需要更可获得，训练流程需要更简洁。"},"change":{"en":"QLoRA combines quantization with adapters; DPO offers a direct preference objective.","zh":"QLoRA 结合量化与适配器；DPO 提供直接偏好目标。"},"now":{"en":"Select an intervention from the observed error, not from whichever acronym is newest.","zh":"根据观察到的错误选择干预，而不是追逐最新缩写。"},"refs":["P11","P12"]},{"year":"2023","lane":"models","title":{"en":"Long context and alternative architectures","zh":"长上下文与替代架构"},"problem":{"en":"Long sequences stress both useful evidence access and computation.","zh":"长序列同时考验有效证据使用与计算。"},"change":{"en":"Lost in the Middle studies context-use limitations; Mamba develops selective state-space modeling.","zh":"Lost in the Middle 研究上下文使用限制；Mamba 发展选择性状态空间建模。"},"now":{"en":"Capacity, effective use and architecture are separate questions. The timeline branches rather than replacing everything with one model.","zh":"容量、有效使用与架构是不同问题；技术沿分支发展，而非由单一模型替代一切。"},"refs":["P15","P18"]},{"year":"2024","lane":"knowledge","title":{"en":"GraphRAG adds corpus structure","zh":"GraphRAG 引入语料结构"},"problem":{"en":"Some questions ask about themes and relationships across many documents, not one relevant passage.","zh":"某些问题关注跨多文档的主题与关系，而非单一相关段落。"},"change":{"en":"Microsoft’s approach extracts a graph and community summaries for local and global retrieval.","zh":"微软方案提取图与社区摘要，支持局部与全局检索。"},"now":{"en":"Graph construction adds cost and error surfaces. Compare with ordinary RAG and SQL baselines.","zh":"建图增加成本与错误面，应与普通 RAG 和 SQL 基线比较。"},"refs":["P16","S21"]},{"year":"2024","lane":"agents","title":{"en":"MCP standardizes integrations","zh":"MCP 标准化集成接口"},"problem":{"en":"Repeated custom tool connections create integration friction.","zh":"重复定制工具连接造成集成摩擦。"},"change":{"en":"The November MCP announcement introduces a shared protocol for AI applications and capability servers.","zh":"11 月发布的 MCP 为 AI 应用与能力服务器提供共同协议。"},"now":{"en":"A protocol improves interoperability, not authorization or task success by itself.","zh":"协议改善互操作性，本身不保证授权正确或任务成功。"},"refs":["H03","S28"]},{"year":"2025","lane":"models","title":{"en":"A concrete reasoning-training case","zh":"一个具体推理训练案例"},"problem":{"en":"Developing stronger task reasoning is not only a prompt-format problem.","zh":"发展更强任务推理能力，并不只是提示格式问题。"},"change":{"en":"DeepSeek-R1 reports reasoning-oriented reinforcement-learning methods.","zh":"DeepSeek-R1 报告面向推理的强化学习方法。"},"now":{"en":"This is one published recipe, not a universal description of all frontier models. Validate task outcomes.","zh":"这是一种公开方法，不代表全部前沿模型，应验证任务结果。"},"refs":["P17"]},{"year":"2025","lane":"agents","title":{"en":"Context, skills and agent interoperability","zh":"上下文、技能与智能体互操作"},"problem":{"en":"More tools and longer tasks create context and coordination complexity.","zh":"更多工具和更长任务带来上下文与协调复杂性。"},"change":{"en":"Engineering guidance emphasizes selected context, packaged skills and separate A2A communication concerns.","zh":"工程实践强调精选上下文、打包技能，以及独立的 A2A 通信问题。"},"now":{"en":"Procedures, callable tools, persisted memory and agent-to-agent protocols are distinct layers.","zh":"操作程序、可调用工具、持久记忆和智能体间协议是不同层。"},"refs":["S27","S29","S30","H04"]},{"year":"2026","lane":"systems","title":{"en":"Agent evaluation gets more explicit","zh":"智能体评估进一步明确"},"problem":{"en":"A successful-looking transcript is not a reproducible operational result.","zh":"看起来成功的对话轨迹不等于可复现的运行结果。"},"change":{"en":"Anthropic’s January 2026 guide clarifies tasks, trials, graders, traces and outcomes.","zh":"Anthropic 在 2026 年 1 月的指南中厘清任务、试验、评分器、轨迹和结果。"},"now":{"en":"Use outcome-based evals and real error slices. This dated example is not a claim to cover every 2026 development.","zh":"采用面向结果的评估与真实错误切片。此日期案例并不声称涵盖 2026 年所有进展。"},"refs":["S34"]}],"quiz":[{"id":"q1","prompt":{"en":"The quote is eloquent but the ERP part is wrong. What do you inspect first?","zh":"报价很流畅，但 ERP 商品错了。先检查什么？"},"options":[{"en":"Increase temperature.","zh":"提高温度。"},{"en":"Inspect extraction, candidate matching and the authoritative part record.","zh":"检查提取、候选匹配和权威商品记录。"},{"en":"Switch to a multi-agent framework.","zh":"换成多智能体框架。"}],"correct":1,"explanation":{"en":"The failure is in a data or matching layer. Better prose and extra autonomy do not establish the correct identity.","zh":"失败位于数据或匹配层；更好的表达和更多自主性不能确定正确身份。"},"module":"m4"},{"id":"q2","prompt":{"en":"Prices change daily and differ by customer permission. First architectural move?","zh":"价格每日变化，且不同客户权限不同。架构上第一步怎么做？"},"options":[{"en":"Fine-tune prices into model weights every evening.","zh":"每晚把价格微调进模型权重。"},{"en":"Put every customer price in a shared prompt.","zh":"把所有客户价格放进共享提示。"},{"en":"Query the authorized source at request time, then validate its result.","zh":"请求时查询获授权的权威来源，再验证结果。"}],"correct":2,"explanation":{"en":"Freshness and access scope belong to the data-access system. Fine-tuning does not enforce record-level permission.","zh":"新鲜度与访问范围属于数据访问系统；微调不能执行记录级权限。"},"module":"m2"},{"id":"q3","prompt":{"en":"A model produces schema-valid JSON with an invented currency code. Is the output acceptable?","zh":"模型生成符合结构的 JSON，但币种代码是编造的。能接受吗？"},"options":[{"en":"No: validate business semantics and evidence separately.","zh":"不能：必须另行验证业务语义和证据。"},{"en":"Yes: a schema guarantees truth.","zh":"可以：结构定义能保证事实真实。"},{"en":"Yes, at temperature zero.","zh":"温度为零时可以。"}],"correct":0,"explanation":{"en":"Structural conformance is not factual validity. Handle unsupported values, refusals and incomplete output explicitly.","zh":"结构符合不等于事实有效；应明确处理不支持的值、拒绝与不完整输出。"},"module":"m3"},{"id":"q4","prompt":{"en":"AX-120 and AX-12O differ by one character. What does a strong fuzzy match establish?","zh":"AX-120 与 AX-12O 只差一个字符。很强的模糊匹配说明什么？"},"options":[{"en":"They are interchangeable parts.","zh":"它们是可互换零件。"},{"en":"They are plausible spelling candidates requiring identity validation.","zh":"它们是拼写相近候选，需要验证身份。"},{"en":"Their vector meanings must be identical.","zh":"它们的向量语义一定相同。"}],"correct":1,"explanation":{"en":"Edit distance compares strings. In identifiers, a small edit may still refer to a different product.","zh":"编辑距离比较字符串；标识符差一个字符也可能代表另一种产品。"},"module":"m5"},{"id":"q5","prompt":{"en":"The relevant policy exists but never appears in the retrieved top results. What should you tune first?","zh":"相关政策确实存在，但从未进入检索前列。先调什么？"},"options":[{"en":"The answer’s writing style.","zh":"回答的文风。"},{"en":"The number of agents.","zh":"智能体数量。"},{"en":"Parsing, permission scope, chunking, query formation and ranking.","zh":"解析、权限范围、切块、查询构造与排序。"}],"correct":2,"explanation":{"en":"Diagnose retrieval before generation. Confirm authorized evidence is indexable and findable.","zh":"先诊断检索，再诊断生成；确认获授权证据能够被索引和找到。"},"module":"m5"},{"id":"q6","prompt":{"en":"A database can already answer the supplier–part–certificate question using well-maintained joins. Must you add a knowledge graph?","zh":"现有数据库通过维护良好的连接已能回答供应商—零件—证书问题。必须加知识图谱吗？"},"options":[{"en":"No. Compare incremental value, maintainability and cost before adding one.","zh":"不必。先比较增量价值、可维护性与成本。"},{"en":"Yes, because the question has multiple entities.","zh":"必须，因为问题包含多个实体。"},{"en":"Yes, because every RAG system needs a graph.","zh":"必须，因为所有 RAG 都需要图。"}],"correct":0,"explanation":{"en":"A graph is an architectural choice. Relationship modeling can help, but SQL may be the adequate simpler baseline.","zh":"图是一种架构选择；关系建模可能有帮助，但 SQL 可能是足够简单的基线。"},"module":"m6"},{"id":"q7","prompt":{"en":"The sequence is always extract → validate → look up → draft → approve. What is the most direct starting design?","zh":"顺序始终为提取→验证→查询→草稿→审批。最直接的起始设计是什么？"},"options":[{"en":"An unbounded general-purpose agent.","zh":"无边界通用智能体。"},{"en":"A deterministic workflow with LLM calls in suitable steps.","zh":"确定性工作流，在合适步骤调用大模型。"},{"en":"A separate agent for every database column.","zh":"每个数据库字段分配一个智能体。"}],"correct":1,"explanation":{"en":"Known control flow does not require the model to plan every step. Add autonomy only for demonstrated adaptive needs.","zh":"已知控制流程不需要模型规划每一步；只有确实需要自适应时才增加自主性。"},"module":"m7"},{"id":"q8","prompt":{"en":"A tool server supports MCP. Does that mean any connected user may create a quote?","zh":"工具服务器支持 MCP。是否意味着任何连接用户都能创建报价？"},"options":[{"en":"Yes, protocol compatibility is authorization.","zh":"是，协议兼容就代表授权。"},{"en":"Yes, if the tool schema is valid.","zh":"是，只要工具结构定义有效。"},{"en":"No, caller identity and business permissions still require enforcement.","zh":"否，仍必须执行调用身份与业务权限检查。"}],"correct":2,"explanation":{"en":"MCP standardizes interfaces. Tool schemas and successful connections do not grant business authority.","zh":"MCP 标准化接口；工具结构和连接成功都不授予业务权限。"},"module":"m8"},{"id":"q9","prompt":{"en":"An agent says “quote created” after a tool timeout. What counts as success?","zh":"工具超时后，智能体说“报价已创建”。什么才算成功？"},"options":[{"en":"Verify the intended authorized record exists once, with the correct contents.","zh":"验证目标获授权记录仅存在一次，且内容正确。"},{"en":"Trust the last sentence.","zh":"相信最后一句话。"},{"en":"Retry the write indefinitely.","zh":"无限重试写入。"}],"correct":0,"explanation":{"en":"Inspect environment state. Ambiguous write outcomes need reconciliation and idempotency, not blind retries.","zh":"应检查环境状态；写入结果不明时需要核对和幂等机制，而非盲目重试。"},"module":"m7"},{"id":"q10","prompt":{"en":"A vendor reports success at least once in ten tries. Does that establish reliable single-run production behavior?","zh":"供应商报告十次中至少成功一次。这证明生产单次运行可靠吗？"},"options":[{"en":"Yes, a success is a success.","zh":"是，成功就是成功。"},{"en":"No, report single-run and repeated-run metrics with the trial setup.","zh":"否，应说明试验设置，报告单次与多次运行指标。"},{"en":"Yes, if the explanation is detailed.","zh":"是，只要解释足够详细。"}],"correct":1,"explanation":{"en":"Best-of-many and consistent success are different. pass@k and pass^k answer different questions.","zh":"多次取最佳与稳定成功不同；pass@k 和 pass^k 回答不同问题。"},"module":"m9"},{"id":"q11","prompt":{"en":"Reviewers save 200 hours a month, but staffing and output have not changed. What can you safely claim?","zh":"审核人每月节省 200 小时，但人员和产出未变化。稳妥的表述是什么？"},"options":[{"en":"Guaranteed payroll savings equal 200 hours of salary.","zh":"保证节省相当于 200 小时工资的支出。"},{"en":"Guaranteed revenue uplift.","zh":"保证收入增长。"},{"en":"Measured time capacity was released; cash or output benefits need separate evidence.","zh":"实测释放了时间产能；现金或产出收益需要单独证据。"}],"correct":2,"explanation":{"en":"Time savings are not automatically cash savings. State the baseline, measurement method and realization mechanism.","zh":"节省时间不自动等于现金节省；应说明基线、测量方法与实现机制。"},"module":"m10"},{"id":"q12","prompt":{"en":"A POC has good technical scores but no sponsor with budget or authority to change the workflow. Next step?","zh":"POC 技术得分良好，但没有具备预算和流程变更权的支持者。下一步是什么？"},"options":[{"en":"Validate ownership, buying path and adoption constraints before adding features.","zh":"先验证责任人、购买路径与采用约束，再增加功能。"},{"en":"Assume another model upgrade will close the deal.","zh":"假设再升级一次模型就能成交。"},{"en":"Label the customer irrational.","zh":"认定客户不理性。"}],"correct":0,"explanation":{"en":"Commercial and technical feasibility are separate gates. Test the ownership hypothesis instead of hiding it as a model issue.","zh":"商业与技术可行性是不同关卡；应检验责任归属假设，而不是把问题包装成模型问题。"},"module":"m11"}],"days":[{"day":"01","title":{"en":"Orient and name the layers","zh":"建立系统层次感"},"modules":["m0"],"refs":["S02","S12"],"deliverable":{"en":"Explain the synthetic RFQ architecture in two minutes.","zh":"用两分钟解释合成询价案例的架构。"}},{"day":"02","title":{"en":"Look inside the model","zh":"走进模型内部"},"modules":["m1"],"refs":["S03","S05","S06"],"deliverable":{"en":"Draw the token-to-output path and complete the temperature lab.","zh":"画出从词元到输出的路径，完成温度实验。"}},{"day":"03","title":{"en":"Separate training and context","zh":"区分训练与上下文"},"modules":["m2"],"refs":["S10","S11","S38"],"deliverable":{"en":"Choose an intervention for five different failure types.","zh":"为五种失败选择对应干预。"}},{"day":"04","title":{"en":"Specify trustworthy extraction","zh":"定义可信提取"},"modules":["m3","m4"],"refs":["S31","S35"],"deliverable":{"en":"Produce a schema, provenance fields and review rules.","zh":"产出结构定义、来源字段与审核规则。"}},{"day":"05","title":{"en":"Retrieve the right evidence","zh":"检索正确证据"},"modules":["m5"],"refs":["S16","S17","S18"],"deliverable":{"en":"Compare fuzzy, lexical, semantic and hybrid retrieval.","zh":"比较模糊、词法、语义与混合检索。"}},{"day":"06","title":{"en":"Use relationships deliberately","zh":"有意识地使用关系"},"modules":["m6"],"refs":["S19","S21"],"deliverable":{"en":"Defend SQL versus graph retrieval for a multi-hop question.","zh":"为多跳问题选择 SQL 或图检索并说明理由。"}},{"day":"07","title":{"en":"Control the agent loop","zh":"控制智能体循环"},"modules":["m7"],"refs":["S23","S24"],"deliverable":{"en":"Run the action stepper and identify the approval boundary.","zh":"运行行动实验并指出审批边界。"}},{"day":"08","title":{"en":"Connect tools with clear contracts","zh":"用清晰契约连接工具"},"modules":["m8"],"refs":["S28","S29","S32"],"deliverable":{"en":"Write one read-only and one write-tool contract.","zh":"编写一个只读工具和一个写工具契约。"}},{"day":"09","title":{"en":"Test outcomes, estimate costs","zh":"验证结果，估算成本"},"modules":["m9","m10"],"refs":["S33","S34","S37"],"deliverable":{"en":"Define ten evaluation cases and a cost-per-accepted-task estimate.","zh":"定义十个评估案例并估算单位被接受任务成本。"}},{"day":"10","title":{"en":"Give a design review","zh":"进行设计评审"},"modules":["m11"],"refs":["S15","S23"],"deliverable":{"en":"Complete the scenario check and present the capstone to a teammate.","zh":"完成场景测验，并向同事展示毕业设计。"}}],"comparisons":[{"title":{"en":"RAG ≠ fine-tuning","zh":"RAG ≠ 微调"},"a":{"en":"RAG changes the evidence supplied to a call.","zh":"RAG 改变某次调用获得的证据。"},"b":{"en":"Fine-tuning changes model parameters.","zh":"微调改变模型参数。"},"rule":{"en":"Fresh facts and permissions usually belong in data access; stable behavior may justify adaptation.","zh":"实时事实与权限通常属于数据访问；稳定行为需求可能适合微调。"},"module":"m2"},{"title":{"en":"Fuzzy ≠ semantic","zh":"模糊匹配 ≠ 语义检索"},"a":{"en":"Fuzzy matching compares character edits.","zh":"模糊匹配比较字符编辑。"},"b":{"en":"Semantic retrieval compares learned meaning representations.","zh":"语义检索比较学习到的意义表示。"},"rule":{"en":"Treat similar part codes as candidates, not verified equivalents.","zh":"把相近料号当候选，而不是已确认等价项。"},"module":"m5"},{"title":{"en":"Knowledge graph ≠ vector index","zh":"知识图谱 ≠ 向量索引"},"a":{"en":"A knowledge graph stores explicit domain relationships.","zh":"知识图谱保存显式领域关系。"},"b":{"en":"A vector index supports similarity search over representations.","zh":"向量索引支持表示之间的相似性搜索。"},"rule":{"en":"HNSW uses a graph internally, but it does not model business relationships.","zh":"HNSW 内部使用图，但不建模业务关系。"},"module":"m6"},{"title":{"en":"Workflow ≠ agent","zh":"工作流 ≠ 智能体"},"a":{"en":"Code defines a workflow’s next steps.","zh":"工作流的下一步由代码定义。"},"b":{"en":"An agent gives a model bounded control over next actions.","zh":"智能体让模型对下一步行动拥有受限控制权。"},"rule":{"en":"Use the least autonomy that solves the task.","zh":"采用足以解决任务的最小自主性。"},"module":"m7"},{"title":{"en":"Tool ≠ skill ≠ memory","zh":"工具 ≠ 技能 ≠ 记忆"},"a":{"en":"A tool is callable capability; a skill is procedural guidance.","zh":"工具是可调用能力；技能是操作指引。"},"b":{"en":"Memory is persisted information with a lifecycle.","zh":"记忆是有生命周期的持久信息。"},"rule":{"en":"Interoperability, knowledge and authorization remain separate responsibilities.","zh":"互操作性、知识与授权仍是独立责任。"},"module":"m8"},{"title":{"en":"Valid structure ≠ true content","zh":"结构有效 ≠ 内容真实"},"a":{"en":"A schema constrains the shape of a response.","zh":"结构定义约束响应形式。"},"b":{"en":"Evidence and business validation assess its claims.","zh":"证据与业务验证评估内容。"},"rule":{"en":"A correct JSON object can contain a wrong price.","zh":"完全正确的 JSON 也可能包含错误价格。"},"module":"m3"},{"title":{"en":"Model confidence ≠ calibrated risk","zh":"模型自信 ≠ 已校准风险"},"a":{"en":"A generated confidence number may be unsupported.","zh":"生成的置信数字可能没有依据。"},"b":{"en":"Calibration requires comparison to measured outcomes.","zh":"校准需要与实测结果比较。"},"rule":{"en":"Set automation thresholds using task-specific validation, not persuasive wording.","zh":"自动化阈值应基于任务验证，而非有说服力的措辞。"},"module":"m9"},{"title":{"en":"Time saved ≠ cash saved","zh":"节省时间 ≠ 节省现金"},"a":{"en":"Less manual time creates available capacity.","zh":"减少人工时间释放可用产能。"},"b":{"en":"Realized cash benefit needs an attributable financial mechanism.","zh":"已实现现金收益需要可归因的财务机制。"},"rule":{"en":"Document adoption, costs and how capacity becomes business value.","zh":"记录采用、成本以及产能如何转成业务价值。"},"module":"m10"}],"templates":[{"id":"discovery","title":{"en":"01 · Workflow discovery","zh":"01 · 流程发现"},"intro":{"en":"Use a recent case, not a hypothetical ideal workflow.","zh":"使用近期真实案例，而不是假想的理想流程。"},"fields":[{"en":"Task, operator and frequency","zh":"任务、操作人、频次"},{"en":"Current steps, systems and exception paths","zh":"当前步骤、系统与例外路径"},{"en":"Inputs, access rights and source owners","zh":"输入、访问权限与来源负责人"},{"en":"Baseline time, errors and measurement method","zh":"基线时间、错误与测量方法"},{"en":"Decision owner, approver and economic buyer","zh":"决策人、审批人和经济买方"},{"en":"Success criteria and unacceptable consequences","zh":"成功标准与不可接受后果"}]},{"id":"design","title":{"en":"02 · Architecture review","zh":"02 · 架构评审"},"intro":{"en":"Choose the simplest adequate design and name the uncertainty.","zh":"选择足够简单的可行设计，并明确不确定性。"},"fields":[{"en":"Non-LLM baseline and proposed architecture","zh":"非大模型基线与拟议架构"},{"en":"Where model judgment is needed—and where it is prohibited","zh":"哪里需要模型判断，哪里禁止"},{"en":"Sources, retrieval method, freshness and provenance","zh":"来源、检索方法、新鲜度与来源证据"},{"en":"Tool permissions, approval and idempotency","zh":"工具权限、审批与幂等性"},{"en":"Evaluation cases, error slices and acceptance thresholds","zh":"评估案例、错误切片与验收阈值"},{"en":"Latency, cost assumptions, fallback and rollback owner","zh":"延迟、成本假设、降级与回滚责任人"}]},{"id":"products","title":{"en":"03 · Internal product handoff · #2","zh":"03 · 内部产品交接 · 第 2 项"},"intro":{"en":"To be populated with your colleagues’ verified customer and product evidence. This atlas does not supply it.","zh":"由你们同事填入经过核实的客户与产品证据，本站不代填。"},"fields":[{"en":"Customer profile, core need and original workflow","zh":"客户画像、核心诉求与原流程"},{"en":"Prior approach, competitors and simpler alternatives","zh":"原方案、竞对与更简单的替代方案"},{"en":"What we did differently and why it mattered","zh":"我们做对了什么、不同在哪里、为何重要"},{"en":"Measured baseline and customer-accepted result; dates and evidence","zh":"实测基线与客户认可结果；日期及证据"},{"en":"Adoption, review effort, ongoing delivery cost and value realization","zh":"采用情况、审核工作、持续交付成本与价值实现"},{"en":"Charging model, unit, willingness-to-pay evidence and risk allocation","zh":"收费模式、计价单位、付费意愿证据与风险分配"}]},{"id":"postmortem","title":{"en":"04 · Stalled / failed case review · #3","zh":"04 · 卡顿／失败案例复盘 · 第 3 项"},"intro":{"en":"Distinguish pre-POC stalls from POC failures; retain competing explanations.","zh":"区分 POC 前卡顿与 POC 后失败，保留不同解释。"},"fields":[{"en":"Stage, timeline, stated goal and decision that stalled","zh":"阶段、时间线、目标与停滞的决策"},{"en":"Commercial hypotheses: sponsor, budget, procurement, incentives","zh":"商业假设：推动者、预算、采购、激励"},{"en":"Technical/product hypotheses: data, evals, integration, UX, reliability","zh":"技术产品假设：数据、评估、集成、体验、可靠性"},{"en":"Evidence supporting or contradicting each explanation","zh":"支持或反驳各解释的证据"},{"en":"Interaction between business and technical blockers","zh":"商业与技术阻力如何互相影响"},{"en":"Next discriminating test, owner, cost and stop/restart condition","zh":"下一项辨别性测试、责任人、成本与停止／重启条件"}]}]}</script><script>'use strict';
const D=JSON.parse(document.getElementById('atlas-data').textContent);
const STORE='tsingj-ai-atlas-v1';
const DEFAULT={schema:'tsingj-ai-atlas-progress-v1',lang:'en',done:[],bookmarks:[],notes:{},answers:{}};
let persistence=true;
let S=structuredClone(DEFAULT);
try{const raw=localStorage.getItem(STORE);if(raw)S=sanitize(JSON.parse(raw));}catch(e){persistence=false;}
const ui={map:'m0',track:'core',termQ:'',termCat:'all',termLevel:'all',resourceQ:'',resourceKind:'all',resourceLevel:'all',resourceLang:'all',resourceVisual:false,resourceSaved:false,resourceModule:'all',lane:'all',lab:'system',systemStep:0,modelStep:0,attentionRow:5,temp:1,query:'code',retrieval:'hybrid',scope:'A',graphDate:'2026-09-22',graphVerified:true,graphNode:'part',agentMode:'workflow',agentStep:0,agentFail:false,threshold:85,toolkit:'decision',decision:0,quiz:0,template:'discovery',economics:{tasks:1000,success:85,inputTokens:2500,outputTokens:600,calls:2,inputRate:2,outputRate:8,other:.03,reviewRate:30,reviewMins:3,hourly:25,fixed:500,baselineMins:8}};
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const e=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const t=(en,zh)=>S.lang==='zh'?zh:en;
const v=x=>typeof x==='string'?x:(x?.[S.lang]??x?.en??'');
const mod=id=>D.modules.find(m=>m.id===id);
const src=id=>D.sources.find(s=>s.id===id);
const label={home:()=>t('Start here','从这里开始'),path:()=>t('Learning path','学习路线'),lesson:()=>t('Learning path','学习路线'),glossary:()=>t('Jargon atlas','术语地图'),history:()=>t('Evolution','技术演化'),labs:()=>t('Visual labs','交互实验'),library:()=>t('Learning library','学习资料库'),toolkit:()=>t('FDE fieldbook','FDE 实战手册'),about:()=>t('About this atlas','关于本站')};
const catLabel=id=>v(D.categories.find(x=>x.id===id)?.title);
const levelLabel=id=>({core:t('Core fluency','核心素养'),deeper:t('Go deeper','进阶'),start:t('Start here','入门'),reference:t('Reference','参考')})[id]||id;
const kindLabel=id=>({course:t('Course','课程'),video:t('Video / animation','视频／动画'),article:t('Article','文章'),interactive:t('Interactive','交互演示'),book:t('Book','教材'),guide:t('Guide','指南'),docs:t('Documentation','文档'),standard:t('Standard / framework','标准／框架'),paper:t('Research paper','研究论文')})[id]||id;
const laneLabel=id=>({models:t('Models & learning','模型与学习'),retrieval:t('Search & retrieval','搜索与检索'),knowledge:t('Explicit knowledge','显式知识'),agents:t('Agents & interfaces','智能体与接口'),systems:t('Systems & evaluation','系统与评估')})[id]||id;
const labNames={system:()=>t('System map','系统地图'),model:()=>t('Inside a model','模型内部'),retrieval:()=>t('Retrieval','检索'),graph:()=>t('Graph traversal','图遍历'),agent:()=>t('Agent loop','智能体循环'),eval:()=>t('Evaluation','评估'),economics:()=>t('Unit economics','单位成本')};
function sanitize(x){
 const out=structuredClone(DEFAULT);if(!x||typeof x!=='object')return out;
 if(['en','zh'].includes(x.lang))out.lang=x.lang;
 if(Array.isArray(x.done))out.done=[...new Set(x.done.filter(id=>D.modules.some(m=>m.id===id)))];
 if(Array.isArray(x.bookmarks))out.bookmarks=[...new Set(x.bookmarks.filter(id=>D.sources.some(s=>s.id===id)))];
 if(x.notes&&typeof x.notes==='object')for(const [k,val] of Object.entries(x.notes).slice(0,100)){if(/^(m\d+|template-(discovery|design|products|postmortem)-[0-5]|capstone)$/.test(k)&&typeof val==='string')out.notes[k]=val.slice(0,20000);}
 if(x.answers&&typeof x.answers==='object')for(const q of D.quiz){if(Number.isInteger(x.answers[q.id])&&x.answers[q.id]>=0&&x.answers[q.id]<q.options.length)out.answers[q.id]=x.answers[q.id];}
 return out;
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));persistence=true;}catch(err){persistence=false;}updateProgress();}
function toast(msg){let el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3000);}
function refs(ids){return `<div class="source-links" aria-label="${t('Sources','来源')}">${ids.filter(id=>src(id)).map(id=>`<a href="${e(src(id).url)}" target="_blank" rel="noopener noreferrer" title="${e(src(id).title)}">${e(id)} ↗</a>`).join('')}</div>`;}
function tags(items){return `<div class="tags">${items.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div>`;}
function button(text,act,val='',cls=''){return `<button class="btn ${cls}" data-act="${act}" data-val="${e(val)}">${text}</button>`;}
function bookmark(id){const yes=S.bookmarks.includes(id);return `<button class="bookmark ${yes?'saved':''}" data-act="bookmark" data-val="${id}" aria-pressed="${yes}" aria-label="${t(yes?'Remove bookmark':'Bookmark resource',yes?'取消收藏':'收藏资料')}">${yes?'★':'☆'}</button>`;}
function pageHead(kicker,title,desc){return `<header class="page-head"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="lead">${desc}</p></header>`;}
function note(key,rows=5){return `<label class="note-label" for="note-${key}">${t('Your working notes · stored on this browser','学习笔记 · 保存在此浏览器')}</label><textarea id="note-${key}" data-note="${key}" rows="${rows}" placeholder="${t('Explain it in your own words. Avoid confidential or personal data.','用自己的话解释。请勿填写机密或个人敏感数据。')}">${e(S.notes[key]||'')}</textarea><span class="note-status">${persistence?t('Saved locally as you type. Export a backup to move devices.','输入时自动本地保存。跨设备请导出备份。'):t('Browser storage unavailable. Export your notes before leaving.','浏览器存储不可用，离开前请导出笔记。')}</span>`;}
function route(){const parts=decodeURIComponent(location.hash.slice(1)||'home').split('/');return {name:parts[0],id:parts[1]};}
function go(hash){if(location.hash==='#'+hash)render(false);else location.hash=hash;}
function updateProgress(){const p=Math.round(S.done.length/D.modules.length*100);const bar=$('#sidebar-progress');if(bar)bar.style.width=p+'%';const txt=$('#progress-text');if(txt)txt.textContent=S.done.length+' / '+D.modules.length;}
function chrome(){const r=route();document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';document.title=t('TsingJ · Applied AI Atlas','TsingJ · 应用 AI 学习地图');$('#brand-sub').textContent=t('APPLIED AI ATLAS','应用 AI 学习地图');$('#navigation').innerHTML=['home','path','glossary','history','labs','library','toolkit'].map((id,i)=>`<a class="navitem ${r.name===id||(id==='path'&&r.name==='lesson')?'active':''}" href="#${id}" ${r.name===id?'aria-current="page"':''}><span class="navno">0${i+1}</span><span>${label[id]()}</span></a>`).join('');$('#progress-heading').textContent=t('Learning progress','学习进度');$('#edition').innerHTML=`VOL. 01 / 2026.09<br>${t('TECHNICAL FLUENCY → REAL WORK','技术素养 → 真实工作')}`;$('#breadcrumb').textContent='TsingJ / '+(label[r.name]?.()||label.home());$('#lang-en').classList.toggle('active',S.lang==='en');$('#lang-zh').classList.toggle('active',S.lang==='zh');$('#lang-en').setAttribute('aria-pressed',S.lang==='en');$('#lang-zh').setAttribute('aria-pressed',S.lang==='zh');$('#quick-search').placeholder=t('Find a term…','搜索术语…');$('#quick-search').setAttribute('aria-label',t('Search the jargon atlas','搜索术语地图'));$('#menu').setAttribute('aria-label',t('Toggle navigation','切换导航'));$('#skip').textContent=t('Skip to content','跳转到正文');$('#navigation').setAttribute('aria-label',t('Main navigation','主导航'));$('#export-top').textContent=t('Export','导出');updateProgress();}
function footer(){return `<footer class="site-footer"><p>${t('Original bilingual explanations and diagrams. All labs use synthetic teaching data; no model calls or customer records. External sources checked 22 Sep 2026.','原创双语解释与图示。全部实验使用合成教学数据，不调用模型，不包含客户记录。外部来源核对日期：2026 年 9 月 22 日。')}</p><a href="#about" class="textlink">${t('Scope, sources & backups','范围、来源与备份')} ↗</a></footer>`;}
function render(keep=true){const y=scrollY;const r=route();chrome();let html='';switch(r.name){case'home':html=home();break;case'path':html=pathPage();break;case'lesson':html=lesson(r.id);break;case'glossary':html=glossaryPage();break;case'history':html=historyPage();break;case'library':html=libraryPage();break;case'labs':if(r.id&&labNames[r.id])ui.lab=r.id;html=labsPage();break;case'toolkit':if(['decision','quiz','templates'].includes(r.id))ui.toolkit=r.id;html=toolkitPage();break;case'about':html=aboutPage();break;default:html=home();}
 $('#main').innerHTML=html+footer();if(keep)requestAnimationFrame(()=>scrollTo({top:y,behavior:'instant'}));else{scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}

esson','本课内容')}</h3>${m.blocks.map((b,i)=>`<button class="toc" style="display:block;text-align:left;font-size:12px;padding:6px 0;color:var(--muted)" data-act="scroll" data-val="block-${i}">${e(v(b.title))}</button>`).join('')}</div><div class="card"><h3>${t('Key terms','关键词')}</h3>${terms.map(g=>`<a class="module-chip" href="#glossary/${g.id}">${e(S.lang==='zh'?g.cn:g.term)}</a>`).join('')}<button class="textlink" data-act="terms-module" data-val="${m.id}">${t('Explore related terms','查看相关术语')} →</button></div><div class="card soft"><h3>${t('Before this lesson','前置知识')}</h3>${m.prereq.length?m.prereq.map(id=>`<a class="toc" href="#lesson/${id}">${e(v(mod(id).title))}</a>`).join(''):`<p class="small muted">${t('No prerequisite. Start here.','无需前置知识，从这里开始。')}</p>`}<p class="footnote">${t('The external source language is not changed by the atlas toggle. Chinese learning routes are available in the library.','本站语言切换不会改变外部资料的语言。资料库提供中文学习路线。')}</p></div></aside></div>`;}

function glossaryPage(){return pageHead('02 / '+t('JARGON ATLAS','术语地图'),t('Name the idea. Know the boundary.','认识概念，也认识边界。'),t('191 practical terms, organized by the decisions they support. Search in either language, even when the interface is in the other. This is a broad working vocabulary—not an exhaustive list of AI.','191 个实用术语，按其支持的决策分类。无论界面语言是什么，都可以中英文搜索。这是广泛的工作词汇表，不是 AI 全部术语的穷尽清单。'))+`<div class="filters"><input type="search" id="term-search" value="${e(ui.termQ)}" placeholder="${t('Search RAG, attention, 量化, 知识图谱…','搜索 RAG、attention、量化、知识图谱…')}" aria-label="${t('Search terms','搜索术语')}"><select id="term-category" aria-label="${t('Category','分类')}"><option value="all">${t('All categories','全部分类')}</option>${D.categories.map(c=>`<option value="${c.id}" ${ui.termCat===c.id?'selected':''}>${e(v(c.title))}</option>`).join('')}</select><select id="term-level" aria-label="${t('Learning depth','学习深度')}"><option value="all">${t('All depths','全部深度')}</option>${['core','deeper'].map(id=>`<option value="${id}" ${ui.termLevel===id?'selected':''}>${levelLabel(id)}</option>`).join('')}</select>${button(t('Clear','清除'),'clear-terms','','small')}</div><div id="term-results">${termResults()}</div><section class="section-gap"><h2>${t('Keep these distinctions close','牢记这些区别')}</h2><div class="grid2">${D.comparisons.map(comparison).join('')}</div></section>`;}

function historyPage(){return pageHead('03 / '+t('HISTORY & GENEALOGY','历史与谱系'),t('Several lineages.<br>One application stack.','多条技术路线，<br>汇聚到同一应用系统。'),t('Read this as a branching genealogy, not a ladder of obsolete technologies. Search, explicit knowledge, neural models and systems engineering still coexist. Dates refer to selected publications or announcements.','把它看作分支谱系，而非旧技术被逐级淘汰的阶梯。搜索、显式知识、神经模型与系统工程仍然共存。日期对应选定论文或发布说明。'))+`<div class="branch-diagram"><div class="branch-row"><div class="branch-col"><b>${t('Information retrieval','信息检索')}</b><p>${t('Term ranking → dense retrieval → hybrid RAG','词项排序 → 稠密检索 → 混合 RAG')}</p></div><div class="branch-col"><b>${t('Knowledge representation','知识表示')}</b><p>${t('Explicit statements → domain graphs → graph-enhanced retrieval','显式陈述 → 领域图 → 图增强检索')}</p></div><div class="branch-col"><b>${t('Neural sequence modeling','神经序列建模')}</b><p>${t('Learned vectors → attention → pretrained & adapted models','学习向量 → 注意力 → 预训练与适配模型')}</p></div></div><div class="convergence">↓ &nbsp; ${t('APPLICATIONS: context + tools + controlled action + evaluation','应用系统：上下文 + 工具 + 受控行动 + 评估')} &nbsp; ↓</div></div><div class="filters"><label for="history-lane" class="small">${t('Follow a lineage','沿一条路线阅读')}</label><select id="history-lane"><option value="all">${t('All lineages','全部路线')}</option>${['models','retrieval','knowledge','agents','systems'].map(id=>`<option value="${id}" ${ui.lane===id?'selected':''}>${laneLabel(id)}</option>`).join('')}</select><span class="small muted">${t('Open a milestone for the problem → change → present role.','展开节点，查看问题 → 改变 → 当下作用。')}</span></div><div class="timeline">${D.timeline.filter(x=>ui.lane==='all'||x.lane===ui.lane).map((x,i)=>`<article class="milestone"><div class="year">${x.year}</div><details class="card" ${i<3?'open':''}><summary><h3>${e(v(x.title))}</h3><span class="tag">${laneLabel(x.lane)}</span></summary><div class="history-row"><b>${t('THE PROBLEM','当时的问题')}</b><p>${e(v(x.problem))}</p></div><div class="history-row"><b>${t('WHAT CHANGED','发生了什么')}</b><p>${e(v(x.change))}</p></div><div class="history-row"><b>${t('WHY IT STILL MATTERS','今天的作用')}</b><p>${e(v(x.now))}</p></div>${refs(x.refs)}</details></article>`).join('')}</div><div class="callout sage">${t('Before 1995: rules, symbolic AI, statistics, neural networks and search all have earlier histories. This selected timeline begins with anchors most useful for understanding today’s applied LLM stack; it is not a full history of artificial intelligence.','1995 年之前：规则、符号 AI、统计、神经网络与搜索都有更早历史。此处从最有助于理解当下大模型应用系统的节点入手，不是人工智能完整历史。')}</div>`;}
