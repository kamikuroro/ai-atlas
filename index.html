function resourceResults(){const q=ui.resourceQ.toLocaleLowerCase().trim();const items=D.sources.filter(s=>(ui.resourceKind==='all'||s.kind===ui.resourceKind)&&(ui.resourceLevel==='all'||s.level===ui.resourceLevel)&&(ui.resourceLang==='all'||s.lang===ui.resourceLang||s.lang==='both')&&(!ui.resourceVisual||s.visual)&&(!ui.resourceSaved||S.bookmarks.includes(s.id))&&(ui.resourceModule==='all'||s.modules.includes(ui.resourceModule))&&(!q||[s.id,s.title,s.author,s.why.en,s.why.zh,s.selection.en,s.selection.zh].join(' ').toLocaleLowerCase().includes(q)));return `<p class="filter-count" aria-live="polite">${items.length} / ${D.sources.length} ${t('sources','条来源')} · ${t('External pages open in a new tab. Access conditions can change.','外部页面在新标签打开，访问条件可能变化。')}</p><div class="resource-grid">${items.length?items.map(s=>`<article class="card resource" id="source-${s.id}"><div class="between"><div class="tags"><span class="tag redtag">${s.id}</span><span class="tag">${kindLabel(s.kind)}</span>${s.visual?`<span class="tag green">${t('Visual','图解')}</span>`:''}</div>${bookmark(s.id)}</div><h3><a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.title)} ↗</a></h3><div class="byline">${e(s.author)}${s.year?' · '+e(s.year):''} · ${s.lang==='both'?t('English + Chinese entries','中英文入口'):s.lang==='zh'?t('Chinese','中文'):t('English','英文')} · ${levelLabel(s.level)}</div><p class="why">${e(v(s.why))}</p><div class="readthis"><b>${t('Read / watch this first','先读／先看什么')}</b>${e(v(s.selection))}</div><div class="resource-footer"><span class="status">${s.status==='listing'?t('LISTING CHECKED','已核对课程介绍'):s.status==='abstract'?t('ABSTRACT / RECORD CHECKED','已核对摘要／记录'):t('PAGE CHECKED','已核对页面')}<br>2026-09-22</span><span class="small muted">${s.minutes} ${t('min first pass','分钟首轮参考')}</span></div></article>`).join(''):`<div class="empty">${t('No matching resources. Clear a filter or bookmark something first.','没有匹配资料，请清除筛选，或先收藏资料。')}</div>`}</div>`;}
function labsPage(){return pageHead('05 / '+t('VISUAL LABORATORY','可视化实验室'),t('Make the concepts move.','让概念动起来。'),t('Seven small experiments for developing intuition. All records, scores, attention weights and costs are synthetic. Arithmetic is real; no trained model, embedding service or business system is called.','七个帮助建立直觉的小实验。记录、分数、注意力权重和成本均为合成示例。数学计算真实执行，但不调用已训练模型、嵌入服务或业务系统。'))+`<div class="tabs">${Object.entries(labNames).map(([id,fn])=>`<button class="${ui.lab===id?'active':''}" data-act="lab" data-val="${id}">${fn()}</button>`).join('')}</div>`+({system:systemLab,model:modelLab,retrieval:retrievalLab,graph:graphLab,agent:agentLab,eval:evalLab,economics:economicsLab}[ui.lab]||systemLab)();}
function labHeading(title,desc,ids){return `<header class="lab-head"><h2>${title}</h2><p class="lab-sub">${desc}</p>${refs(ids)}</header>`;}
function systemLab(){const layers=[
[t('Receive & identify','接收与识别'),t('Email / files','邮件／文件'),t('Who sent this request? Which tenant and user own it? Store the source and ingest idempotently. A mailbox connector supplies data; it does not decide the customer’s permissions.','谁发送请求？归属哪个租户和用户？保留来源并幂等采集。邮箱连接器提供数据，不负责决定客户权限。'),t('Application + connector','应用与连接器')],
[t('Extract & validate','提取与验证'),t('Text / tables / images','文本／表格／图像'),t('Parse native structure, use OCR or vision where needed, and extract typed fields. Retain raw values and source locations. Validate identifiers, quantities and units before proceeding.','解析原生结构，按需使用 OCR 或视觉能力，提取带类型字段。保留原值与来源位置，继续之前验证标识、数量和单位。'),t('Model + deterministic checks','模型与确定性检查')],
[t('Match & retrieve','匹配与检索'),t('ERP / approved evidence','ERP／获授权证据'),t('Query authoritative records under the caller’s permissions. Use exact and fuzzy identifiers, lexical or semantic retrieval as appropriate. A retrieved candidate is not automatically the correct part.','在调用者权限下查询权威记录，按需采用精确、模糊、词法或语义检索。检索候选并不自动等于正确零件。'),t('Data access layer','数据访问层')],
[t('Prepare a draft','准备草稿'),t('Model + business rules','模型与业务规则'),t('Provide only relevant, authorized evidence. Generate a draft with explicit evidence IDs and unresolved fields. Use ordinary software for arithmetic and business constraints.','仅提供相关且获授权的证据，生成带证据 ID 和未解决字段的草稿。用普通软件执行计算与业务约束。'),t('Orchestrator + model','编排器与模型')],
[t('Review & approve','审核与批准'),t('Human decision','人工决策'),t('Show proposed values beside their source evidence and alternatives. Approval must refer to the actual proposed action and its current data—not a vague “looks good” flag.','把建议值与来源和候选并排展示。审批应针对实际待执行行动与当前数据，而不是模糊的“看起来不错”标记。'),t('Authorized reviewer','获授权审核人')],
[t('Write & verify','写入与验证'),t('Idempotent transaction','幂等事务'),t('The application performs an approved, authorized write. Use an idempotency key, inspect the resulting record and reconcile uncertain outcomes. The model saying “done” is not sufficient.','应用执行经过审批与授权的写入。使用幂等键、检查结果记录并核对不明确的状态。模型说“完成”并不足够。'),t('Application + ERP owner','应用与 ERP 负责人')]];const x=layers[ui.systemStep];return labHeading(t('The model sits inside a system.','模型位于系统之中。'),t('Click each stage of the fictional email-to-quote workflow. The important boundary is who owns the decision and its consequences.','点击虚构邮件报价流程中的各阶段。关键边界是：谁拥有决策权，谁承担后果。'),['S15','S23','S31','S33'])+`<div class="lab-panel"><div class="flow">${layers.map((x,i)=>`<button class="flow-box ${ui.systemStep===i?'active':''}" data-act="system-step" data-val="${i}" aria-pressed="${ui.systemStep===i}"><small>0${i+1}</small><b>${x[0]}</b><span class="small muted">${x[1]}</span></button>`).join('')}</div><div class="flow-support">${t('Across every stage: identity & permissions · durable state · provenance · evaluation · traces · failure recovery','贯穿全部阶段：身份与权限 · 持久状态 · 来源证据 · 评估 · 轨迹 · 故障恢复')}</div><div class="lab-detail"><div class="tags"><span class="tag redtag">${x[3]}</span></div><h3 style="margin-top:15px">${x[0]}</h3><p>${x[2]}</p></div></div><div class="grid2 section-gap"><div class="callout"><h3>${t('Architecture question','架构问题')}</h3><p>${t('Which of these responsibilities would still exist if you replaced the model tomorrow? Almost all of the application responsibilities survive.','假如明天替换模型，哪些责任仍然存在？几乎全部应用层责任都会保留。')}</p></div><div class="card"><h3>${t('Say it in a design review','在设计评审中这样表达')}</h3><p>${t('“We use the model for interpretation and drafting. The application owns permissions, exact validation, approved execution and final-state verification.”','“我们让模型负责理解与起草。应用负责权限、精确验证、获批执行和最终状态确认。”')}</p></div></div>`;}
function modelLab(){const tokens=['Please',' quote',' AX','-120',' five',' units'];const names=[t('Tokenize','分词'),t('Embed + position','嵌入与位置'),t('Attention','注意力'),t('Feed-forward','前馈模块'),t('Logits','输出分数'),t('Decode & repeat','解码与重复')];const desc=[
t('The tokenizer maps text to token IDs. These displayed pieces are illustrative, not the output of any particular tokenizer.','分词器把文本映射为词元 ID。此处切分仅为示意，不是特定分词器的输出。'),
t('Each token ID maps to a learned vector. Position information helps represent order. Embeddings are numerical representations, not stored dictionary definitions.','每个词元 ID 映射为学习向量，位置信息帮助表示顺序。嵌入是数值表示，不是存储的词典定义。'),
t('Queries compare with keys to determine how values mix. In a causal decoder, future positions are masked. Select a row below to inspect the allowed positions.','查询与键比较，决定如何组合值。在因果解码器中，未来位置被屏蔽。点击下方行号查看允许访问的位置。'),
t('Feed-forward blocks transform representations. Residual connections and normalization also matter. Real models repeat blocks; this diagram compresses the stack.','前馈模块变换表示，残差连接与归一化同样重要。真实模型重复多个模块，此图压缩展示整套堆叠。'),
t('An output projection creates a score for each vocabulary token. The toy distribution below uses four invented logits instead of a real vocabulary.','输出投影为词表中每个词元产生分数。下方用四个虚构 logits 代替真实词表。'),
t('Sampling or another decoding rule chooses the next token, then generation continues. Temperature changes this choice distribution—not the evidence available.','采样或其他解码规则选择下一词元，然后继续生成。温度改变选择分布，而不是可用证据。')];const logits=[2.4,1.4,.8,-.2];const exps=logits.map(x=>Math.exp((x-2.4)/ui.temp));const probs=exps.map(x=>x/exps.reduce((a,b)=>a+b,0));let matrix=`<div class="axis">↓ / →</div>${tokens.map((_,i)=>`<div class="axis">${i+1}</div>`).join('')}`;tokens.forEach((_,i)=>{matrix+=`<button class="axis" data-act="attention" data-val="${i}" aria-label="${t('Inspect row','查看第')}${i+1}${t('','行')}">${i+1}</button>`;const sum=Array.from({length:i+1},(_,j)=>j+1).reduce((a,b)=>a+b,0);tokens.forEach((_,j)=>{const w=j<=i?(j+1)/sum:0;matrix+=`<div class="cell ${j>i?'masked':''} ${i===ui.attentionRow?'selectedrow':''}" style="${j<=i?'background:rgba(196,56,49,'+(0.08+w*.7)+')':''}" title="${t('Illustrative weight','示意权重')}: ${w.toFixed(2)}">${j>i?'—':w.toFixed(2)}</div>`;});});return labHeading(t('From token IDs to a next-token distribution.','从词元 ID 到下一个词元分布。'),t('A simplified decoder-style data path. The attention matrix is hand-constructed; the temperature slider computes softmax over invented logits. Neither is a trained model.','简化的解码器式数据路径。注意力矩阵为人工构造；温度滑块对虚构分数执行 softmax。两者都不是已训练模型。'),['S03','S04','S05','S06'])+`<div class="lab-panel"><div class="flow">${names.map((x,i)=>`<button class="flow-box ${ui.modelStep===i?'active':''}" data-act="model-step" data-val="${i}"><small>0${i+1}</small><b>${x}</b></button>`).join('')}</div><div class="lab-detail"><h3>${names[ui.modelStep]}</h3><p>${desc[ui.modelStep]}</p></div><div class="grid2"><section><h3>${t('Causal attention: no future peeking','因果注意力：不能偷看未来')}</h3><div class="token-row">${tokens.map((x,i)=>`<button class="token ${i===ui.attentionRow?'active':''}" data-act="attention" data-val="${i}">${i+1}: ${e(x)}</button>`).join('')}</div><div class="matrix">${matrix}</div><p class="footnote">${t('Rows query columns. Row','行查询列。第')} ${ui.attentionRow+1} ${t('can use positions','行可使用位置')} 1–${ui.attentionRow+1}. ${t('Weights sum to 1 per row. These are teaching weights, not an explanation of any real output.','每行权重之和为 1。这是教学权重，不是任何真实输出的解释。')}</p></section><section><h3>${t('Temperature changes sampling','温度改变采样')}</h3><label for="temperature" class="between small"><span>${t('Temperature T','温度 T')}</span><strong class="mono" id="temp-value">${ui.temp.toFixed(1)}</strong></label><input id="temperature" type="range" min="0.1" max="2" step="0.1" value="${ui.temp}"><div class="bars" id="temp-bars">${temperatureBars(probs)}</div><div class="formula" style="margin-top:24px">logits = [2.4, 1.4, 0.8, -0.2]\npᵢ = exp(logitᵢ / T) / Σ exp(logitⱼ / T)</div><p class="footnote">${t('Four token candidates only. Higher temperature flattens this distribution. A token probability is not the probability that a claim is true. Temperature zero is outside this formula’s slider domain.','仅展示四个词元候选。更高温度使该分布更平坦。词元概率不是某项结论真实的概率。此滑块公式不包含温度为零的情形。')}</p></section></div></div>`;}
function temperatureBars(probs){return ['today','tomorrow','soon','later'].map((x,i)=>`<div class="barrow"><span>${x}</span><div class="bartrack"><div class="barfill" style="width:${(probs[i]*100).toFixed(3)}%"></div></div><span>${(probs[i]*100).toFixed(1)}%</span></div>`).join('');}

function words(s){return(s.toLowerCase().match(/[a-z0-9]+(?:-[a-z0-9]+)*/g)||[]);}
function editDistance(a,b){let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=next;}return row[b.length];}
function ranking(){const query=QUERIES[ui.query];const docs=RECORDS.filter(d=>ui.scope==='audit'||d.tenant==='A');const N=docs.length,avg=docs.reduce((a,d)=>a+words(d.text).length,0)/N;const terms=[...new Set(words(query.text))];const code=query.text.match(/AX-[A-Z0-9]+/i)?.[0]?.toUpperCase();const base=docs.map(d=>{const ws=words(d.text);const lex=terms.reduce((sum,w)=>{const tf=ws.filter(x=>x===w).length;const df=docs.filter(x=>words(x.text).includes(w)).length;const idf=Math.log(1+(N-df+.5)/(df+.5));return sum+idf*(tf*2.2)/(tf+1.2*(.25+.75*ws.length/avg));},0);const dist=code?editDistance(code,d.code):null;return {...d,lex,exact:code&&d.code===code?1:0,fuzzy:dist===null?0:1/(1+dist),distance:dist,semantic:query.semantic[RECORDS.findIndex(x=>x.id===d.id)]};});const lexical=[...base].filter(x=>x.lex>0).sort((a,b)=>b.lex-a.lex).slice(0,3);const dense=[...base].sort((a,b)=>b.semantic-a.semantic).slice(0,3);base.forEach(d=>{d.hybrid=0;[lexical,dense].forEach(list=>{const r=list.findIndex(x=>x.id===d.id);if(r>=0)d.hybrid+=1/(60+r+1);});});const key=ui.retrieval==='lexical'?'lex':ui.retrieval;return base.filter(d=>d[key]>0).sort((a,b)=>b[key]-a[key]).map(d=>({...d,score:d[key]}));}
function retrievalLab(){const query=QUERIES[ui.query];return labHeading(t('Five retrieval signals. Different jobs.','五种检索信号，不同用途。'),t('The corpus contains seven invented records. Exact matching, edit distance, BM25 and RRF run in this browser. Semantic scores are preassigned teaching values—not computed embeddings. Authorization filters the corpus before ranking.','语料包含七条虚构记录。精确匹配、编辑距离、BM25 和 RRF 在浏览器内计算。语义分数是预设教学值，不是计算得到的嵌入相似度。授权范围在排序前过滤语料。'),['S16','S17','S18','S40'])+`<div class="lab-panel"><div class="control-grid"><div class="control"><label for="retrieval-query">${t('Question','问题')}</label><select id="retrieval-query" style="width:100%">${Object.entries(QUERIES).map(([id,q])=>`<option value="${id}" ${ui.query===id?'selected':''}>${q.label()}</option>`).join('')}</select></div><div class="control"><label for="retrieval-method">${t('Retrieval method','检索方式')}</label><select id="retrieval-method" style="width:100%">${[['exact',t('Exact identifier','精确标识')],['fuzzy',t('Fuzzy / edit distance','模糊／编辑距离')],['lexical','BM25'],['semantic',t('Semantic · synthetic','语义 · 合成分数')],['hybrid',t('Hybrid · RRF','混合 · RRF')]].map(([id,name])=>`<option value="${id}" ${ui.retrieval===id?'selected':''}>${name}</option>`).join('')}</select></div><div class="control"><label for="retrieval-scope">${t('Authorized identity','获授权身份')}</label><select id="retrieval-scope" style="width:100%"><option value="A" ${ui.scope==='A'?'selected':''}>${t('Customer A · tenant A only','客户 A · 仅租户 A')}</option><option value="audit" ${ui.scope==='audit'?'selected':''}>${t('Test auditor · A + B authorized','测试审计员 · 获授权访问 A+B')}</option></select></div></div><div class="formula" style="margin-top:20px">${t('QUERY','查询')}: ${query.text}</div><div class="callout sage" style="margin-top:17px;font-size:12px">${ui.scope==='A'?t('6 authorized records. D6 (tenant B) is excluded before any ranking or model context.','6 条获授权记录。D6（租户 B）在排序或进入模型上下文之前被排除。'):t('7 authorized records for this fictional audit identity. This is a different authorized role, not a switch to bypass access control.','此虚构审计身份获授权访问 7 条记录。这是不同授权角色，不是绕过访问控制的开关。')}</div><div id="retrieval-results">${retrievalResults()}</div></div><div class="grid2 section-gap"><div class="card"><h3>${t('What the score means','分数意味着什么')}</h3><p class="small muted">${t('Exact: 1 for an identical record key. Fuzzy: 1 / (1 + Levenshtein distance) against the part code. BM25: term relevance with k₁ = 1.2, b = 0.75. Semantic: preassigned example similarity. Hybrid: Σ 1 / (60 + rank), using the top 3 lexical and top 3 semantic candidates.','精确：记录键相同时为 1。模糊：针对料号计算 1 / (1 + 编辑距离)。BM25：k₁=1.2、b=0.75 的词项相关性。语义：预设示例相似度。混合：对词法前三项和语义前三项，求 Σ 1 / (60 + 名次)。')}</p><p class="small muted">${t('The retrieval algorithms operate on the displayed English query and English source text in both interface languages, so changing the language does not change the experiment.','无论界面语言如何，算法都对所示英文查询和英文原文计算，因此切换语言不改变实验。')}</p></div><div class="callout"><h3>${t('Try two contrasts','尝试两组对比')}</h3><p>${t('Select “one-character ambiguity”: AX-12O is an actual different record in this toy corpus, not a typo you may silently correct. Then try the policy question: meaning and exact word overlap can rank different documents.','选择“单字符歧义”：AX-12O 在示例中是真实存在的另一条记录，不能擅自认定为错别字。再试政策问题，语义与精确词项重合可能排出不同文档。')}</p><a href="#lesson/m5" class="textlink">${t('Return to the RAG lesson','回到 RAG 课程')} →</a></div></div>`;}
function retrievalResults(){const items=ranking();return `<div class="filter-count" style="margin-top:20px">${items.length} ${t('scored candidates · not verified answers','条有分数的候选 · 不是已验证答案')}</div><div class="result-list">${items.length?items.map((d,i)=>`<article class="result"><div class="rank">${i+1}</div><div><h4>${e(v(d.title))}</h4><p>${e(S.lang==='zh'?d.zh:d.text)}</p>${S.lang==='zh'?`<details><summary class="small muted">${t('Algorithm input','算法输入原文')}</summary><p>${e(d.text)}</p></details>`:''}<div class="tags"><span class="tag">${d.id}</span><span class="tag">${t('Tenant','租户')} ${d.tenant}</span>${ui.retrieval==='fuzzy'?`<span class="tag">${t('edits','编辑次数')}: ${d.distance}</span>`:''}</div></div><div class="score">${d.score.toFixed(ui.retrieval==='hybrid'?5:3)}</div></article>`).join(''):`<div class="empty">${t('No candidates for this signal. Exact and code-edit matching do not interpret a natural-language policy question.','该信号没有候选。精确料号与编辑距离匹配无法理解自然语言政策问题。')}</div>`}</div><p class="footnote">${t('These scores are not comparable across methods and are not probabilities of correctness. Actual answer generation and cross-encoder reranking are intentionally not simulated here.','不同方法的分数不可直接比较，也不是正确概率。这里刻意不模拟实际答案生成或交叉编码器重排。')}</p>`;}
function qualifiedGraph(){return [{id:'north',name:'North',cert:'N1',valid:'2026-12-31',verified:true},{id:'south',name:'South',cert:'S1',valid:'2025-12-31',verified:false}].filter(x=>ui.graphDate>='2024-01-01'&&ui.graphDate<=x.valid&&(!ui.graphVerified||x.verified));}
function graphLab(){const qualified=qualifiedGraph();const yes=id=>qualified.some(x=>x.id===id);const edge=id=>yes(id)?'edge activeedge':'edge dim';const details={north:[t('Supplier North','供应商 North'),t('Canonical supplier ID SUP-N. The supply relationship is validated against fictional ERP row 101. Certificate N1 is linked to the same supplier identity.','规范供应商 ID：SUP-N。供应关系已根据虚构 ERP 第 101 行验证，证书 N1 关联相同供应商身份。')],south:[t('Supplier South','供应商 South'),t('Canonical supplier ID SUP-S. A source document suggests it supplies AX-120, but that relationship is not validated. Certificate S1 also expires before the default query date.','规范供应商 ID：SUP-S。来源文档声称其供应 AX-120，但关系未经验证；证书 S1 也在默认查询日期前过期。')],part:['AX-120',t('Canonical part ID PART-120. It is a hydraulic seal, not AX-12O or the AX-120R repair kit. Entity resolution comes before reliable traversal.','规范零件 ID：PART-120。它是液压密封件，不是 AX-12O，也不是 AX-120R 维修套件。可靠遍历需要先正确消歧。')],n1:[t('Certificate N1','证书 N1'),t('Fictional signed certificate, valid 2024-01-01 through 2026-12-31. Claims must retain source reference, validity interval and extraction/verification status.','虚构签署证书，有效期从 2024-01-01 至 2026-12-31。陈述需要保留来源引用、有效区间与提取／验证状态。')],s1:[t('Certificate S1','证书 S1'),t('Fictional certificate valid 2024-01-01 through 2025-12-31. A true historical relationship does not automatically remain valid for a present-day decision.','虚构证书，有效期从 2024-01-01 至 2025-12-31。历史上真实的关系，不代表对当下决策仍有效。')]};const nd=details[ui.graphNode]||details.part;const node=(id,x,y,title,sub,cls='')=>`<g class="node ${cls}" role="button" tabindex="0" data-act="graph-node" data-val="${id}" aria-label="${e(title)}"><rect x="${x}" y="${y}" width="190" height="68" rx="9"/><text x="${x+95}" y="${y+28}" text-anchor="middle" font-size="15" font-weight="600">${e(title)}</text><text x="${x+95}" y="${y+49}" text-anchor="middle" font-size="11">${e(sub)}</text></g>`;return labHeading(t('Ask a relationship question—with evidence.','带着证据，回答关系问题。'),t('Which suppliers provide AX-120 and hold a valid certificate covering it on the query date? Click nodes, change the date and require validated relationships. This is deterministic traversal of five invented nodes, not Microsoft GraphRAG.','在查询日期，哪些供应商供应 AX-120，并持有覆盖该零件的有效证书？点击节点、改变日期，并要求已验证关系。此处对五个虚构节点进行确定性遍历，不是微软 GraphRAG。'),['S19','S21','S22'])+`<div class="lab-panel"><div class="row wrap"><div class="control"><label for="graph-date">${t('Query date','查询日期')}</label><input type="date" id="graph-date" min="2024-01-01" max="2028-12-31" value="${ui.graphDate}"></div><label class="row small" style="margin-top:20px"><input type="checkbox" id="graph-verified" ${ui.graphVerified?'checked':''}>${t('Require validated supply relationships','要求已验证的供应关系')}</label></div><div class="graph-wrap"><svg class="graph-svg" viewBox="0 0 800 350" role="img" aria-label="${t('Supplier part certificate graph. Two suppliers connect to one part and separate certificates.','供应商零件证书图：两个供应商连接同一零件和各自的证书。')}"><defs><marker id="arrowg" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#9aa98c"/></marker></defs><path class="${edge('north')}" d="M210 62H585" marker-end="url(#arrowg)"/><path class="${edge('south')}" d="M210 286H585" marker-end="url(#arrowg)"/><path class="${edge('north')}" d="M182 96L322 167" marker-end="url(#arrowg)"/><path class="${edge('south')}" d="M182 252L322 184" marker-end="url(#arrowg)"/><path class="${edge('north')}" d="M605 96L510 164" marker-end="url(#arrowg)"/><path class="${edge('south')}" d="M605 252L510 186" marker-end="url(#arrowg)"/><text x="395" y="48" text-anchor="middle" font-size="11">${t('HOLDS','持有')}</text><text x="395" y="308" text-anchor="middle" font-size="11">${t('HOLDS','持有')}</text><text x="240" y="113" font-size="10">${t('SUPPLIES','供应')}</text><text x="240" y="237" font-size="10">${t('SUPPLIES ?','供应？')}</text><text x="549" y="113" font-size="10">${t('COVERS','覆盖')}</text><text x="549" y="237" font-size="10">${t('COVERS','覆盖')}</text>${node('north',20,28,t('Supplier North','供应商 North'),'SUP-N')}${node('south',20,252,t('Supplier South','供应商 South'),'SUP-S')}${node('part',320,140,'AX-120','PART-120','part')}${node('n1',585,28,t('Certificate N1','证书 N1'),'2026-12-31')}${node('s1',585,252,t('Certificate S1','证书 S1'),'2025-12-31')}</svg></div><div class="grid2"><div><h3>${t('Qualifying paths','满足条件的路径')} · ${qualified.length}</h3>${qualified.length?qualified.map(x=>`<div class="graph-path">${x.name} → ${x.cert} → AX-120<br><span class="small">${x.verified?t('Validated + in date','已验证且在有效期内'):t('UNVALIDATED claim included','包含未经验证的陈述')}</span></div>`).join(''):`<p class="muted">${t('No qualifying path. The correct response is a limitation, not a fabricated supplier.','没有满足条件的路径，应说明限制，而不是编造供应商。')}</p>`}<p class="footnote">${t('Also requires a supply edge from that same supplier to the part. Red paths satisfy the current filters; gray paths remain stored but do not qualify.','同时要求该供应商到零件存在供应关系。红色路径满足当前筛选；灰色路径仍在存储中，但不满足条件。')}</p></div><div class="card soft"><h3>${nd[0]}</h3><p class="small muted">${nd[1]}</p></div></div>${!ui.graphVerified?`<div class="callout" style="margin-top:17px">${t('Exploration mode: unvalidated edges may enter results. Do not treat graph presence as verified business truth.','探索模式：未经验证的边可能进入结果，不能把图中存在当成已验证业务事实。')}</div>`:''}<details style="margin-top:24px"><summary>${t('Inspect evidence and a query sketch','查看证据与查询示意')}</summary><div class="table-wrap"><table><thead><tr><th>${t('Relationship','关系')}</th><th>${t('Source','来源')}</th><th>${t('Status','状态')}</th></tr></thead><tbody><tr><td>SUP-N → PART-120</td><td>ERP / row 101</td><td>${t('Validated','已验证')}</td></tr><tr><td>SUP-S → PART-120</td><td>supplier-note / p.2</td><td>${t('Unvalidated candidate','未经验证候选')}</td></tr><tr><td>SUP-N → N1 → PART-120</td><td>signed-cert-N1 / p.1</td><td>2024-01-01 — 2026-12-31</td></tr><tr><td>SUP-S → S1 → PART-120</td><td>cert-S1 / p.1</td><td>2024-01-01 — 2025-12-31</td></tr></tbody></table></div><div class="formula" style="margin-top:15px">MATCH (s:Supplier)-[r:SUPPLIES]->(p:Part {id:'PART-120'}),\n      (s)-[:HOLDS]->(c:Certificate)-[:COVERS]->(p)\nWHERE r.verified = true\n  AND c.valid_from &lt;= $date AND c.valid_until &gt;= $date\nRETURN s, p, c</div><p class="footnote">${t('Illustrative Cypher-style sketch, not executed by this website. A relational schema with the right joins may answer the same question without a graph database.','Cypher 风格示意，本站不执行此查询。使用正确连接的关系数据库，也可能无需图数据库就能回答同一问题。')}</p></details></div>`;}

[t('Verify final state','验证最终状态'),t('Simulated test ledger contains exactly one record for Q-001:v1 with the approved fields. This observed state—not the sentence “done”—is the success condition.','模拟测试账本中，Q-001:v1 恰好对应一条包含获批字段的记录。成功条件是该可观察状态，而不是一句“完成”。')]];return labHeading(t('Who controls the next step?','谁控制下一步？'),t('Compare the same bounded task as a workflow and as a model-directed tool loop. The sequence is scripted for teaching; no agent or tool really runs.','比较同一受限任务的工作流与模型主导工具循环。本实验使用教学脚本，不实际运行智能体或工具。'),['S23','S24','S26','S32'])+`<div class="lab-panel"><div class="between wrap"><div class="tabs" style="margin:0">${[['workflow',t('Predefined workflow','预定义工作流')],['agent',t('Bounded agent','受限智能体')]].map(([id,n])=>`<button data-act="agent-mode" data-val="${id}" class="${ui.agentMode===id?'active':''}">${n}</button>`).join('')}</div><label class="row small"><input id="agent-failure" type="checkbox" ${ui.agentFail?'checked':''}>${t('Inject a lookup timeout','注入查询超时')}</label></div><div class="callout sage" style="margin-top:20px"><p>${isAgent?t('The model selects from approved capabilities. The application still owns permissions, budgets, state and side effects. This toy example has only one sensible tool choice; it does not prove an agent is necessary.','模型从获准能力中选择，应用仍负责权限、预算、状态与外部影响。此示例只有一个合理工具选择，不能用它证明有必要采用智能体。'):t('The application defines the sequence. LLM interpretation and drafting can still occur inside the workflow without giving the model control of the whole process.','应用定义执行顺序。工作流内部仍可使用大模型理解与起草，不需要把整个流程控制权交给模型。')}</p></div><div class="trace">${stages.map((x,i)=>`<div class="trace-step ${i<=ui.agentStep?'reached':''} ${i===ui.agentStep?'current':''}"><span class="trace-num">${String(i+1).padStart(2,'0')}</span><div><h4>${x[0]}</h4><p>${i<=ui.agentStep?x[1]:t('Not reached yet.','尚未执行。')}</p></div></div>`).join('')}</div><div class="row wrap" style="margin-top:22px">${button(t('Reset','重置'),'agent-reset','','small')}<button class="btn primary" data-act="agent-next" ${failed||ui.agentStep===4||ui.agentStep===6?'disabled':''}>${t('Run next step','执行下一步')} →</button>${ui.agentStep===4&&!failed?button(t('Approve this simulated write','批准此次模拟写入'),'agent-approve','','dark'):''}<span class="small muted">${failed?t('Stopped: review or recovery required.','已停止：需要审核或恢复。'):ui.agentStep===4?t('Waiting for human approval.','等待人工审批。'):ui.agentStep===6?t('Final state verified in the teaching scenario.','教学场景的最终状态已验证。'):t('Read-only until explicit approval.','明确审批前保持只读。')}</span></div></div><div class="callout section-gap"><h3>${t('Design review prompt','设计评审问题')}</h3><p>${t('A real deployment must verify approval identity, bind approval to the exact action, enforce a tool-call budget, handle timeouts and reconcile duplicate or uncertain writes. Which of these controls lives outside the model?','真实部署必须验证审批身份、把审批绑定到具体行动、限制工具调用预算、处理超时并核对重复或不确定写入。其中哪些控制位于模型之外？')}</p></div>`;}
const EVAL_SCORES=[.98,.96,.95,.93,.91,.90,.88,.86,.84,.82,.79,.76,.73,.69,.66,.62,.58,.48,.37,.22];
const EVAL_TRUTH=[true,true,true,false,true,true,true,true,true,false,true,true,false,true,true,true,false,true,false,false];
function evalMetrics(){const accepted=EVAL_SCORES.map(s=>s>=ui.threshold/100);let tp=0,fp=0,fn=0,tn=0;accepted.forEach((x,i)=>{if(x&&EVAL_TRUTH[i])tp++;else if(x)fp++;else if(EVAL_TRUTH[i])fn++;else tn++;});return {tp,fp,fn,tn,n:20,auto:tp+fp,review:fn+tn,precision:tp+fp?tp/(tp+fp):null,coverage:(tp+fp)/20,recall:tp/(tp+fn)};}
function percent(x){return x===null?'—':(x*100).toFixed(1)+'%';}
function evalLab(){return labHeading(t('Automation coverage is not the whole score.','自动化覆盖率不是全部。'),t('Twenty invented extraction records have synthetic quality scores and known correctness labels. Move the threshold to change which records are accepted automatically and which go to review. Scores are not calibrated probabilities.','二十条虚构提取记录具有合成质量分数和已知正确性标签。调整阈值，改变哪些记录被自动接受、哪些转入审核。分数不是经过校准的概率。'),['S33','S34'])+`<div class="lab-panel"><label for="eval-threshold" class="between"><b>${t('Auto-accept threshold','自动接受阈值')}</b><strong class="mono" id="eval-threshold-value">${ui.threshold}</strong></label><input id="eval-threshold" type="range" min="20" max="99" step="1" value="${ui.threshold}"><div id="eval-results">${evalResults()}</div></div><div class="grid2 section-gap"><div class="callout"><h3>${t('No universal safe threshold','不存在通用安全阈值')}</h3><p>${t('A high-scored error remains in this toy dataset. Raising a threshold can reduce coverage without monotonically improving precision. A real policy needs calibrated signals, error costs, representative testing and human-review effectiveness.','此示例包含高分错误。提高阈值可能降低覆盖率，却不一定使精确率单调提升。真实策略需要校准信号、错误代价、代表性测试与人工审核有效性。')}</p></div><div class="card"><h3>${t('Name the denominators','说清楚分母')}</h3><p class="small muted">${t('Precision = correct auto-accepted / all auto-accepted. Coverage = all auto-accepted / all records. Correct-record recall = correct auto-accepted / all correct records. These definitions apply to this acceptance classifier, not directly to document Recall@k.','精确率＝正确且自动接受／全部自动接受。覆盖率＝自动接受／全部记录。正确记录召回率＝正确且自动接受／全部正确记录。这些定义用于本实验的接受分类器，不能直接当作文档 Recall@k。')}</p></div></div>`;}
function evalResults(){const m=evalMetrics();return `<div class="metric-row"><div class="metric"><strong>${percent(m.precision)}</strong><span>${t('Precision of automatic acceptance','自动接受的精确率')}</span></div><div class="metric"><strong>${percent(m.coverage)}</strong><span>${t('Automation coverage','自动化覆盖率')}</span></div><div class="metric"><strong>${m.fp}</strong><span>${t('Incorrect auto-accepted records','错误但自动接受的记录')}</span></div></div><div class="eval-records">${EVAL_SCORES.map((s,i)=>`<div class="eval-record ${s>=ui.threshold/100?'auto':''} ${EVAL_TRUTH[i]?'':'bad'}" title="${t('Record','记录')} ${i+1}: ${EVAL_TRUTH[i]?t('correct','正确'):t('incorrect','错误')}; ${s>=ui.threshold/100?t('auto-accepted','自动接受'):t('review','审核')}">#${String(i+1).padStart(2,'0')}<span>${Math.round(s*100)} ${EVAL_TRUTH[i]?'✓':'×'}</span></div>`).join('')}</div><div class="tags"><span class="tag green">${t('Green = correct auto-accept','绿色＝正确的自动接受')}</span><span class="tag redtag">${t('Red = incorrect auto-accept','红色＝错误的自动接受')}</span><span class="tag">${t('Gray = review queue','灰色＝审核队列')}</span></div><div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>${t('Ground truth','参考真值')}</th><th>${t('Auto-accepted','自动接受')}</th><th>${t('Sent for review','送交审核')}</th></tr></thead><tbody><tr><td>${t('Correct record','正确记录')}</td><td>${m.tp}</td><td>${m.fn}</td></tr><tr><td>${t('Incorrect record','错误记录')}</td><td>${m.fp}</td><td>${m.tn}</td></tr></tbody></table></div><p class="footnote">${t('Review workload','审核工作量')}: ${m.review}/20 · ${t('Correct-record recall','正确记录召回率')}: ${percent(m.recall)}. ${t('Review is a routing choice, not a guarantee that a person catches every remaining error.','转交审核是一种路由选择，不保证人工能够发现所有剩余错误。')}</p>`;}
const ECON_FIELDS=[['tasks','Monthly attempted tasks','每月尝试任务数',1,10000000,1],['success','Accepted task rate (%)','被接受任务比例（%）',0,100,1],['calls','Model calls per attempted task','每次任务的模型调用数',0,1000,1],['inputTokens','Input tokens per call','每次调用的输入词元数',0,10000000,100],['outputTokens','Output tokens per call','每次调用的输出词元数',0,10000000,100],['inputRate','USD / 1M input tokens · assumed','每百万输入词元美元 · 假设',0,100000,.1],['outputRate','USD / 1M output tokens · assumed','每百万输出词元美元 · 假设',0,100000,.1],['other','Other variable USD per attempt','每次尝试其他可变成本（美元）',0,100000,.01],['reviewRate','Tasks reviewed (%)','人工审核任务比例（%）',0,100,1],['reviewMins','Minutes per reviewed task','每个审核任务所需分钟数',0,10000,.5],['hourly','Loaded labor USD / hour · assumed','综合人工美元／小时 · 假设',0,100000,1],['fixed','Other monthly operating USD','其他每月运行成本（美元）',0,100000000,50],['baselineMins','Manual minutes per accepted task','每个被接受任务的原人工分钟数',0,10000,.5]];
function economicsLab(){return labHeading(t('What does an accepted task actually cost?','一个被接受的任务究竟花多少钱？'),t('An editable teaching model, in USD. These are invented assumptions, not provider prices, quotes or customer ROI. All task attempts incur modeled costs, including attempts that are not accepted.','可编辑的美元教学模型。全部为虚构假设，不是厂商价格、报价或客户投资回报。所有尝试任务都会产生模型设定的成本，包括未被接受的尝试。'),['S15','S37'])+`<div class="lab-panel"><div class="control-grid">${ECON_FIELDS.map(([id,en,zh,min,max,step])=>`<div class="control"><label for="econ-${id}">${t(en,zh)}</label><input id="econ-${id}" data-econ="${id}" type="number" value="${ui.economics[id]}" min="${min}" max="${max}" step="${step}"></div>`).join('')}</div><div id="economics-results">${economicsResults()}</div></div><div class="callout section-gap"><h3>${t('Capacity is not guaranteed cash savings.','产能释放不等于保证节省现金。')}</h3><p>${t('The time comparison holds accepted output volume constant and subtracts all modeled review time. It excludes implementation, transition, exception handling outside review, taxes and unmodeled support. Fixed operating cost is allocated once; do not double-count staff cost already included in review. Measure adoption and how freed time is actually used before claiming financial benefit.','时间比较保持被接受的产出量不变，并扣除全部模型内审核时间。它不包含实施、迁移、审核之外的例外处理、税费及未建模支持。固定运行成本只分配一次，不要重复计算已计入审核的人员成本。宣称财务收益前，应测量采用率和释放时间的实际用途。')}</p></div>`;}
function economicValues(){const x=ui.economics;const model=x.calls*(x.inputTokens*x.inputRate+x.outputTokens*x.outputRate)/1e6;const review=x.reviewRate/100*x.reviewMins*x.hourly/60;const total=x.tasks*(model+x.other+review)+x.fixed;const accepted=x.tasks*x.success/100;const hours=(accepted*x.baselineMins-x.tasks*x.reviewRate/100*x.reviewMins)/60;return {model,review,total,accepted,unit:accepted?total/accepted:null,hours};}
function economicsResults(){const x=ui.economics,m=economicValues();const money=n=>n===null?t('Undefined','未定义'):'$'+n.toLocaleString(S.lang==='zh'?'zh-CN':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return `<div class="metric-row"><div class="metric"><strong>${money(m.total)}</strong><span>${t('Modeled monthly total','模型估算的每月总成本')}</span></div><div class="metric"><strong>${money(m.unit)}</strong><span>${t('Cost per accepted task','每个被接受任务的成本')}</span></div><div class="metric"><strong>${m.hours.toFixed(1)} h</strong><span>${t('Modeled capacity difference · not cash','模型估算产能差额 · 非现金收益')}</span></div></div><div class="table-wrap"><table><thead><tr><th>${t('Component','成本组成')}</th><th>${t('Monthly USD','每月美元')}</th></tr></thead><tbody><tr><td>${t('Model calls across all attempts','全部尝试的模型调用')}</td><td>${money(x.tasks*m.model)}</td></tr><tr><td>${t('Other variable task costs','其他任务可变成本')}</td><td>${money(x.tasks*x.other)}</td></tr><tr><td>${t('Modeled review labor','模型内审核人工')}</td><td>${money(x.tasks*m.review)}</td></tr><tr><td>${t('Other monthly operating costs','其他每月运行成本')}</td><td>${money(x.fixed)}</td></tr></tbody></table></div><div class="formula" style="margin-top:20px">${t('Accepted tasks','被接受任务')} = ${x.tasks} × ${x.success}% = ${m.accepted.toLocaleString()}\n${t('Cost per accepted task = total modeled cost ÷ accepted tasks','单位被接受任务成本＝总建模成本 ÷ 被接受任务数')}\n${t('Capacity hours = (accepted tasks × baseline minutes − all review minutes) ÷ 60','产能小时＝（被接受任务数 × 原人工分钟数 − 全部审核分钟数）÷ 60')}</div>${m.accepted===0?`<p class="footnote red">${t('No accepted tasks: cost per accepted task is undefined, not zero.','没有被接受任务时，单位成本未定义，而不是零。')}</p>`:''}`;}
const DECISIONS=[
{ask:['An exact calculation or structured database question','精确计算或结构化数据库问题'],title:['Start with ordinary software.','从普通软件开始。'],body:['Use validated inputs, deterministic arithmetic or authorized SQL/API queries. An LLM may translate language into a proposed query, but validate query scope and results. It does not need to invent the answer from its parameters.','使用已验证输入、确定性计算或获授权 SQL/API 查询。大模型可把语言转换为建议查询，但必须验证查询范围与结果，不需要让模型从参数中猜出答案。'],test:['Compare against the existing query or rule-based baseline. Test identifiers, permissions and boundary values.','与现有查询或规则基线比较，测试标识符、权限与边界值。'],module:'m0'},
{ask:['Answers from changing private documents','依据变化中的私有文档回答'],title:['Consider retrieval before adaptation.','先考虑检索，再考虑模型适配。'],body:['Parse sources, preserve provenance, enforce scope and retrieve relevant evidence. Start with a small lexical or hybrid RAG baseline; add reranking only when measured evidence quality justifies it. Long context is an alternative to compare, not an automatic replacement.','解析来源、保留来源证据、执行范围限制并检索相关材料。从小型词法或混合 RAG 基线开始，只有证据质量实测证明值得时才加入重排。长上下文是可比较的替代方案，不是自动替代品。'],test:['Can authorized evidence be found? Does each generated claim have supporting evidence? Test freshness and deletion propagation.','能否找到获授权证据？每个生成结论有无支持材料？测试新鲜度和删除传播。'],module:'m5'},
{ask:['Questions about explicit multi-hop relationships','关于显式多跳关系的问题'],title:['Compare SQL joins and graph retrieval.','比较 SQL 连接与图检索。'],body:['Use stable entity identities, typed relationships and source evidence. A graph may help relationship-centered querying and reuse. Existing relational joins may be sufficient. Corpus-wide theme synthesis is a different question for which Microsoft GraphRAG is worth evaluating.','使用稳定实体身份、带类型关系与来源证据。图可能帮助以关系为中心的查询和复用，但现有关系数据库连接也可能足够。跨语料主题综合是另一类问题，可评估微软 GraphRAG。'],test:['Compare answer quality, update cost, source traceability and stale/contradictory edge handling with a simpler baseline.','与更简单基线比较答案质量、更新成本、来源可追踪性以及过期／冲突关系处理。'],module:'m6'},
{ask:['Repeated specialized behavior errors','反复出现的专业行为错误'],title:['Test prompts first; fine-tune with evidence.','先测试提示，有证据再微调。'],body:['Clarify the task contract, provide examples and establish an evaluation set. If errors persist and representative labeled data is available, compare supervised fine-tuning or LoRA. Do not use adaptation to memorize rapidly changing inventory or enforce permissions.','明确任务契约、提供样例并建立评估集。如果错误持续且有代表性标注数据，可比较监督微调或 LoRA。不要用适配来记忆快速变化库存或执行权限控制。'],test:['Hold out test cases. Compare failure slices and cost against prompt-only and retrieval baselines.','保留测试案例，与仅提示和检索基线比较错误切片与成本。'],module:'m2'},
{ask:['The next step genuinely depends on observations','下一步确实依赖运行时观察'],title:['Bound autonomy around verified tools.','围绕已验证工具限制自主性。'],body:['Try a fixed workflow first. When adaptive tool choices demonstrably help, add a bounded model-directed loop with state, tool contracts, call budgets, stop conditions and approval. Multi-agent structure is a further hypothesis, not the default.','先试固定工作流。若自适应工具选择确实有益，再加入有边界的模型主导循环，明确状态、工具契约、调用预算、停止条件与审批。多智能体结构是进一步假设，不是默认选项。'],test:['Evaluate final state and failure recovery across repeated trials, not just plausible transcripts.','跨多次试验评估最终状态与失败恢复，而不只看貌似合理的轨迹。'],module:'m7'},
{ask:['A customer asks for AI but the value is unclear','客户要求 AI，但价值不清楚'],title:['Do discovery before architecture.','先做需求发现，再做架构。'],body:['Observe a real case, measure the current process, identify the user and decision owner, and clarify willingness to change the workflow. A better demo cannot substitute for missing ownership or an unevidenced value hypothesis.','观察真实案例、测量当前流程、识别用户与决策人，并明确改变流程的意愿。更好的演示不能替代缺失的责任人或没有证据的价值假设。'],test:['Write the baseline, buying path, adoption constraint and the cheapest experiment that could disprove the proposal.','写出基线、购买路径、采用约束，以及能推翻方案的最低成本实验。'],module:'m11'}];
function toolkitPage(){return pageHead('06 / '+t('FDE FIELDBOOK','FDE 实战手册'),t('Turn understanding<br>into a useful conversation.','把理解转化为<br>有用的技术对话。'),t('Practise architecture choices, check common misconceptions and prepare evidence-based handoffs. Templates are blank by design: your colleagues supply internal product and customer facts.','练习架构选择，检查常见误解，准备基于证据的交接。模板刻意留空，内部产品与客户事实由你们同事提供。'))+`<div class="tabs">${[['decision',t('Choose an approach','选择方案')],['quiz',t('12 scenario checks','12 道场景测验')],['templates',t('Capstone & handoffs','毕业设计与交接')]].map(([id,n])=>`<button class="${ui.toolkit===id?'active':''}" data-act="toolkit" data-val="${id}">${n}</button>`).join('')}</div>`+(ui.toolkit==='quiz'?quizPage():ui.toolkit==='templates'?templatesPage():decisionPage());}
function decisionPage(){const d=DECISIONS[ui.decision];return `<h2>${t('What kind of problem are you solving?','你正在解决哪类问题？')}</h2><div class="decision-grid">${DECISIONS.map((d,i)=>`<button class="decision-btn ${ui.decision===i?'active':''}" data-act="decision" data-val="${i}" aria-pressed="${ui.decision===i}">${t(...d.ask)}</button>`).join('')}</div><div class="decision-output"><div class="eyebrow">${t('A STARTING HYPOTHESIS, NOT AN AUTOMATIC ANSWER','起始假设，而非自动答案')}</div><h3>${t(...d.title)}</h3><p>${t(...d.body)}</p><h4>${t('The next discriminating test','下一项能区分方案的测试')}</h4><p>${t(...d.test)}</p><a href="#lesson/${d.module}" class="textlink">${e(v(mod(d.module).title))} →</a>${refs(mod(d.module).refs.slice(0,3))}</div><section class="section-gap"><h2>${t('Eight useful contrasts','八组实用对照')}</h2><div class="grid2">${D.comparisons.map(comparison).join('')}</div></section>`;}
function quizPage(){const q=D.quiz[ui.quiz];const answer=S.answers[q.id],answered=Number.isInteger(answer);const correct=D.quiz.filter(x=>S.answers[x.id]===x.correct).length;const complete=D.quiz.filter(x=>Number.isInteger(S.answers[x.id])).length;return `<div class="between wrap" style="margin-bottom:22px"><div><b>${t('Current answers','当前答案')}: ${correct} / ${D.quiz.length}</b><span class="small muted"> · ${complete} ${t('answered','题已答')}</span></div><span class="small muted">${t('A learning check, not a professional certification. Retry and discuss the reasoning.','这是学习检查，不是职业认证。可以重试，并讨论理由。')}</span></div><div class="quiz-layout"><div class="quiz-index">${D.quiz.map((x,i)=>`<button class="${ui.quiz===i?'active':''} ${Number.isInteger(S.answers[x.id])?'answered':''}" data-act="quiz-go" data-val="${i}" aria-label="${t('Question','问题')} ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><article class="card quiz-card"><div class="eyebrow">${t('SCENARIO','场景')} ${String(ui.quiz+1).padStart(2,'0')}</div><h2>${e(v(q.prompt))}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${answered&&i===q.correct?'correct':''} ${answered&&i===answer&&i!==q.correct?'incorrect':''}" data-act="answer" data-val="${i}" ${answered?'disabled style="opacity:1;cursor:default"':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${e(v(o))}</span></button>`).join('')}</div>${answered?`<div class="callout ${answer===q.correct?'sage':''}"><h4>${answer===q.correct?t('That is the strongest starting point.','这是最有依据的起点。'):t('Revisit the boundary.','再想一想这里的边界。')}</h4><p>${e(v(q.explanation))}</p><a href="#lesson/${q.module}" class="textlink">${t('Review the relevant lesson','复习相关课程')} →</a></div>`:''}<div class="between wrap" style="margin-top:25px"><div class="row">${ui.quiz>0?button('← '+t('Previous','上一题'),'quiz-go',String(ui.quiz-1),'small'):''}${answered?button(t('Retry this question','重做本题'),'quiz-retry',q.id,'small'):''}</div>${ui.quiz<D.quiz.length-1?button(t('Next','下一题')+' →','quiz-go',String(ui.quiz+1),'small primary'):`<a href="#toolkit/templates" class="btn primary small">${t('Prepare the capstone','准备毕业设计')} →</a>`}</div></article></div>`;}
function templatesPage(){const template=D.templates.find(x=>x.id===ui.template)||D.templates[0];return `<div class="callout sage"><h3>${t('Capstone: a ten-minute design review','毕业设计：十分钟设计评审')}</h3><p>${t('Present the synthetic RFQ case to a teammate. Cover the current baseline, proposed architecture, three failure modes, evaluation plan, approval boundary, cost assumptions and the next test. Ask the reviewer to challenge the weakest assumption.','向同事展示合成询价案例：当前基线、拟议架构、三种失败模式、评估计划、审批边界、成本假设与下一项测试。请审核人挑战最薄弱的假设。')}</p></div><section class="section-gap"><h3>${t('Review criteria','评审标准')}</h3><div class="grid2">${[
[t('Technical fluency','技术表达'),t('Correctly distinguishes training, retrieval, tool execution and evaluation.','正确区分训练、检索、工具执行与评估。')],
[t('Engineering judgment','工程判断'),t('Chooses a baseline, bounds failure and identifies who owns each consequential action.','选择基线、限制失败影响，明确每个重要行动的责任人。')],
[t('Evidence discipline','证据意识'),t('Marks measured facts, estimates and unknowns; never turns a demo into a customer-result claim.','标明实测、估计与未知，不把演示写成客户成果。')],
[t('FDE readiness for discussion','FDE 对话准备度'),t('Connects a user need to a testable proposal and an explicit next decision. Production sign-off remains a team responsibility.','将用户需求连接到可测试方案和下一项明确决策，生产审批仍是团队责任。')]
].map(([title,body])=>`<div class="card"><h4>${title}</h4><p class="small muted">${body}</p></div>`).join('')}</div><div style="margin-top:22px">${note('capstone',6)}</div></section><section class="section-gap"><div class="section-head"><h2>${t('Evidence handoff templates','证据交接模板')}</h2>${button(t('Export notes as Markdown','导出 Markdown 笔记'),'export-notes','','small')}</div><p class="small muted">${t('Do not put confidential customer data, secrets or personal information into this training copy. Notes stay in this browser and are not synchronized.','请勿在此教学副本中填写客户机密、密钥或个人信息。笔记仅保存在当前浏览器，不自动同步。')}</p><div class="tabs">${D.templates.map(x=>`<button class="${ui.template===x.id?'active':''}" data-act="template" data-val="${x.id}">${e(v(x.title))}</button>`).join('')}</div><article class="card"><h3>${e(v(template.title))}</h3><p class="muted">${e(v(template.intro))}</p>${template.fields.map((f,i)=>{const key='template-'+template.id+'-'+i;return `<div class="form-field"><label for="note-${key}">${i+1}. ${e(v(f))}</label><textarea id="note-${key}" data-note="${key}" placeholder="${t('Evidence / owner / date / measured, estimated or unknown…','证据／责任人／日期／实测、估计或未知…')}">${e(S.notes[key]||'')}</textarea></div>`;}).join('')}<span class="note-status">${persistence?t('Saved on this browser. Use Export to make a transferable backup.','保存在当前浏览器，使用导出创建可转移备份。'):t('Storage unavailable. Export before leaving.','存储不可用，离开前请导出。')}</span></article></section>`;}
function aboutPage(){return pageHead('07 / '+t('SCOPE & PROVENANCE','范围与来源'),t('A field guide,<br>not a feed of hype.','一份实战指南，<br>而非热点信息流。'),t('This is an original bilingual learning resource assembled for TsingJ onboarding. It is not an official publication of the cited organizations and does not imply their endorsement.','这是一份为 TsingJ 入职学习编写的原创双语资料，不是被引用机构的官方出版物，也不代表获得其认可。'))+`<div class="grid2"><section class="card"><h3>${t('What this covers','涵盖范围')}</h3><p>${t('Model fundamentals, training and adaptation, prompting, document extraction, retrieval, knowledge graphs, agents, tools, evaluation, production controls and FDE conversations. 191 terms, 12 lessons, 21 selected milestones and 67 source entries.','模型基础、训练与适配、提示、文档提取、检索、知识图谱、智能体、工具、评估、生产控制与 FDE 对话。包含 191 个术语、12 节课、21 个精选历史节点和 67 条来源。')}</p><p class="muted">${t('It is not an exhaustive AI textbook, current model leaderboard, advanced GPU-training course or completed internal product dossier. Goals #2 and #3 remain with your colleagues.','它不是穷尽 AI 的教科书、实时模型排行榜、高阶 GPU 训练课程，也不是已完成的内部产品档案。第 2、3 项仍由你们同事负责。')}</p></section><section class="card"><h3>${t('How sources were selected','来源如何选择')}</h3><p>${t('Primary papers, official engineering documentation, university courses and original visual explainers. Sources were checked on 22 September 2026. Page text, publication records or abstracts were reviewed; linked courses and videos were not watched end-to-end.','优先采用一手论文、官方工程文档、大学课程和原创图解。来源核对日期为 2026 年 9 月 22 日；检查范围为页面文字、出版记录或摘要，未完整观看全部课程和视频。')}</p><p class="muted">${t('S20 was verified through the official course listing; lesson access was not tested. Course access, language coverage, URLs and API details can change. Suggested times are editorial study budgets.','S20 通过官方课程介绍核对，未测试课程访问。课程条件、语言覆盖、网址和 API 细节可能变化。建议时间是编者安排的学习预算。')}</p></section><section class="card"><h3>${t('Visuals and experiments','图示与实验')}</h3><p>${t('The diagrams and bilingual explanations in this file are original. No third-party illustration or video is copied into the package. External resources open on their publishers’ sites. The seven labs contain synthetic data and deterministic browser code, not real model execution.','本文件的图示与双语解释为原创，未在包内复制第三方插图或视频。外部资料在其发布者网站打开。七个实验包含合成数据与确定性浏览器代码，不是真实模型运行。')}</p><p class="muted">${t('Attention weights and semantic scores are illustrative; numerical calculations such as edit distance, BM25, RRF, softmax, thresholds and cost arithmetic are executed locally. The graph is a five-node teaching example.','注意力权重与语义分数仅供示意；编辑距离、BM25、RRF、softmax、阈值及成本等计算在本地执行。图实验是五节点教学示例。')}</p></section><section class="card"><h3>${t('Offline and privacy','离线与隐私')}</h3><p>${t('This single HTML file loads no external scripts, fonts, images or analytics. Lessons, search, diagrams and labs work offline. External learning links need internet access. Notes, bookmarks and completion are saved in browser storage when available.','这个单一 HTML 文件不加载外部脚本、字体、图片或分析追踪。课程、搜索、图示和实验可离线使用；外部学习链接需要网络。笔记、收藏与进度在可用时保存在浏览器存储。')}</p><p class="muted">${t('Storage is browser- and origin-specific, may behave differently for local files, and may be cleared. It is not shared with colleagues or synced between devices. Export regularly; keep sensitive data out of this learning copy.','存储依浏览器和来源而定，本地文件的行为可能不同，也可能被清除。内容不会与同事共享或跨设备同步。请定期导出，勿在教学副本中填写敏感数据。')}</p></section></div><section class="section-gap card"><h2>${t('Back up or move your learning record','备份或转移学习记录')}</h2><p class="muted">${t('Export JSON to preserve completion, bookmarks, notes and current quiz answers. Importing a valid atlas backup replaces this browser’s learning record. Markdown is a human-readable notes export, not a restorable backup.','导出 JSON 以保存进度、收藏、笔记和当前测验答案。导入有效本站备份会替换当前浏览器记录。Markdown 是便于阅读的笔记导出，不能用于恢复。')}</p><div class="row wrap">${button(t('Export JSON backup','导出 JSON 备份'),'export-backup','','primary')}${button(t('Export Markdown notes','导出 Markdown 笔记'),'export-notes')}${button(t('Import a backup','导入备份'),'import-backup')}${button(t('Print this view','打印当前页面'),'print')}</div><p class="footnote">${persistence?t('Browser storage is currently available.','当前浏览器存储可用。'):t('Browser storage is unavailable; export before closing this tab.','浏览器存储不可用，请在关闭标签页前导出。')}</p></section><section class="section-gap callout sage"><h3>${t('Maintain the atlas','维护这份地图')}</h3><p>${t('Keep the principles stable; refresh living API documentation and access conditions before implementation. Add internal cases only with an owner, date, evidence status and permission to share. The editable source package separates content, styles and application code.','保持基本原则稳定，在实现前刷新实时 API 文档和访问条件。添加内部案例时，明确责任人、日期、证据状态与分享权限。可编辑源码包分离了内容、样式与应用代码。')}</p></section>`;}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportBackup(){download('TsingJ-AI-Atlas-progress.json',JSON.stringify({...S,exportedAt:new Date().toISOString()},null,2),'application/json');toast(t('Backup exported. Keep it somewhere you control.','备份已导出，请保存在你控制的位置。'));}
function exportNotes(){let out='# '+t('TsingJ Applied AI Atlas — learning record','TsingJ 应用 AI 学习地图 — 学习记录')+'\n\n'+t('Exported','导出时间')+': '+new Date().toISOString()+'\n\n';out+='## '+t('Completed lessons','已完成课程')+'\n\n';out+=D.modules.map(m=>`- [${S.done.includes(m.id)?'x':' '}] ${v(m.title)}`).join('\n')+'\n\n';for(const m of D.modules){if(S.notes[m.id])out+='## '+v(m.title)+'\n\n'+S.notes[m.id]+'\n\n';}if(S.notes.capstone)out+='## '+t('Capstone','毕业设计')+'\n\n'+S.notes.capstone+'\n\n';for(const temp of D.templates){out+='## '+v(temp.title)+'\n\n';temp.fields.forEach((f,i)=>{out+='### '+v(f)+'\n\n'+(S.notes['template-'+temp.id+'-'+i]||t('(Not filled)','（未填写）'))+'\n\n';});}out+='## '+t('Bookmarked resources','收藏资料')+'\n\n';out+=S.bookmarks.map(id=>{const s=src(id);return `- [${s.id}] ${s.title} — ${s.url}`;}).join('\n');out+='\n\n## '+t('Current scenario answers','当前场景答案')+'\n\n';for(const q of D.quiz){const a=S.answers[q.id];if(Number.isInteger(a))out+=`- ${v(q.prompt)}\n  ${String.fromCharCode(65+a)}. ${v(q.options[a])} — ${a===q.correct?t('Correct','正确'):t('Revisit','需复习')}\n`;}
 download('TsingJ-AI-Atlas-notes-'+S.lang+'.md',out,'text/markdown;charset=utf-8');toast(t('Notes exported.','笔记已导出。'));}
function switchLanguage(lang){if(!['en','zh'].includes(lang))return;S.lang=lang;$('#toast').hidden=true;save();render();}
function onRoute(){const r=route();if(r.name==='glossary'&&r.id){const g=D.glossary.find(g=>g.id===r.id);if(g){ui.termQ=g.term;ui.termCat='all';ui.termLevel='all';}}$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');render(false);}
window.addEventListener('hashchange',onRoute);
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-act]');if(!target||target.disabled)return;const act=target.dataset.act,val=target.dataset.val;switch(act){
case'skip':ev.preventDefault();$('#main').focus();return;
case'lang':switchLanguage(val);return;
case'menu':{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',open);return;}
case'map':ui.map=val;break;
case'track':ui.track=val;go('path');return;
case'track-local':ui.track=val;break;
case'complete':S.done=S.done.includes(val)?S.done.filter(x=>x!==val):[...S.done,val];save();break;
case'bookmark':{S.bookmarks=S.bookmarks.includes(val)?S.bookmarks.filter(x=>x!==val):[...S.bookmarks,val];save();if(route().name==='library'&&ui.resourceSaved){$('#resource-results').innerHTML=resourceResults();}else{$$(`button[data-act="bookmark"][data-val="${val}"]`).forEach(b=>{const yes=S.bookmarks.includes(val);b.classList.toggle('saved',yes);b.textContent=yes?'★':'☆';b.setAttribute('aria-pressed',yes);b.setAttribute('aria-label',t(yes?'Remove bookmark':'Bookmark resource',yes?'取消收藏':'收藏资料'));});}return;}
case'scroll':$('#'+val)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;
case'terms-module':ui.termQ='';ui.termCat=D.glossary.find(g=>g.module===val)?.category||'all';ui.termLevel='all';go('glossary');return;
case'clear-terms':ui.termQ='';ui.termCat='all';ui.termLevel='all';break;
case'clear-resources':ui.resourceQ='';ui.resourceKind='all';ui.resourceLevel='all';ui.resourceLang='all';ui.resourceVisual=false;ui.resourceSaved=false;ui.resourceModule='all';break;
case'lab':ui.lab=val;go('labs/'+val);return;
case'system-step':ui.systemStep=Number(val);break;
case'model-step':ui.modelStep=Number(val);break;
case'attention':ui.attentionRow=Number(val);break;
case'graph-node':ui.graphNode=val;break;
case'agent-mode':ui.agentMode=val;ui.agentStep=0;break;
case'agent-reset':ui.agentStep=0;break;
case'agent-next':if(ui.agentStep<6&&ui.agentStep!==4&&!(ui.agentFail&&ui.agentStep>=2))ui.agentStep++;break;
case'agent-approve':if(ui.agentStep===4&&!ui.agentFail)ui.agentStep=5;break;
case'toolkit':ui.toolkit=val;go('toolkit/'+val);return;
case'decision':ui.decision=Number(val);break;
case'quiz-go':ui.quiz=Math.min(D.quiz.length-1,Math.max(0,Number(val)));break;
case'answer':{const q=D.quiz[ui.quiz];S.answers[q.id]=Number(val);save();break;}
case'quiz-retry':delete S.answers[val];save();break;
case'template':ui.template=val;break;
case'export-backup':exportBackup();return;
case'export-notes':exportNotes();return;
case'import-backup':$('#import-file').click();return;
case'print':window.print();return;
default:return;}
render();});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.note){S.notes[el.dataset.note]=el.value.slice(0,20000);save();$$('.note-status').forEach(s=>s.textContent=persistence?t('Saved locally.','已本地保存。'):t('Storage unavailable. Export before leaving.','存储不可用，离开前请导出。'));return;}
if(el.dataset.econ){const id=el.dataset.econ,f=ECON_FIELDS.find(f=>f[0]===id);const value=Number(el.value);if(Number.isFinite(value)){ui.economics[id]=Math.min(f[4],Math.max(f[3],value));$('#economics-results').innerHTML=economicsResults();}return;}
switch(el.id){case'term-search':ui.termQ=el.value;$('#term-results').innerHTML=termResults();break;case'resource-search':ui.resourceQ=el.value;$('#resource-results').innerHTML=resourceResults();break;case'temperature':ui.temp=Number(el.value);$('#temp-value').textContent=ui.temp.toFixed(1);{const vals=[2.4,1.4,.8,-.2].map(x=>Math.exp((x-2.4)/ui.temp));$('#temp-bars').innerHTML=temperatureBars(vals.map(x=>x/vals.reduce((a,b)=>a+b,0)));}break;case'eval-threshold':ui.threshold=Number(el.value);$('#eval-threshold-value').textContent=ui.threshold;$('#eval-results').innerHTML=evalResults();break;}
});
document.addEventListener('change',async ev=>{const el=ev.target;switch(el.id){
case'term-category':ui.termCat=el.value;$('#term-results').innerHTML=termResults();return;
case'term-level':ui.termLevel=el.value;$('#term-results').innerHTML=termResults();return;
case'resource-kind':ui.resourceKind=el.value;$('#resource-results').innerHTML=resourceResults();return;
case'resource-lang':ui.resourceLang=el.value;$('#resource-results').innerHTML=resourceResults();return;
case'resource-level':ui.resourceLevel=el.value;$('#resource-results').innerHTML=resourceResults();return;
case'resource-module':ui.resourceModule=el.value;$('#resource-results').innerHTML=resourceResults();return;
case'resource-visual':ui.resourceVisual=el.checked;$('#resource-results').innerHTML=resourceResults();return;
case'resource-saved':ui.resourceSaved=el.checked;$('#resource-results').innerHTML=resourceResults();return;
case'history-lane':ui.lane=el.value;break;
case'retrieval-query':ui.query=el.value;break;
case'retrieval-method':ui.retrieval=el.value;break;
case'retrieval-scope':ui.scope=el.value;break;
case'graph-date':if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)&&el.validity.valid)ui.graphDate=el.value;else return;break;
case'graph-verified':ui.graphVerified=el.checked;break;
case'agent-failure':ui.agentFail=el.checked;ui.agentStep=0;break;
case'import-file':{const file=el.files?.[0];if(!file)return;if(file.size>2000000){toast(t('Backup is too large.','备份文件过大。'));el.value='';return;}try{const value=JSON.parse(await file.text());if(value.schema!=='tsingj-ai-atlas-progress-v1')throw new Error('Invalid backup');if(!confirm(t('Replace this browser’s learning record with the imported backup?','使用导入备份替换此浏览器的学习记录？'))){el.value='';return;}S=sanitize(value);save();toast(t('Learning record restored.','学习记录已恢复。'));}catch(err){toast(t('Could not import: select a valid atlas JSON backup.','无法导入，请选择有效的本站 JSON 备份。'));}el.value='';break;}
default:if(el.dataset.econ){el.value=ui.economics[el.dataset.econ];}return;}
render();});
document.addEventListener('keydown',ev=>{if(ev.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ev.preventDefault();$('#quick-search').focus();}if(ev.target.id==='quick-search'&&ev.key==='Enter'){ui.termQ=ev.target.value;ui.termCat='all';ui.termLevel='all';go('glossary');}if(ev.key==='Escape'){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');}if(ev.target.matches('g[role="button"]')&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
