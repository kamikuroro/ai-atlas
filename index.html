ng inference rather than only watching slides.","zh":"通过交互式模型可视化探索推理过程，而不只是看幻灯片。"},"selection":{"en":"Change the input and inspect attention and output distributions. External demo may download model assets.","zh":"改变输入，观察注意力与输出分布。外部演示可能下载模型资源。"},"minutes":25,"year":"","checked":"2026-09-22","status":"page"},{"id":"S07","title":"Neural Networks: Zero to Hero","author":"Andrej Karpathy","url":"https://karpathy.ai/zero-to-hero.html","kind":"course","level":"deeper","visual":true,"lang":"en","modules":["m1","m2"],"why":{"en":"For an engineer who wants to implement the machinery and understand gradients.","zh":"适合希望亲手实现模型、理解梯度的工程师。"},"selection":{"en":"Use micrograd before the GPT-building lecture. Optional coding track, not week-one homework.","zh":"先看 micrograd，再看构建 GPT 的课程。属于选修编码路线，不是第一周必修。"},"minutes":120,"year":"","checked":"2026-09-22","status":"page"},{"id":"S08","title":"Dive into Deep Learning / 动手学深度学习","author":"Aston Zhang, Zachary Lipton, Mu Li, Alex Smola","url":"https://d2l.ai/","kind":"book","level":"deeper","visual":true,"lang":"both","modules":["m0","m1","m2"],"why":{"en":"An open textbook connecting diagrams, mathematics and executable examples.","zh":"把图解、数学与可执行示例连接起来的开放教材。"},"selection":{"en":"Use attention and Transformer chapters selectively. Chinese edition is linked separately.","zh":"选择性阅读注意力与 Transformer 章节；另提供中文版入口。"},"minutes":60,"year":"","checked":"2026-09-22","status":"page"},{"id":"S09","title":"动手学深度学习 · 中文版","author":"张阿斯顿、李沐等","url":"https://zh.d2l.ai/","kind":"book","level":"deeper","visual":true,"lang":"zh","modules":["m0","m1","m2"],"why":{"en":"A Chinese-first reference when English technical explanations slow the learner down.","zh":"当英文技术解释影响理解时，提供中文优先的参考。"},"selection":{"en":"Search 注意力机制 and Transformer; the chapter numbering differs from the English edition.","zh":"搜索「注意力机制」与「Transformer」；章节编号与英文版不同。"},"minutes":60,"year":"","checked":"2026-09-22","status":"page"},{"id":"S10","title":"Hugging Face LLM Course","author":"Hugging Face","url":"https://huggingface.co/learn/llm-course/en/chapter1/1","kind":"course","level":"start","visual":true,"lang":"both","modules":["m1","m2","m3"],"why":{"en":"Bridge conceptual learning and the practical model/tokenizer ecosystem.","zh":"衔接概念学习与模型、分词器的实际使用。"},"selection":{"en":"Chapters 1–3 first; tokenizers and fine-tuning later. Python helps for exercises.","zh":"先看第 1–3 章；分词器和微调稍后再学。练习需要一定 Python 基础。"},"minutes":60,"year":"","checked":"2026-09-22","status":"page"},{"id":"S11","title":"Hugging Face 课程 · 中文入口","author":"Hugging Face community","url":"https://huggingface.co/learn/llm-course/zh-CN/chapter1/1","kind":"course","level":"start","visual":true,"lang":"zh","modules":["m1","m2"],"why":{"en":"An accessible Chinese route into the same ecosystem; translations may lag the English course.","zh":"进入同一生态的中文路线；翻译进度可能落后于英文版。"},"selection":{"en":"Use for foundational chapters; check English pages for changed APIs and newer sections.","zh":"用于基础章节；有变化的 API 和新章节请对照英文版。"},"minutes":60,"year":"","checked":"2026-09-22","status":"page"},{"id":"S12","title":"Introduction to Generative AI · 2024 Spring","author":"Hung-yi Lee · 李宏毅 · NTU","url":"https://speech.ee.ntu.edu.tw/~hylee/genai/2024-spring.php","kind":"course","level":"start","visual":true,"lang":"zh","modules":["m0","m2","m3"],"why":{"en":"Chinese lectures and slides suitable for building a broad conceptual framework.","zh":"适合建立广泛概念框架的中文课程与幻灯片。"},"selection":{"en":"Choose introductory lessons and the sections relevant to prompting, learning and evaluation.","zh":"选择入门课，以及提示、学习、评估相关章节。"},"minutes":60,"year":"2024","checked":"2026-09-22","status":"page"},{"id":"S13","title":"Introduction to GenAI and ML · 2025 Fall","author":"Hung-yi Lee · 李宏毅 · NTU","url":"https://speech.ee.ntu.edu.tw/~hylee/GenAI-ML/2025-fall.php","kind":"course","level":"deeper","visual":true,"lang":"zh","modules":["m1","m2","m7"],"why":{"en":"A newer Chinese university course for extending the foundations.","zh":"在基础之上继续深入的较新中文大学课程。"},"selection":{"en":"Use the syllabus to select topics, not as a requirement to watch an entire semester.","zh":"按课程表选择主题，无需完整看完一学期。"},"minutes":60,"year":"2025","checked":"2026-09-22","status":"page"},{"id":"S14","title":"CS336: Language Modeling from Scratch","author":"Stanford","url":"https://cs336.stanford.edu/","kind":"course","level":"deeper","visual":true,"lang":"en","modules":["m1","m2","m10"],"why":{"en":"A rigorous engineering route through training data, models and systems.","zh":"系统学习训练数据、模型与系统工程的严谨路线。"},"selection":{"en":"Optional after Python, deep learning and linear algebra. Start with the overview and first assignment.","zh":"适合掌握 Python、深度学习与线性代数后选修。先看概览和第一份作业。"},"minutes":120,"year":"2026","checked":"2026-09-22","status":"page"},{"id":"S15","title":"LLM Bootcamp","author":"Full Stack Deep Learning","url":"https://fullstackdeeplearning.com/llm-bootcamp/","kind":"course","level":"start","visual":true,"lang":"en","modules":["m0","m4","m10","m11"],"why":{"en":"Connect models to the surrounding application and product system.","zh":"把模型与周边应用、产品系统连接起来。"},"selection":{"en":"Prioritize product, UX and LLMOps sessions; treat 2023 tools as historical examples.","zh":"优先看产品、交互和 LLMOps 内容；把 2023 年的工具当作历史示例。"},"minutes":60,"year":"2023","checked":"2026-09-22","status":"page"},{"id":"S16","title":"Introducing Contextual Retrieval","author":"Anthropic","url":"https://www.anthropic.com/engineering/contextual-retrieval","kind":"article","level":"start","visual":true,"lang":"en","modules":["m5"],"why":{"en":"A concrete illustrated account of lexical + embedding retrieval and reranking.","zh":"具体图解词法检索、向量检索与重排的结合。"},"selection":{"en":"Read the RAG primer and pipeline diagrams; reported gains are benchmark-specific, not promises.","zh":"先看 RAG 入门与流程图；文中的效果提升只适用于其测试，不是通用承诺。"},"minutes":30,"year":"2024","checked":"2026-09-22","status":"page"},{"id":"S17","title":"Retrieve & Re-Rank","author":"Sentence Transformers","url":"https://www.sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html","kind":"guide","level":"start","visual":true,"lang":"en","modules":["m5"],"why":{"en":"Understand bi-encoders versus cross-encoders with a compact pipeline illustration.","zh":"用简洁流程图理解双塔编码器与交叉编码器的区别。"},"selection":{"en":"Inspect the three diagrams; code is optional in the fluency track.","zh":"先看三个图；沟通素养路线不强制跑代码。"},"minutes":25,"year":"","checked":"2026-09-22","status":"page"},{"id":"S18","title":"Fuzzy query","author":"Elastic","url":"https://www.elastic.co/docs/reference/query-languages/query-dsl/query-dsl-fuzzy-query","kind":"docs","level":"reference","visual":false,"lang":"en","modules":["m4","m5"],"why":{"en":"A precise reference for edit-distance matching: not semantic similarity.","zh":"编辑距离匹配的准确参考：它不是语义相似度。"},"selection":{"en":"Read the opening definition and operational warnings.","zh":"阅读开头定义和运行注意事项。"},"minutes":15,"year":"","checked":"2026-09-22","status":"page"},{"id":"S19","title":"Graph database concepts","author":"Neo4j","url":"https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/","kind":"guide","level":"start","visual":true,"lang":"en","modules":["m6"],"why":{"en":"Learn nodes, typed relationships, properties and traversal before discussing GraphRAG.","zh":"在讨论 GraphRAG 之前，先理解节点、带类型的关系、属性与遍历。"},"selection":{"en":"Map one supplier–part–certificate example to the concepts.","zh":"用一个供应商—零件—证书例子对应这些概念。"},"minutes":25,"year":"","checked":"2026-09-22","status":"page"},{"id":"S20","title":"Knowledge Graphs for RAG","author":"DeepLearning.AI · Neo4j","url":"https://www.deeplearning.ai/courses/knowledge-graphs-rag","kind":"course","level":"deeper","visual":true,"lang":"en","modules":["m6"],"why":{"en":"A hands-on path from graph concepts to graph-backed retrieval.","zh":"从图概念走向图增强检索的实践课程。"},"selection":{"en":"Official course listing located; lesson access, account requirements and pricing need checking on the provider site.","zh":"已找到官方课程介绍；课程访问、账号要求和收费请在平台确认。"},"minutes":60,"year":"","checked":"2026-09-22","status":"listing"},{"id":"S21","title":"GraphRAG documentation","author":"Microsoft","url":"https://microsoft.github.io/graphrag/","kind":"docs","level":"deeper","visual":true,"lang":"en","modules":["m6"],"why":{"en":"The implementation reference for Microsoft’s graph-based indexing and retrieval approach.","zh":"微软图索引与检索方法的实现参考。"},"selection":{"en":"Read overview, indexing, local search and global search. Do not infer it is always better than vector RAG.","zh":"先看概览、索引、局部搜索与全局搜索。不要推断它总比向量 RAG 更好。"},"minutes":45,"year":"","checked":"2026-09-22","status":"page"},{"id":"S22","title":"RDF 1.1 Concepts and Abstract Syntax","author":"W3C","url":"https://www.w3.org/TR/rdf11-concepts/","kind":"standard","level":"reference","visual":true,"lang":"en","modules":["m6"],"why":{"en":"A standards-based account of triples and graph data models.","zh":"用标准文档理解三元组与图数据模型。"},"selection":{"en":"Read the concepts overview. Property graphs and RDF are related but different models.","zh":"阅读概念概览。属性图与 RDF 相关，但不是同一种数据模型。"},"minutes":25,"year":"2014","checked":"2026-09-22","status":"page"},{"id":"S23","title":"Building effective agents","author":"Anthropic","url":"https://www.anthropic.com/engineering/building-effective-agents","kind":"article","level":"start","visual":true,"lang":"en","modules":["m7","m11"],"why":{"en":"Useful workflow diagrams and a disciplined distinction between predefined flows and agent control.","zh":"用流程图清晰区分预定义流程与模型自主控制。"},"selection":{"en":"Study chaining, routing, parallelization and the agent loop; start from the simplest adequate design.","zh":"看提示链、路由、并行和智能体循环；从能满足需求的最简单设计开始。"},"minutes":35,"year":"2024","checked":"2026-09-22","status":"page"},{"id":"S24","title":"Agents","author":"Chip Huyen","url":"https://huyenchip.com/2025/01/07/agents.html","kind":"article","level":"start","visual":true,"lang":"en","modules":["m7","m8"],"why":{"en":"A systems-oriented explanation of tools, planning and agent failure modes.","zh":"从系统视角解释工具、规划和智能体失败方式。"},"selection":{"en":"Read the tools and planning sections, then discuss what state the application must own.","zh":"阅读工具与规划部分，再讨论哪些状态必须由应用维护。"},"minutes":40,"year":"2025","checked":"2026-09-22","status":"page"},{"id":"S25","title":"AI Agents Course","author":"Hugging Face","url":"https://huggingface.co/learn/agents-course/en/unit0/introduction","kind":"course","level":"deeper","visual":true,"lang":"en","modules":["m7","m8"],"why":{"en":"An applied route from agent concepts to implementation exercises.","zh":"从智能体概念走向实现练习的应用路线。"},"selection":{"en":"Begin with agent fundamentals. Framework exercises are optional and may need accounts or compute.","zh":"先学智能体基础。框架练习为选修，可能需要账号或算力。"},"minutes":60,"year":"","checked":"2026-09-22","status":"page"},{"id":"S26","title":"Writing effective tools for AI agents","author":"Anthropic","url":"https://www.anthropic.com/engineering/writing-tools-for-agents","kind":"article","level":"start","visual":true,"lang":"en","modules":["m8"],"why":{"en":"Tool names, argument schemas and returned context are part of the model’s interface.","zh":"工具名称、参数结构与返回上下文，都是模型接口的一部分。"},"selection":{"en":"Review tool boundaries and response design; draft one read-only ERP tool.","zh":"学习工具边界与返回值设计；拟定一个只读 ERP 工具。"},"minutes":30,"year":"2025","checked":"2026-09-22","status":"page"},{"id":"S27","title":"Effective context engineering for AI agents","author":"Anthropic","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","kind":"article","level":"start","visual":true,"lang":"en","modules":["m3","m8"],"why":{"en":"Connect prompts, retrieved evidence, tool outputs and state management.","zh":"连接提示、检索证据、工具结果与状态管理。"},"selection":{"en":"Read context versus prompting and long-horizon task strategies.","zh":"阅读上下文与提示的区别，以及长周期任务策略。"},"minutes":30,"year":"2025","checked":"2026-09-22","status":"page"},{"id":"S28","title":"What is the Model Context Protocol?","author":"Model Context Protocol","url":"https://modelcontextprotocol.io/docs/getting-started/intro","kind":"docs","level":"start","visual":true,"lang":"en","modules":["m8"],"why":{"en":"The official starting point for a protocol, rather than a model or an agent framework.","zh":"协议的官方起点；MCP 不是模型，也不是智能体框架。"},"selection":{"en":"Read the host/client/server mental model. Follow the current specification for implementation.","zh":"理解宿主、客户端、服务端；实现时应查看当前规范。"},"minutes":20,"year":"","checked":"2026-09-22","status":"page"},{"id":"S29","title":"Agent Skills overview","author":"Agent Skills","url":"https://agentskills.io/home","kind":"docs","level":"start","visual":false,"lang":"en","modules":["m8"],"why":{"en":"Explain reusable packages of instructions and resources without confusing them with tools.","zh":"理解可复用的指令与资源包，而不把它们混同于工具。"},"selection":{"en":"Compare a skill package with a callable tool and with persistent memory.","zh":"比较技能包、可调用工具与持久化记忆。"},"minutes":20,"year":"","checked":"2026-09-22","status":"page"},{"id":"S30","title":"Announcing the Agent2Agent Protocol","author":"Google","url":"https://developers.googleblog.com/en/a2a-a-new-era-of-agent-interoperability/","kind":"article","level":"reference","visual":true,"lang":"en","modules":["m8"],"why":{"en":"The original A2A announcement explains why agent-to-agent communication is a separate concern.","zh":"A2A 原始发布说明解释了为何智能体间通信是独立问题。"},"selection":{"en":"Historical context, not an implementation specification. Most first POCs do not need this layer.","zh":"用于了解历史背景，不是实现规范。多数初始 POC 不需要这一层。"},"minutes":15,"year":"2025","checked":"2026-09-22","status":"page"},{"id":"S31","title":"Structured model outputs","author":"OpenAI","url":"https://developers.openai.com/api/docs/guides/structured-outputs","kind":"docs","level":"start","visual":true,"lang":"en","modules":["m3","m4"],"why":{"en":"Learn what schema-constrained output solves and what it does not verify.","zh":"理解结构约束输出能解决什么、不能验证什么。"},"selection":{"en":"Read schema adherence, refusals and errors. API syntax and model support may change.","zh":"阅读结构约束、拒绝与错误处 ":"paper","level":"deeper","visual":false,"lang":"en","modules":["m5"],"why":{"en":"Understand why an ANN index graph is not a domain knowledge graph.","zh":"理解为什么近似最近邻索引图不是领域知识图谱。"},"selection":{"en":"Read the concept and worked definition; full implementation is optional.","zh":"阅读概念与具体定义；完整实现可选。"},"minutes":20,"year":"2016","checked":"2026-09-22","status":"abstract"},{"id":"P21","title":"Switch Transformers","author":"Fedus, Zoph & Shazeer","url":"https://arxiv.org/abs/2101.03961","kind":"paper","level":"deeper","visual":false,"lang":"en","modules":["m1","m2"],"why":{"en":"Distinguish sparse model experts from multiple application agents.","zh":"区分稀疏模型专家与应用层多智能体。"},"selection":{"en":"Read the concept and worked definition; full implementation is optional.","zh":"阅读概念与具体定义；完整实现可选。"},"minutes":20,"year":"2021","checked":"2026-09-22","status":"abstract"},{"id":"P22","title":"RoFormer: Enhanced Transformer with Rotary Position Embedding","author":"Su et al.","url":"https://arxiv.org/abs/2104.09864","kind":"paper","level":"deeper","visual":false,"lang":"en","modules":["m1"],"why":{"en":"A primary reference for rotary position embeddings.","zh":"旋转位置编码的一手参考。"},"selection":{"en":"Read the concept and worked definition; full implementation is optional.","zh":"阅读概念与具体定义；完整实现可选。"},"minutes":20,"year":"2021","checked":"2026-09-22","status":"abstract"},{"id":"S40","title":"Reciprocal rank fusion","author":"Elastic","url":"https://www.elastic.co/docs/reference/elasticsearch/rest-apis/reciprocal-rank-fusion","kind":"docs","level":"deeper","visual":true,"lang":"en","modules":["m5"],"why":{"en":"The rank-fusion formula used by the retrieval lab.","zh":"检索实验使用的排名融合公式。"},"selection":{"en":"Read the concept and worked definition; full implementation is optional.","zh":"阅读概念与具体定义；完整实现可选。"},"minutes":20,"year":"","checked":"2026-09-22","status":"page"},{"id":"S41","title":"Byte-Pair Encoding tokenization","author":"Hugging Face","url":"https://huggingface.co/learn/llm-course/en/chapter6/5","kind":"guide","level":"deeper","visual":true,"lang":"en","modules":["m1"],"why":{"en":"Understand how token vocabularies are learned from recurring symbol pairs.","zh":"理解词元词表如何从重复符号对中学习。"},"selection":{"en":"Read the concept and worked definition; full implementation is optional.","zh":"阅读概念与具体定义；完整实现可选。"},"minutes":20,"year":"","checked":"2026-09-22","status":"page"}],"modules":[{"id":"m0","title":{"en":"A model is not a product","zh":"模型不等于产品"},"tagline":{"en":"Locate the intelligence—and the responsibility.","zh":"找到智能所在，也找到责任所在。"},"minutes":35,"prereq":[],"refs":["S01","S02","S15","P19"],"lab":"system","blocks":[{"title":{"en":"The map before the vocabulary","zh":"先有地图，再记术语"},"body":{"en":"Artificial intelligence is the broad field of building systems that perform tasks associated with intelligence. Machine learning learns patterns from data; deep learning uses multilayer neural networks. Generative AI creates outputs such as text, images or audio. An LLM is a language-model family, not a synonym for all AI. Many valuable applications still use rules, search, optimization and conventional ML alongside an LLM.","zh":"人工智能是让系统完成智能相关任务的广泛领域。机器学习从数据中学习规律；深度学习使用多层神经网络。生成式 AI 生成文本、图像、音频等内容。大语言模型只是其中一类，不等于全部 AI。许多有价值的应用仍把规则、搜索、优化与传统机器学习和大模型组合使用。"}},{"title":{"en":"Two architectures, not one","zh":"区分两种架构"},"body":{"en":"Model architecture describes computation inside the model: embeddings, attention, feed-forward blocks and outputs. Application architecture describes the surrounding system: interface, orchestration, retrieval, tools, databases, permissions, evaluation and operations. Buying access to a strong model does not supply an ERP integration, a valid customer permission model or a rollback plan.","zh":"模型架构描述模型内部的计算：嵌入、注意力、前馈模块与输出。应用架构描述外围系统：界面、编排、检索、工具、数据库、权限、评估和运维。接入强大的模型，并不会自动获得 ERP 集成、正确的客户权限模型或回滚方案。"}},{"title":{"en":"A useful first boundary","zh":"一个实用边界"},"body":{"en":"Use language models for ambiguous language and unstructured inputs. Use ordinary software for exact arithmetic, authorization, authoritative record lookup and transactional writes. The model can propose a tool call; the application must decide whether to execute it. This separation makes errors easier to locate and consequences easier to limit.","zh":"让语言模型处理模糊语言和非结构化输入；让普通软件负责精确计算、鉴权、权威记录查询和事务写入。模型可以提出工具调用请求，但应用必须决定是否执行。这样才能更容易定位错误、限制影响。"}},{"title":{"en":"The running example","zh":"贯穿全站的例子"},"body":{"en":"Our fictional distributor receives a request for quotation by email. The application extracts part number and quantity, matches an ERP item, retrieves approved terms, prepares a draft and asks a person to approve it. “A fluent quote” is not success: the right item, unit, customer, price basis and authorized final state all matter. This is a teaching scenario, not evidence of a TsingJ deployment or business result.","zh":"一家虚构分销商通过邮件收到询价。应用提取料号和数量，匹配 ERP 商品，检索获准使用的条款，准备草稿并交由人工审批。“报价读起来顺畅”不是成功：商品、单位、客户、价格依据和获授权的最终状态都必须正确。这是教学场景，不是 TsingJ 项目或商业成果的证据。"}},{"title":{"en":"FDE as a working discipline","zh":"把 FDE 理解为工作方法"},"body":{"en":"Here FDE means forward-deployed engineering literacy: discovering a real workflow, translating it into an executable design, testing the risky assumptions and operating the result with users. Titles differ across companies. Technical fluency means asking precise questions and identifying owners—not claiming expertise in every training algorithm.","zh":"本站把 FDE 理解为前线部署工程素养：发现真实流程，把需求转化为可执行设计，验证高风险假设，与用户一起运营结果。不同公司对岗位的定义不同。技术沟通能力意味着提出准确问题、明确责任人，而不是宣称精通所有训练算法。"}}],"exercise":{"en":"Draw the email-to-quote system. Mark which boxes are probabilistic, deterministic, external and human-owned.","zh":"画出从邮件到报价的系统，标出概率性、确定性、外部依赖与人工负责的部分。"},"exit":{"en":"Explain why changing the model alone may not fix a wrong ERP item or unauthorized write.","zh":"能够解释：为什么单纯更换模型不一定能解决 ERP 商品匹配错误或越权写入。"}},{"id":"m1","title":{"en":"From tokens to Transformers","zh":"从词元到 Transformer"},"tagline":{"en":"Understand the machine without memorizing its matrices.","zh":"理解机器如何运转，不必背下所有矩阵。"},"minutes":80,"prereq":["m0"],"refs":["S03","S04","S05","S06","S07","S09","P01","P02","P03","P04","P18"],"lab":"model","blocks":[{"title":{"en":"Text becomes numbers","zh":"文本如何变成数字"},"body":{"en":"A tokenizer converts text into token IDs; tokens may be words, subwords, punctuation or byte-like pieces. An embedding maps an ID to a learned vector. Position information is added or incorporated so that order can matter. Tokenization varies by model and language: characters and words are not reliable billing or context-length units.","zh":"分词器把文本转换为词元 ID；词元可能是词、子词、标点或类似字节的片段。嵌入把 ID 映射为学习得到的向量。模型加入或结合位置信息，以理解顺序。不同模型和语言的分词不同，字符数和词数不能可靠替代计费或上下文长度中的词元数。"}},{"title":{"en":"What one block does","zh":"一个模块在做什么"},"body":{"en":"Self-attention lets a position combine information from other permitted positions. Queries and keys determine attention weights; values carry the information being mixed. Feed-forward networks transform each position’s representation. Residual connections and normalization support a deep stack of these operations. Attention is only part of a Transformer, and an attention picture is not a guaranteed faithful explanation of an answer.","zh":"自注意力让一个位置综合其他允许访问位置的信息。查询与键决定注意力权重；值携带被组合的信息。前馈网络变换每个位置的表示。残差连接与归一化帮助这些运算堆叠成深层网络。注意力只是 Transformer 的一部分，注意力图也不一定能忠实解释某个答案。"}},{"title":{"en":"Three common shapes","zh":"三种常见形态"},"body":{"en":"The 2017 Transformer used an encoder and decoder. Encoder-only models such as BERT are useful for representations and understanding tasks. Decoder-only autoregressive models generate successive tokens using a causal mask that prevents looking at future tokens. Encoder–decoder designs transform an input sequence into an output sequence. Modern systems also explore state-space models and hybrids; “LLM” does not logically require one exact architecture.","zh":"2017 年的 Transformer 使用编码器和解码器。BERT 等纯编码器模型适合表示学习和理解任务。纯解码器自回归模型依次生成词元，因果掩码阻止访问未来位置。编码器—解码器结构把输入序列变成输出序列。现代系统也探索状态空间模型与混合结构；“大语言模型”并不在逻辑上限定唯一架构。"}},{"title":{"en":"From logits to text","zh":"从分数到文本"},"body":{"en":"An output layer produces logits, which softmax turns into a distribution over tokens. Decoding chooses a next token and repeats. Temperature rescales this distribution; top-k and top-p restrict sampling candidates. These settings change generation behavior, not the underlying facts available to the model. A likely token is not a calibrated probability that a business claim is true.","zh":"输出层产生 logits，softmax 将其转为词元概率分布。解码选择下一个词元并重复此过程。温度缩放分布；top-k 和 top-p 限制采样候选。这些参数改变生成行为，并不改变模型掌握的事实。某个词元概率高，不等于某项商业判断真实的校准概率。"}},{"title":{"en":"What the application engineer needs","zh":"应用工程师需要掌握什么"},"body":{"en":"Know why long inputs cost time and memory, why output length affects latency, and why a tokenizer and context limit matter. A KV cache reuses previously computed attention keys and values during generation; it is not a permanent fact database. Start with the visual lessons. Deriving gradients and training a small model belongs to the optional engineering track.","zh":"理解为什么长输入消耗时间与内存、输出长度影响延迟，以及为什么分词器和上下文限制很重要。KV 缓存在生成时复用之前计算的注意力键和值；它不是永久事实数据库。先看图解，梯度推导和小模型训练属于工程进阶选修。"}}],"exercise":{"en":"Use the model lab. Explain why lowering temperature cannot repair missing inventory data. Then sketch token → vector → blocks → distribution → token.","zh":"使用模型实验，解释为什么降低温度无法补回缺失的库存信息。然后画出词元→向量→模块→分布→词元。"},"exit":{"en":"Distinguish tokenizer, embedding, attention, parameters and inference in a two-minute explanation.","zh":"能在两分钟内区分分词器、嵌入、注意力、参数和推理。"}},{"id":"m2","title":{"en":"How models acquire behavior","zh":"模型如何获得能力与行为"},"tagline":{"en":"Separate changing weights from supplying context.","zh":"区分修改权重与提供上下文。"},"minutes":65,"prereq":["m1"],"refs":["S10","S11","S12","S38","P05","P07","P08","P09","P11","P12","P17"],"lab":"model","blocks":[{"title":{"en":"Pretraining","zh":"预训练"},"body":{"en":"Pretraining fits model parameters on a large training objective, commonly next-token prediction for autoregressive LLMs. It develops statistical representations useful across many tasks, but is not a database import with guaranteed exact recall. Training data quality, coverage and contamination affect what the resulting model can do. Model size alone is not an application acceptance criterion.","zh":"预训练通过大规模训练目标拟合模型参数，自回归大模型常用下一个词元预测。它形成可迁移到多种任务的统计表示，但不等于能保证准确读取的数据库导入。数据质量、覆盖面与污染都会影响模型能力。模型大小本身不能成为应用验收标准。"}},{"title":{"en":"Post-training and adaptation","zh":"后训练与适配"},"body":{"en":"Supervised fine-tuning learns from example input/output pairs. Preference optimization steers behavior using comparisons or rewards; RLHF is one family of methods, while DPO optimizes directly from preference pairs without a separate RL training loop. LoRA trains low-rank updates to selected weights. QLoRA combines a quantized base with trainable adapters. These approaches solve different parts of the adaptation problem.","zh":"监督微调从输入输出样例中学习。偏好优化利用比较或奖励调整行为；RLHF 是一类方法，DPO 则直接使用偏好对优化，不需要独立的强化学习训练循环。LoRA 对部分权重训练低秩更新；QLoRA 将量化基础模型与可训练适配器结合。这些方法解决适配问题的不同部分。"}},{"title":{"en":"In-context learning is not fine-tuning","zh":"上下文学习不是微调"},"body":{"en":"A prompt can include instructions, examples and retrieved evidence. The model conditions its response on these tokens, usually without changing its weights. This is the normal basis of few-shot prompting and application RAG. Persisting a chat history also does not mean the model has been retrained. Changes to weights, context and external memory need separate ownership and versioning.","zh":"提示可包含指令、样例和检索证据。模型依据这些词元生成响应，通常并不修改权重。这是少样本提示和应用 RAG 的常见基础。保存聊天历史也不代表模型经过重新训练。权重、上下文和外部记忆的变更需要分别管理与版本化。"}},{"title":{"en":"Reasoning and inference-time work","zh":"推理与推理时计算"},"body":{"en":"Intermediate reasoning, search, tool use, verification and additional inference computation can help some tasks. The 2022 chain-of-thought work is a prompting milestone; the 2025 DeepSeek-R1 paper is a particular reinforcement-learning training case. Neither proves that every model reasons the same way or that a longer explanation is more correct. Evaluate task outcomes and observable evidence rather than treating a reasoning narrative as proof.","zh":"中间推理、搜索、工具使用、验证和更多推理时计算能够帮助部分任务。2022 年的思维链工作是提示方法的重要节点；2025 年 DeepSeek-R1 是特定的强化学习训练案例。二者都不意味着所有模型使用同一种推理方式，也不意味着解释越长越正确。应评估任务结果和可观察证据，而不是把推理叙述当作证明。"}},{"title":{"en":"Choose the intervention by the error","zh":"根据错误选择干预方式"},"body":{"en":"Need fresh, permissioned facts? Improve retrieval or direct database access. Need stable formatting? Start with schemas and validation. Need consistent domain behavior and have representative labeled examples? Consider fine-tuning after establishing a baseline. Need arithmetic or transactions? Use tools. Fine-tuning is not a substitute for up-to-date inventory, access control or a business evaluation suite.","zh":"需要实时且受权限约束的事实？改进检索或数据库访问。需要稳定格式？先使用结构约束与验证。需要稳定领域行为，并有代表性标注样例？建立基线后再考虑微调。需要计算或事务？使用工具。微调不能替代最新库存、访问控制和业务评估集。"}}],"exercise":{"en":"Classify five problems: stale prices, inconsistent JSON, repeated domain misclassification, arithmetic error and missing source citations. Choose a first intervention and explain what would falsify your choice.","zh":"对五类问题选择第一步干预：价格过时、JSON 不稳定、反复领域误分类、计算错误、缺少来源引用。说明什么证据会推翻你的选择。"},"exit":{"en":"Explain pretraining, SFT, preference optimization, LoRA, RAG and in-context learning without treating them as interchangeable.","zh":"能够解释预训练、SFT、偏好优化、LoRA、RAG 与上下文学习，并说明它们不能互换。"}},{"id":"m3","title":{"en":"Prompting and context contracts","zh":"提示与上下文契约"},"tagline":{"en":"Tell the model the task; keep the application in charge.","zh":"向模型说明任务，让应用保持控制。"},"minutes":60,"prereq":["m0","m2"],"refs":["S27","S31","S35","P05","P09","P15"],"lab":"system","blocks":[{"title":{"en":"A task contract, not a magic phrase","zh":"任务契约，而非神奇咒语"},"body":{"en":"Specify the goal, permitted evidence, output shape, uncertainty behavior and examples of success and failure. Separate instructions from source material. For a quote draft, explicitly require units, evidence identifiers and unresolved fields. Ask for abstention or review when evidence is missing rather than rewarding a polished guess. Prompt quality is testable through a stable evaluation set.","zh":"明确目标、允许使用的证据、输出结构、不确定时的行为，以及成功和失败样例。区分指令与来源材料。报价草稿应明确要求单位、证据标识和待确认字段。证据缺失时要求弃答或送审，而不是奖励流畅猜测。提示质量可以通过稳定评估集验证。"}},{"title":{"en":"Context engineering","zh":"上下文工程"},"body":{"en":"Context engineering decides what enters each model call: instructions, current state, relevant documents, tool results and selected memory. It also decides what to omit or summarize. Larger context capacity is useful, but relevance, position, conflicting evidence and cost still matter. The 2023 “Lost in the Middle” results motivate testing evidence placement; they are not an immutable limit on every later model.","zh":"上下文工程决定每次调用输入哪些内容：指令、当前状态、相关文档、工具结果和选定记忆，也决定省略或摘要哪些内容。更大的上下文容量有用，但相关性、位置、冲突证据和成本仍重要。2023 年“Lost in the Middle”研究提示我们测试证据位置；它不是所有后续模型不可改变的限制。"}},{"title":{"en":"Valid JSON is not valid business logic","zh":"JSON 正确不等于业务正确"},"body":{"en":"Schema-constrained output can enforce supported structural requirements in a completed, non-refusal response. Applications still handle refusals, truncation and errors. Then validate semantics: quantity must be positive, currency must be known, an ERP item must exist, and the user must be allowed to see it. A syntactically valid invented price is still invented.","zh":"在完整且非拒绝的响应中，结构约束输出可满足支持范围内的结构要求。应用仍需处理拒绝、截断与错误，然后验证语义：数量为正、币种有效、ERP 商品存在且用户有权查看。一个语法完全正确但凭空编造的价格仍是编造。"}},{"title":{"en":"Documents are untrusted inputs","zh":"文档是不可信输入"},"body":{"en":"A retrieved page or email may contain instructions that conflict with the actual task. This is a prompt-injection risk, not a reason to grant the document authority. Enforce permissions and approved tool operations in code, isolate sensitive capabilities and review consequential actions. A sentence in a system prompt alone is not a security boundary.","zh":"检索页面或邮件可能包含与真实任务冲突的指令，这构成提示注入风险，并不意味着文档应获得指令权。应在代码中执行权限与工具操作约束，隔离敏感能力，对重要行动进行审批。系统提示中的一句话不是安全边界。"}},{"title":{"en":"Version the whole input contract","zh":"版本化完整输入契约"},"body":{"en":"Record prompt version, schema, model configuration, retrieval configuration and relevant evidence versions in a privacy-aware trace. A changed prompt may improve one document type and break another. Compare error slices, not only a single average score. Keep sensitive customer content out of casual debugging notes.","zh":"在考虑隐私的调用轨迹中记录提示版本、结构定义、模型配置、检索配置和相关证据版本。提示变更可能改善某类文档，却破坏另一类。应比较不同错误切片，而非只看一个平均分。不要把敏感客户内容写进随意的调试笔记。"}}],"exercise":{"en":"Write a quote-extraction contract with required fields, evidence IDs, unresolved fields and three validation rules. Include the behavior when an attachment has no readable quantity.","zh":"编写报价提取契约，包含必填字段、证据 ID、未解决字段和三条验证规则，并定义附件数量无法辨认时的行为。"},"exit":{"en":"Explain why prompt engineering, context engineering and application authorization are three different responsibilities.","zh":"能够解释提示工程、上下文工程与应用鉴权是三项不同责任。"}},{"id":"m4","title":{"en":"Documents to trusted data","zh":"从文档到可信数据"},"tagline":{"en":"Extraction is the beginning of validation, not the end.","zh":"提取是验证的开始，不是终点。"},"minutes":60,"prereq":["m3"],"refs":["S15","S18","S31","S33"],"lab":"retrieval","blocks":[{"title":{"en":"Preserve the evidence trail","zh":"保留证据链"},"body":{"en":"An email may contain native text, spreadsheet rows, PDF tables and scanned images. Use document structure where available; OCR recognizes text in images, while vision-language models can interpret visual content more broadly. Either can make errors. Preserve the original file reference, page or cell location, source timestamp and extraction version so that a reviewer can inspect the evidence.","zh":"邮件可能包含原生文本、表格行、PDF 表格和扫描图像。有文档结构时应加以利用；OCR 识别图像中的文字，视觉语言模型则能更广泛地理解视觉内容。两者都可能出错。应保留原文件引用、页码或单元格位置、来源时间与提取版本，让审核人能核对证据。"}},{"title":{"en":"Normalize without destroying meaning","zh":"归一化，但不破坏含义"},"body":{"en":"Separate raw text from normalized values. “5 boxes” is not automatically five individual items. A part number’s leading zero or suffix may be significant. Resolve units, currency, decimal conventions and time zones explicitly. Missing, unreadable, conflicting and genuinely zero are different states; do not collapse them into the same default.","zh":"区分原文与归一化数值。“5 箱”不自动等于 5 件。料号的前导零或后缀可能有意义。应明确单位、币种、小数习惯与时区。缺失、无法辨认、相互冲突和确实为零是不同状态，不应统一填成一个默认值。"}},{"title":{"en":"Entity resolution","zh":"实体消歧与匹配"},"body":{"en":"Map extracted mentions to authoritative records. Start with exact identifiers and known aliases; use fuzzy string matching for plausible spelling variations, and semantic retrieval for meaning-based candidates where appropriate. Similarity is a candidate-generation signal, not proof of interchangeability. A one-character difference in a part code may identify a different product.","zh":"把提取出的名称或标识映射到权威记录。先用精确标识和已知别名；拼写变化可用模糊字符串匹配，意义层面的候选可适当使用语义检索。相似度用于产生候选，并不能证明可互换。料号只差一个字符，也可能是完全不同的产品。"}},{"title":{"en":"Confidence needs a definition","zh":"置信度必须先定义"},"body":{"en":"Do not ask a model for “95% confident” and assume the number is calibrated. Build evidence-based decision signals: exact match, field validation, source agreement and measured error rates on representative data. Route ambiguous or high-consequence cases to review. Evaluate individual fields and complete records; high field accuracy can still yield many imperfect multi-field records.","zh":"不能让模型声称“95% 确信”，就假定该数字经过校准。应建立基于证据的决策信号：精确匹配、字段验证、多来源一致性以及代表性数据上的实测错误率。模糊或后果严重的情况应送审。既评估单个字段，也评估完整记录；很高的字段准确率仍可能产生大量不完整正确的多字段记录。"}},{"title":{"en":"Design the review screen","zh":"设计审核界面"},"body":{"en":"Show the proposed value beside its evidence and any competing candidate. Make corrections structured, record the reason, and decide how corrections feed evaluation or a governed knowledge base. A human approval button without enough context merely moves an invisible error to another person.","zh":"把建议值、对应证据和其他候选并排展示。用结构化方式记录修改和原因，并决定这些修改如何进入评估集或受治理的知识库。审批按钮若没有足够上下文，只是把不可见的错误转交给另一个人。"}}],"exercise":{"en":"Define a record schema for part, quantity, unit and requested date. For each field add raw value, normalized value, source location and validation status.","zh":"为料号、数量、单位、需求日期定义记录结构；每个字段附上原始值、归一化值、来源位置和验证状态。"},"exit":{"en":"Distinguish extraction error, normalization error, entity-matching error and business-rule rejection.","zh":"能区分提取错误、归一化错误、实体匹配错误与业务规则拒绝。"}},{"id":"m5","title":{"en":"Retrieval and RAG","zh":"检索与 RAG"},"tagline":{"en":"Find the right evidence before asking for the right answer.","zh":"先找到正确证据，再要求正确答案。"},"minutes":90,"prereq":["m3","m4"],"refs":["S16","S17","S18","P01","P06","P15","H01","S40"],"lab":"retrieval","blocks":[{"title":{"en":"Why retrieval joined generation","zh":"为什么把检索与生成结合"},"body":{"en":"Model parameters are not a convenient store for rapidly changing, permissioned business records. RAG supplies retrieved evidence at inference time. A 2020 paper established an influential named formulation; search and retrieval-augmented systems have much older roots. An application can also retrieve evidence for a human or a deterministic rule without generating any prose.","zh":"模型参数并不适合存放快速变化、受权限约束的业务记录。RAG 在推理时提供检索证据。2020 年论文形成了重要的命名方法，但搜索和检索增强系统的历史更早。应用也可以把证据交给人工或确定性规则，并不一定要生成文字。"}},{"title":{"en":"The two pipelines","zh":"两条流水线"},"body":{"en":"Offline: ingest, parse, clean, chunk, attach metadata and permissions, embed where appropriate, and index. Online: identify user and task, enforce scope, form a query, retrieve candidates, fuse or rerank them, build a bounded context, generate an answer and verify its evidence. Refreshes, deletions and access changes must propagate to the index. An embedding index is a derived artifact, not necessarily the source of truth.","zh":"离线：采集、解析、清洗、切块、附加元数据和权限、按需嵌入并建索引。在线：识别用户与任务、执行范围约束、构造查询、检索候选、融合或重排、组织受限上下文、生成答案并验证证据。更新、删除和权限变化必须传播到索引。向量索引是派生数据，不一定是事实源。"}},{"title":{"en":"Four kinds of matching","zh":"四种不同的匹配"},"body":{"en":"Exact matching identifies an exact code. Fuzzy matching tolerates character edits. Lexical ranking such as BM25 scores term-based relevance. Dense vector search retrieves learned semantic similarity. None subsumes all the others. Part-number lookup often needs identifiers and lexical signals; a paraphrased policy question may benefit from semantic search. Compare these behaviors in the toy lab.","zh":"精确匹配识别完全一致的代码。模糊匹配容忍字符编辑。BM25 等词法排序根据词项相关性打分。稠密向量搜索检索学习到的语义相似度。它们不能完全互相替代。料号查询通常需要标识符和词法信号；改写后的政策问题可能受益于语义搜索。可在教学实验中比较。"}},{"title":{"en":"Hybrid retrieval and reranking","zh":"混合检索与重排"},"body":{"en":"Hybrid retrieval combines complementary candidate sources. Reciprocal rank fusion combines ranks rather than blindly adding incompatible scores. A cross-encoder reranker jointly reads query and candidate to prioritize a smaller set; this usually adds work and must justify its cost. More retrieved chunks can introduce noise and contradictions. Tune recall, ranking and evidence usefulness on your own tasks.","zh":"混合检索结合互补的候选来源。倒数排名融合使用名次，而不是盲目相加不兼容的分数。交叉编码器重排器联合读取查询和候选，对较小候选集排序；这会增加计算，应证明其成本值得。更多切块可能引入噪声和矛盾。应基于自己的任务调节召回、排序和证据可用性。"}},{"title":{"en":"Debug the chain, not the label","zh":"沿链路诊断，不要只说 RAG 不行"},"body":{"en":"First ask whether the needed evidence exists and is authorized. Then check parsing, chunk boundaries, identifiers, retrieval recall, reranking, context construction and answer grounding. Measure retrieval separately from generation. A citation must actually support the claim; a formatted source link is not sufficient. Missing evidence should trigger an explicit limitation or review, not confident completion.","zh":"先检查所需证据是否存在且允许访问，再检查解析、切块边界、标识符、检索召回、重排、上下文组织与回答依据。把检索和生成分开评估。引用必须真正支持结论，仅仅格式化一个来源链接并不够。缺少证据时应明确说明限制或送审，而不是自信补全。"}}],"exercise":{"en":"Test a part-code typo and a paraphrased policy question in the lab. Explain which retrieval signals helped, which created false candidates, and where authorization belongs.","zh":"在实验中测试料号拼写错误和改写后的政策问题，解释哪些检索信号有用、哪些引入错误候选，以及鉴权应该放在哪里。"},"exit":{"en":"Draw indexing and query-time paths. Explain RAG versus fine-tuning, fuzzy versus semantic matching, and retrieval recall versus answer correctness.","zh":"能画出索引和查询两条路径，解释 RAG 与微调、模糊与语义匹配、检索召回与回答正确率的区别。"}},{"id":"m6","title":{"en":"Knowledge graphs and GraphRAG","zh":"知识图谱与 GraphRAG"},"tagline":{"en":"Model relationships only when the questions justify it.","zh":"只有问题需要时，才显式建模关系。"},"minutes":75,"prereq":["m5"],"refs":["S19","S20","S21","S22","P16","H02","P20"],"lab":"graph","blocks":[{"title":{"en":"A concept map is not a production knowledge graph","zh":"学习概念图不等于生产知识图谱"},"body":{"en":"This site’s topic map helps a person navigate ideas. A business knowledge graph stores identified entities and explicit typed relationships, often with properties and provenance. A supplier, an individual part and a certificate must have stable identities. “Supplies”, “certified by” and “valid until” mean different things and require deliberate modeling.","zh":"本站的主题图帮助人理解概念。业务知识图谱则存储已识别实体与显式、带类型的关系，常包含属性和来源。供应商、具体零件和证书必须有稳定身份。“供应”“由谁认证”“有效期至”含义不同，需要有意识地建模。"}},{"title":{"en":"RDF, property graphs and ontology","zh":"RDF、属性图与本体"},"body":{"en":"RDF represents statements as subject–predicate–object triples; a property graph attaches properties to nodes and relationships. An ontology or schema defines the types and relationships your domain permits. These are related approaches, not identical products. Explicit knowledge representation predates LLMs; the 1999 RDF recommendation is one standardization milestone, not the invention of knowledge graphs.","zh":"RDF 使用主语—谓语—宾语三元组表达陈述；属性图把属性附着到节点和关系。本体或模式定义领域允许的类型与关系。它们有关联，但不是同一种产品。显式知识表示早于大模型；1999 年 RDF 推荐标准只是标准化节点，不是知识图谱的发明。"}},{"title":{"en":"What a graph can help answer","zh":"图能帮助回答什么"},"body":{"en":"A multi-hop question may connect a customer requirement to a part, an approved supplier and a current certificate. Traversal can expose the relationship path and its evidence. A relational database with appropriate joins may already answer the same question well. Choose a graph for relationship-centered workloads, reuse and governance needs—not because the input includes several nouns.","zh":"多跳问题可能把客户要求连接到零件、批准的供应商和有效证书。遍历可展示关系路径与证据。设计合适的关系数据库连接也可能很好地回答同一问题。选择图应基于以关系为中心的查询、复用与治理需求，而不是因为输入里有几个名词。"}},{"title":{"en":"GraphRAG has more than one meaning","zh":"GraphRAG 不止一种含义"},"body":{"en":"Broadly, graph-enhanced RAG uses graph structure in indexing or retrieval. Microsoft’s GraphRAG approach extracts entities and relationships and builds community summaries, supporting local entity-focused and broader corpus-level questions through different retrieval modes. It is not a synonym for every graph database, nor proof that a graph always beats ordinary RAG. A vector index’s HNSW neighbor graph is not a business knowledge graph.","zh":"广义的图增强 RAG 在索引或检索中使用图结构。微软 GraphRAG 提取实体与关系并构建社区摘要，通过不同检索模式支持局部实体问题和更广泛的语料级问题。它不等于所有图数据库，也不证明图总优于普通 RAG。向量索引中的 HNSW 邻接图不是业务知识图谱。"}},{"title":{"en":"The maintenance bill","zh":"维护成本不能忽略"},"body":{"en":"Entity resolution, extraction errors, duplicate identities, contradictory sources, expired relationships and access control all require management. An LLM-extracted edge is a candidate claim until validated against the application’s evidence policy. Budget for incremental updates and deletion, not just initial graph construction. Compare answer quality, freshness, inspectability and total cost against a simpler retrieval or SQL baseline.","zh":"实体消歧、提取错误、身份重复、来源冲突、关系过期与访问控制都需要管理。大模型提取出的边，在按应用证据策略验证前，只是候选陈述。预算要包含增量更新与删除，而不只是首次建图。应把答案质量、新鲜度、可检查性和总成本与更简单的检索或 SQL 基线比较。"}}],"exercise":{"en":"Use the graph lab. Follow the supplier–part–certificate path, then exclude an expired certificate. Write the evidence fields needed before the result could support an approval.","zh":"使用图实验，跟随供应商—零件—证书路径，再排除过期证书。写出在结果可以支持审批之前必须具备的证据字段。"},"exit":{"en":"Explain when SQL, vector RAG, graph-enhanced retrieval and Microsoft GraphRAG solve different problems.","zh":"能解释 SQL、向量 RAG、图增强检索与微软 GraphRAG 分别适合什么问题。"}},{"id":"m7","title":{"en":"Workflows to agents","zh":"从工作流到智能体"},"tagline":{"en":"Autonomy is a design choice, not a maturity score.","zh":"自主性是一种设计选择，不是成熟度分数。"},"minutes":80,"prereq":["m3","m5"],"refs":["S23","S24","S25","S32","P10"],"lab":"agent","blocks":[{"title":{"en":"Who chooses the next step?","zh":"谁决定下一步？"},"body":{"en":"In a workflow, code defines the control flow, even if individual steps call an LLM. In an agentic loop, a model has some authority to choose actions or the next step based on observations. Real applications often mix these patterns. A fixed extraction → lookup → draft pipeline is not less valuable because it is not highly autonomous.","zh":"工作流由代码定义控制流程，即使其中某些步骤调用大模型。智能体循环中，模型根据观察对行动或下一步拥有一定选择权。实际应用经常混合两种模式。固定的提取→查询→草稿流水线，不会因为自主性较低而价值更小。"}},{"title":{"en":"The minimum loop","zh":"最小循环"},"body":{"en":"Give the model a goal, current state and permitted tool descriptions. It may propose an action; the application validates and executes the allowed request, returns an observation and updates state. Continue until a verified stop condition, budget limit, failure or human escalation. ReAct is a 2022 research milestone for interleaving reasoning and acting, not the origin of all software agents.","zh":"给模型目标、当前状态与允许的工具描述。模型可提出行动；应用验证并执行获准的请求，返回观察并更新状态。循环在验证通过的终止条件、预算耗尽、失败或人工升级时结束。ReAct 是 2022 年交替推理与行动的研究节点，不是所有软件智能体的起点。"}},{"title":{"en":"Patterns before frameworks","zh":"先理解模式，再选框架"},"body":{"en":"Prompt chaining fits decomposable steps; routing selects specialized paths; parallelization handles independent subtasks; an orchestrator can delegate bounded work; an evaluator can critique a draft. Extra agents add coordination, latency and failure surfaces. Demonstrate an improvement over a single well-designed workflow before adding multi-agent structure.","zh":"提示链适合可分解步骤；路由选择专门路径；并行处理独立子任务；编排器可以委派范围明确的工作；评估器可以检查草稿。增加智能体也增加协调、延迟和失败面。在加入多智能体结构前，应证明它优于一个设计良好的单工作流。"}},{"title":{"en":"State and side effects","zh":"状态与外部影响"},"body":{"en":"Keep durable task state outside the model. Use timeouts, retry policies, step budgets and idempotency keys for consequential writes. A retried “create quote” should not create duplicates. Separate read-only tools from tools that send, purchase or modify records. The interface should make pending actions, evidence and approval ownership explicit.","zh":"把持久任务状态放在模型之外。对会影响业务记录的写入使用超时、重试策略、步骤预算与幂等键。重试“创建报价”不应该产生重复记录。区分只读工具与发送、采购、修改记录的工具。界面应明确待执行行动、证据和审批责任。"}},{"title":{"en":"Evaluate the world, not the promise","zh":"评估实际状态，而不是承诺"},"body":{"en":"An agent saying “done” is not proof that the intended record exists or that it is correct. Inspect final environment state, tool arguments, permissions and user-visible outcome. Use constrained test environments before production. An agent architecture is justified when adaptive decisions improve the task enough to cover the extra control and evaluation burden.","zh":"智能体说“完成”不能证明目标记录存在或正确。应检查最终环境状态、工具参数、权限与用户可见结果。上线前使用受约束的测试环境。只有自适应决策带来的改善足以覆盖额外控制和评估负担时，智能体架构才值得采用。"}}],"exercise":{"en":"Step through both lab modes. Specify the stop condition, maximum tool calls, approval gate and duplicate-write defense for a quotation assistant.","zh":"逐步运行实验中的两种模式，为报价助手指定停止条件、工具调用上限、审批关卡和防重复写入机制。"},"exit":{"en":"Explain workflow versus agent using control flow, then defend the simplest adequate architecture for one task.","zh":"能用控制流程解释工作流与智能体的区别，并为某个任务选择足够简单且可行的架构。"}},{"id":"m8","title":{"en":"Tools, protocols, skills and memory","zh":"工具、协议、技能与记忆"},"tagline":{"en":"Interoperability does not replace authorization.","zh":"互操作性不能替代鉴权。"},"minutes":60,"prereq":["m7"],"refs":["S26","S27","S28","S29","S30","S32","H03","H04"],"lab":"agent","blocks":[{"title":{"en":"A tool is an application contract","zh":"工具是应用契约"},"body":{"en":"A tool exposes a bounded capability such as lookup_stock(part_id), with input shape, result shape and errors. A model can generate a tool request; your application or tool runtime performs the action. Validate arguments, caller identity, allowed scope and business preconditions. A JSON schema describes data, not whether the user has the right to act.","zh":"工具暴露查库存等范围明确的能力，规定输入结构、结果结构与错误。模型可生成工具请求，实际行动由应用或工具运行时执行。必须验证参数、调用身份、允许范围与业务前置条件。JSON Schema 描述数据，不代表用户有权行动。"}},{"title":{"en":"What MCP standardizes","zh":"MCP 标准化什么"},"body":{"en":"The Model Context Protocol, introduced in November 2024, standardizes interaction between AI hosts and servers exposing capabilities such as tools, resources and prompts. The host contains clients that connect to servers. It reduces bespoke integration work; it is not itself a complete agent planner, a business workflow or a blanket security guarantee. Consult the live specification for implementation details.","zh":"2024 年 11 月提出的模型上下文协议，标准化 AI 宿主与暴露工具、资源、提示等能力的服务器之间的交互。宿主内的客户端连接服务器。它减少定制集成工作，但本身不是完整的智能体规划器、业务流程或安全保证。实现细节应查阅实时规范。"}},{"title":{"en":"Tools versus skills versus memory","zh":"工具、技能、记忆的区别"},"body":{"en":"A tool is a capability you can call. A skill packages procedural guidance and potentially scripts or resources for a class of tasks. Memory stores selected information across interactions; retrieval decides which part is useful now. Loading all skills and all history on every call can waste context. Persistent memory needs source, owner, expiration and deletion rules just like other application data.","zh":"工具是可调用的能力。技能为一类任务打包操作指引，也可能包含脚本或资源。记忆跨交互保存选定信息；检索决定当前哪部分有用。每次加载全部技能与全部历史可能浪费上下文。持久记忆和其他应用数据一样，需要来源、责任人、过期与删除规则。"}},{"title":{"en":"What A2A is for","zh":"A2A 解决什么问题"},"body":{"en":"Agent-to-agent protocols address communication and coordination across agent systems. That is different from a model-facing tool interface. Google’s April 2025 A2A announcement is useful historical context; implementation should follow the applicable current specification. A small first POC often needs clear local tool contracts more urgently than a federation of agents.","zh":"智能体间协议处理不同智能体系统之间的通信和协调，这不同于面向模型的工具接口。Google 在 2025 年 4 月的 A2A 发布可用于了解历史；实现应遵循适用的当前规范。一个小型初始 POC 往往更需要清晰的本地工具契约，而不是联邦式智能体体系。"}},{"title":{"en":"The trust boundary survives the protocol","zh":"采用协议后，信任边界仍然存在"},"body":{"en":"Treat remote tool output as data, protect credentials, restrict network destinations and log consequential operations appropriately. User sign-in and an unattended service’s application permission are different access paths. A successful connection proves transport and compatibility, not the correctness of the business authorization model.","zh":"远程工具输出应视为数据，必须保护凭据、限制网络目标并合理记录重要操作。用户登录和无人值守服务的应用权限是两条不同的访问路径。连接成功只能证明传输与兼容性，并不能证明业务授权模型正确。"}}],"exercise":{"en":"Design a read-only inventory tool and a separate quote-creation tool. Specify identity, scope, errors, approval, idempotency and the exact observable success condition.","zh":"设计只读库存工具与独立的报价创建工具，明确身份、范围、错误、审批、幂等性和可观察的成功条件。"},"exit":{"en":"Explain MCP, tool calling, skills, memory and A2A without presenting them as interchangeable agent frameworks.","zh":"能够解释 MCP、工具调用、技能、记忆和 A2A，而不把它们都说成可互换的智能体框架。"}},{"id":"m9","title":{"en":"Evaluation and debugging","zh":"评估与故障定位"},"tagline":{"en":"Replace “the demo looked good” with repeatable evidence.","zh":"用可重复证据替代“演示看起来不错”。"},"minutes":90,"prereq":["m4","m5","m7"],"refs":["S01","S33","S34"],"lab":"eval","blocks":[{"title":{"en":"Start from a measurable task","zh":"从可测量任务开始"},"body":{"en":"Define input, allowed evidence, expected outcome and unacceptable consequences. Build a representative, permissioned test set with document types, languages, ambiguity, missing data and difficult cases. Keep a held-out set apart from prompt tuning and training. A dataset of convenient successful demos tells you little about the real workload.","zh":"定义输入、允许证据、期望结果与不可接受的后果。建立有权限使用的代表性测试集，覆盖文档类型、语言、歧义、缺失数据与困难案例。将保留测试集与提示调优和训练数据分开。只由方便且成功的演示组成的数据集，很难反映真实工作负载。"}},{"title":{"en":"Evaluate the layers separately","zh":"分层评估"},"body":{"en":"For extraction, measure field and record correctness. For retrieval, measure whether relevant evidence appears and how it ranks. For generation, check correctness, grounding and instruction compliance. For actions, inspect authorized final state and side effects. For the product, measure accepted outputs, review effort, completion time and sustained adoption. A single “accuracy” number hides these differences.","zh":"提取层评估字段与整条记录是否正确。检索层评估相关证据是否出现及其排名。生成层检查正确性、依据与指令遵循。行动层检查获授权的最终状态与外部影响。产品层衡量输出采用率、审核成本、完成时间和持续使用。单一“准确率”会掩盖这些区别。"}},{"title":{"en":"Graders need validation too","zh":"评分器也需要验证"},"body":{"en":"Use deterministic checks where possible, expert review for domain judgments and model-based judges where a rubric is suitable. Calibrate an LLM judge against human-labeled examples and inspect disagreements. A judge can prefer verbosity or share the generator’s blind spots. Explain what the grader can and cannot measure before treating its number as truth.","zh":"能用确定性检查时优先使用；领域判断交给专家；适合明确评分标准的地方可采用模型评分器。用人工标注样例校准大模型评分器并检查分歧。评分器可能偏好冗长，也可能与生成模型存在相同盲点。在把分数当成事实前，应明确它能衡量什么、不能衡量什么。"}},{"title":{"en":"Repeated attempts are different metrics","zh":"多次尝试有不同指标"},"body":{"en":"A task is the scenario; a trial is one run; a trace is the sequence of events; the outcome is the resulting state. pass@k asks whether at least one of k attempts succeeds. pass^k asks whether all k attempts succeed. They answer different questions, and real trials may be correlated. Report the setup, number of trials and uncertainty rather than presenting a best-of-many result as single-run reliability.","zh":"任务是场景，一次试验是一次运行，轨迹是事件序列，结果是运行后的状态。pass@k 关注 k 次尝试中至少一次成功；pass^k 关注 k 次全部成功。两者回答不同问题，实际试验也可能相关。应报告设置、试验次数与不确定性，而不是把多次取最佳成绩当成单次可靠性。"}},{"title":{"en":"Close the loop","zh":"把评估接回迭代"},"body":{"en":"Store failures with root-cause labels and a reproduction recipe. Compare changes on relevant slices and regression tests, then use shadow or limited release before expanding. The review-threshold lab uses deliberately synthetic scores: it demonstrates a precision–coverage trade-off, not a calibrated confidence system. Measure thresholds on your own data before using them to automate real decisions.","zh":"保存带根因标签和复现方法的失败案例。针对相关切片与回归测试比较变更，再通过影子运行或有限发布逐步扩大。本站阈值实验使用刻意构造的合成分数，只展示精确率与覆盖率的取舍，不是校准后的置信度系统。自动化真实决策前，必须在自己的数据上验证阈值。"}}],"exercise":{"en":"Create ten evaluation cases with expected evidence, expected record state and a failure label. Include two “must ask a human” cases. Explain why a judge score alone cannot approve ERP writes.","zh":"建立十个评估案例，写明预期证据、预期记录状态和失败标签，其中两个必须交给人工。解释为什么评分器分数不能单独授权 ERP 写入。"},"exit":{"en":"Diagnose a failed task by layer and distinguish offline quality, operational reliability and realized business value.","zh":"能够按层诊断失败，区分离线质量、运行可靠性与已实现的商业价值。"}},{"id":"m10","title":{"en":"Production economics and safety","zh":"生产成本、可靠性与安全"},"tagline":{"en":"Optimize successful work, not just tokens.","zh":"优化成功完成的工作，而不只是词元。"},"minutes":85,"prereq":["m7","m8","m9"],"refs":["S35","S36","S37","S38","P12","P13","P14"],"lab":"economics","blocks":[{"title":{"en":"Latency has a shape","zh":"延迟有不同形态"},"body":{"en":"Time to first token is not total task completion time. Parsing, retrieval, tool calls, serial model steps, output length and human review all contribute. Measure end-to-end p50 and p95 for realistic workloads. Streaming can improve perceived responsiveness without making the final transaction finish sooner. Remove unnecessary work before adopting a more elaborate serving stack.","zh":"首词元延迟不是任务总完成时间。解析、检索、工具调用、串行模型步骤、输出长度和人工审核都会贡献延迟。应在真实工作负载下测量端到端 p50 与 p95。流式输出可改善感知响应，但不一定让最终事务更快完成。采用复杂推理服务前，先减少不必要的工作。"}},{"title":{"en":"The useful unit of cost","zh":"有意义的成本单位"},"body":{"en":"Token cost is only one component. Count retries, failed tasks, retrieval, tools, hosting, observability, review, support and integration maintenance. Divide the relevant total by successfully completed, accepted tasks. Specify currency, time period and what is excluded. The calculator uses editable teaching assumptions, not current provider prices or a customer ROI claim.","zh":"词元费用只是一个组成部分。还要计入重试、失败任务、检索、工具、托管、可观测性、审核、支持和集成维护。用相关总成本除以成功完成且被接受的任务数。明确币种、时间范围和排除项。本站计算器使用可编辑教学假设，不是当前厂商价格或客户投资回报声明。"}},{"title":{"en":"Model and serving choices","zh":"模型与推理服务选择"},"body":{"en":"Quantization reduces numerical precision to save resources, with task-dependent quality trade-offs. Distillation trains a student from a teacher’s signals. Caching and batching can improve efficiency but introduce freshness or latency considerations. FlashAttention optimizes attention memory traffic; PagedAttention improves KV-cache memory management. These are serving or model techniques, not substitutes for a sound application design.","zh":"量化降低数值精度以节省资源，对质量的影响取决于任务。蒸馏用教师模型信号训练学生模型。缓存与批处理可提高效率，也带来新鲜度或延迟问题。FlashAttention 优化注意力计算中的显存搬运；PagedAttention 改进 KV 缓存管理。这些模型或服务技术不能替代合理的应用设计。"}},{"title":{"en":"Boundaries before promises","zh":"先明确边界，再做承诺"},"body":{"en":"Apply least privilege, tenant isolation, data minimization, secret management and review for consequential actions. Plan retention and deletion for source data, indexes, memory and traces. Self-hosting changes where responsibilities sit; it does not automatically make a system secure. OWASP and NIST provide risk vocabulary and guidance, not an automatic certification or jurisdiction-specific legal conclusion.","zh":"实施最小权限、租户隔离、数据最小化、密钥管理，并对重要行动进行审核。为源数据、索引、记忆和轨迹规划保留与删除。自托管改变责任分配，并不自动使系统安全。OWASP 和 NIST 提供风险词汇与指导，不等于自动认证，也不是针对某个司法辖区的法律结论。"}},{"title":{"en":"Operate for failure","zh":"按会失败来设计"},"body":{"en":"Define timeouts, retries with bounds, circuit breakers, fallback behavior, monitoring and rollback. Some cases should degrade to a draft or human queue, not continue autonomously. Track model, prompt and index versions so that regressions are reproducible. Reclaimed staff time is capacity; it becomes a financial benefit only through an explicit, evidenced realization mechanism.","zh":"定义超时、有界重试、熔断、降级、监控与回滚。某些情况应降级为草稿或人工队列，而不是继续自主执行。记录模型、提示与索引版本，以便复现回归问题。节省的员工时间首先是释放产能；只有明确且有证据的实现机制，才能把它计为财务收益。"}}],"exercise":{"en":"Estimate cost per accepted task using the calculator. Then list three cost items it excludes and one failure that requires stopping rather than retrying.","zh":"用计算器估算每个被接受任务的成本，再列出三项未被计入的成本，以及一种应该停止而非重试的失败。"},"exit":{"en":"Discuss latency, cost, permissions, rollback and failure ownership in the same architecture review.","zh":"能在同一次架构评审中讨论延迟、成本、权限、回滚和失败责任。"}},{"id":"m11","title":{"en":"The FDE design conversation","zh":"FDE 设计与客户对话"},"tagline":{"en":"Translate a business problem into a falsifiable system proposal.","zh":"把业务问题转为可被证伪的系统方案。"},"minutes":90,"prereq":["m9","m10"],"refs":["S15","S23","S33","S36"],"lab":"system","blocks":[{"title":{"en":"Observe work before prescribing AI","zh":"先观察工作，再开 AI 处方"},"body":{"en":"Ask a user to walk through a recent real case, including the inputs, decisions, systems, exceptions and handoffs. Separate the stated request (“we need an agent”) from the underlying need (“we lose quotes when item matching stalls”). Identify the operator, process owner, economic buyer, IT/security reviewer and the person authorized to accept the result.","zh":"让用户走一遍最近真实案例，包括输入、决策、系统、例外与交接。区分表面要求“我们需要智能体”和底层诉求“商品匹配卡住导致报价流失”。识别操作人员、流程负责人、经济买方、IT/安全审核者与有权验收结果的人。"}},{"title":{"en":"Choose a baseline and a bounded wedge","zh":"选择基线与有边界的切入点"},"body":{"en":"Compare the proposal with the current process and a simpler non-LLM option. Pick a narrow workflow with observable input and outcome, usable data and an owner who can change the process. State what the POC will not do. Define sample coverage, acceptance criteria, failure handling and the production path before polishing a demonstration.","zh":"将方案与现有流程和更简单的非大模型方案比较。选择输入输出可观察、数据可用且有人能推动流程变更的小范围流程。明确 POC 不做什么。在打磨演示前，定义样本覆盖、验收标准、失败处理和进入生产的路径。"}},{"title":{"en":"Ask architecture questions with business consequences","zh":"让架构问题连接商业后果"},"body":{"en":"Which source is authoritative? Which errors are reversible? Who approves writes? What happens when data is absent? How often does evidence change? What is the acceptable delay? These questions determine whether to use rules, direct SQL, RAG, graph retrieval, fine-tuning, a workflow or an agent. A technology label should follow the evidence, not lead the sales conversation.","zh":"哪些来源最权威？哪些错误可逆？谁审批写入？数据缺失时怎么办？证据多久变化一次？可接受延迟是多少？这些问题决定使用规则、直接 SQL、RAG、图检索、微调、工作流还是智能体。技术标签应跟随证据，而不是主导销售对话。"}},{"title":{"en":"Bridge to internal product onboarding (#2)","zh":"衔接内部产品学习（第 2 项）"},"body":{"en":"Your colleagues own the product and customer evidence. Use the handoff template to request the customer profile, original workflow, alternative solutions, differentiating capability, measured baseline, observed result, adoption, delivery costs and charging logic. Mark every result as measured, estimated or not yet known. Do not infer willingness to pay from technical accuracy alone.","zh":"产品与客户证据由你们同事负责。交接模板用于收集客户画像、原流程、替代方案、差异能力、实测基线、观察结果、采用情况、交付成本与收费逻辑。每个结果都标明实测、估计或未知。不能单凭技术准确率推断付费意愿。"}},{"title":{"en":"Bridge to stalled or failed cases (#3)","zh":"衔接卡顿与失败案例（第 3 项）"},"body":{"en":"Separate commercial blockers—sponsor, budget, procurement, incentives, unclear ownership—from technical/product blockers such as missing data, weak evaluation, integration limits, unacceptable errors and poor review UX. Then look for interactions: an apparently technical delay may reflect no process owner; a “price problem” may hide uncertain value. Record evidence, alternative explanations and the next discriminating test.","zh":"区分商业阻力，如支持者、预算、采购、激励与责任不清；以及技术产品阻力，如数据缺失、评估薄弱、集成限制、不可接受错误与审核体验差。再看相互影响：表面技术延期可能源于没有流程负责人；“价格问题”可能隐藏价值不明确。记录证据、其他解释和下一项能区分原因的测试。"}}],"exercise":{"en":"Deliver a ten-minute design review of the synthetic RFQ case: baseline, architecture, three failure modes, evaluation plan, approval boundary and cost assumptions. Then fill the internal handoff templates with questions—not invented answers.","zh":"用十分钟评审合成询价案例：基线、架构、三种失败模式、评估计划、审批边界和成本假设。再用问题填写内部交接模板，不要编造答案。"},"exit":{"en":"Make a justified recommendation, state uncertainty and evidence gaps, and name the next experiment and decision owner.","zh":"能提出有依据的建议，说明不确定性与证据缺口，明确下一步实验与决策责任人。"}}],"glossary":[{"id":"g1","term":"AI · Artificial intelligence","cn":"人工智能","definition":{"en":"The broad field of systems performing tasks associated with intelligence; not limited to neural networks.","zh":"让系统完成智能相关任务的广泛领域，不限于神经网络。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g2","term":"ML · Machine learning","cn":"机器学习","definition":{"en":"Methods that fit patterns from data rather than specifying every behavior as a rule.","zh":"从数据中拟合规律，而不是为每种行为编写规则的方法。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g3","term":"Deep learning","cn":"深度学习","definition":{"en":"Machine learning using multilayer neural networks to learn representations.","zh":"使用多层神经网络学习表示的机器学习方法。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g4","term":"Generative AI","cn":"生成式人工智能","definition":{"en":"Models and systems that generate outputs such as text, images, audio or video.","zh":"生成文本、图像、音频或视频等内容的模型与系统。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g5","term":"LLM · Large language model","cn":"大语言模型","definition":{"en":"A large learned model of language sequences; it is one family within generative AI.","zh":"学习语言序列的大型模型，是生成式 AI 的一个类别。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g6","term":"Foundation model","cn":"基础模型","definition":{"en":"A broadly trained model that can be adapted to many downstream tasks.","zh":"经过广泛训练、可适配多种下游任务的模型。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g7","term":"NLP · Natural language processing","cn":"自然语言处理","definition":{"en":"Computational methods for analyzing, transforming and generating human language.","zh":"分析、转换和生成人类语言的计算方法。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g8","term":"Model architecture","cn":"模型架构","definition":{"en":"The computational structure inside a model, such as attention and feed-forward blocks.","zh":"模型内部的计算结构，例如注意力与前馈模块。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g9","term":"Application architecture","cn":"应用架构","definition":{"en":"The arrangement of interfaces, models, data, tools, controls and operational services.","zh":"界面、模型、数据、工具、控制与运行服务的组织方式。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g10","term":"Inference","cn":"推理／模型运行","definition":{"en":"Running a trained model on inputs; this does not imply logical reasoning or weight updates.","zh":"在输入上运行已训练模型，不必然意味着逻辑推理或权重更新。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g11","term":"Training","cn":"训练","definition":{"en":"Optimizing model parameters using data and an objective function.","zh":"利用数据与目标函数优化模型参数。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g12","term":"Parameters / weights","cn":"参数／权重","definition":{"en":"Learned numerical values controlling the model’s computation; not ordinary database records.","zh":"控制模型计算的学习数值，不是普通数据库记录。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g13","term":"Generalization","cn":"泛化","definition":{"en":"Performance on relevant examples beyond the data used to fit or tune the system.","zh":"系统在用于训练或调优的数据之外，处理相关样例的能力。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g14","term":"Baseline","cn":"基线","definition":{"en":"A defined comparison system or existing process, measured on the same task and conditions.","zh":"在相同任务与条件下测量的对照系统或现有流程。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g15","term":"Multimodal model","cn":"多模态模型","definition":{"en":"A model that processes or produces more than one modality, such as text and images.","zh":"能够处理或产生不止一种模态，例如文本与图像的模型。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g16","term":"VLM · Vision-language model","cn":"视觉语言模型","definition":{"en":"A model connecting visual inputs with language tasks; visual understanding can still be wrong.","zh":"连接视觉输入与语言任务的模型，其视觉理解仍可能出错。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"core"},{"id":"g17","term":"Diffusion model","cn":"扩散模型","definition":{"en":"A generative approach learning to reverse a noise process; distinct from ordinary next-token text generation.","zh":"学习逆转加噪过程的生成方法，不同于普通的下一个词元文本生成。"},"category":"foundations","module":"m0","refs":["P19"],"priority":"deeper"},{"id":"g18","term":"Discriminative model","cn":"判别模型","definition":{"en":"A model used to predict labels or distinctions from inputs rather than primarily generate content.","zh":"用于从输入预测标签或差异，而非主要生成内容的模型。"},"category":"foundations","module":"m0","refs":["S01","S02"],"priority":"deeper"},{"id":"g19","term":"Token","cn":"词元","definition":{"en":"A unit produced by a tokenizer; it is not necessarily a word or a character.","zh":"分词器产生的单位，不一定等于一个词或字符。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g20","term":"Tokenizer","cn":"分词器","definition":{"en":"The algorithm and vocabulary mapping inputs to model token IDs and back.","zh":"将输入映射为模型词元 ID 并反向转换的算法与词表。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g21","term":"BPE · Byte-pair encoding","cn":"字节对编码","definition":{"en":"A subword-tokenization family that merges frequent symbol pairs; implementations differ.","zh":"通过合并高频符号对构造子词的分词方法，具体实现存在差异。"},"category":"architecture","module":"m1","refs":["S41"],"priority":"deeper"},{"id":"g22","term":"Embedding","cn":"嵌入向量","definition":{"en":"A learned numerical representation; token embeddings and retrieval embeddings serve related but different roles.","zh":"学习得到的数值表示，词元嵌入与检索嵌入相关但用途不同。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g23","term":"Vector dimension","cn":"向量维度","definition":{"en":"The number of components in a vector, not a direct measure of knowledge or quality.","zh":"向量分量数量，不能直接衡量知识量或质量。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"deeper"},{"id":"g24","term":"Transformer","cn":"Transformer 架构","definition":{"en":"A neural sequence-model architecture built around attention and other blocks; original form was encoder–decoder.","zh":"围绕注意力等模块构建的神经序列架构，原始形式为编码器—解码器。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g25","term":"Self-attention","cn":"自注意力","definition":{"en":"Combining information from positions within a sequence using learned, input-dependent weights.","zh":"用学习到且依赖输入的权重，组合序列内不同位置的信息。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g26","term":"Q / K / V","cn":"查询／键／值","definition":{"en":"Attention projections: queries compare with keys; the resulting weights mix values.","zh":"注意力中的投影：查询与键比较，由所得权重组合值。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g27","term":"Multi-head attention","cn":"多头注意力","definition":{"en":"Multiple attention computations that can capture different learned relationships in parallel.","zh":"并行执行多组注意力计算，以学习不同关系。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"deeper"},{"id":"g28","term":"Causal mask","cn":"因果掩码","definition":{"en":"A restriction preventing a token position from attending to future positions during autoregressive modeling.","zh":"限制词元位置访问未来位置，用于自回归建模。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g29","term":"Positional encoding / RoPE","cn":"位置编码／旋转位置编码","definition":{"en":"Methods for representing token position; RoPE is one way of incorporating relative position information.","zh":"表示词元位置的方法；RoPE 是结合相对位置信息的一种方式。"},"category":"architecture","module":"m1","refs":["P22","P03"],"priority":"deeper"},{"id":"g30","term":"MLP / feed-forward block","cn":"多层感知机／前馈模块","definition":{"en":"A neural transformation applied to token representations, alongside attention in a Transformer.","zh":"对词元表示进行神经变换的模块，在 Transformer 中与注意力配合使用。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g31","term":"Residual connection","cn":"残差连接","definition":{"en":"Adding a block’s input to its transformed output to support information and gradient flow.","zh":"将模块输入加到变换后的输出上，以支持信息和梯度传播。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"deeper"},{"id":"g32","term":"Normalization","cn":"归一化","definition":{"en":"Rescaling intermediate activations according to a defined rule to improve training behavior.","zh":"按既定规则调整中间激活数值的尺度，以改善训练表现。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"deeper"},{"id":"g33","term":"Encoder / decoder","cn":"编码器／解码器","definition":{"en":"Architectural roles for representing inputs and producing outputs; different model families combine them differently.","zh":"分别承担输入表示与输出生成等职责，不同模型类别组合方式不同。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g34","term":"Autoregressive generation","cn":"自回归生成","definition":{"en":"Generating a sequence one step at a time conditioned on previous elements.","zh":"以前面的元素为条件，逐步生成序列。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g35","term":"Logit","cn":"未归一化输出分数","definition":{"en":"A model output score before conversion into a probability distribution.","zh":"模型输出在转换为概率分布前的分数。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g36","term":"Softmax","cn":"Softmax 概率归一化","definition":{"en":"An exponential normalization that turns logits into probabilities summing to one.","zh":"通过指数归一化，将 logits 转成和为一的概率。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g37","term":"Temperature","cn":"采样温度","definition":{"en":"A decoding parameter rescaling logits; it changes sampling, not factual knowledge.","zh":"缩放 logits 的解码参数，改变采样行为，不改变事实知识。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g38","term":"Top-k / top-p sampling","cn":"Top-k／核采样","definition":{"en":"Methods restricting candidate tokens by count or cumulative probability before sampling.","zh":"在采样前按数量或累计概率限制候选词元的方法。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"deeper"},{"id":"g39","term":"Context window","cn":"上下文窗口","definition":{"en":"The model’s supported token capacity for a request under its specific input/output rules.","zh":"按模型具体输入输出规则，一次请求支持的词元容量。"},"category":"architecture","module":"m1","refs":["S03","S05","P03"],"priority":"core"},{"id":"g40","term":"MoE · Mixture of experts","cn":"混合专家","definition":{"en":"A model design routing inputs through selected expert subnetworks; not a team of application agents.","zh":"将输入路由到选定专家子网络的模型设计，不是应用层的多智能体团队。"},"category":"architecture","module":"m1","refs":["P21"],"priority":"deeper"},{"id":"g41","term":"SSM / Mamba","cn":"状态空间模型／Mamba","definition":{"en":"Sequence-model approaches using state dynamics; Mamba introduces selective state-space mechanisms.","zh":"使用状态动态的序列建模方法；Mamba 引入选择性状态空间机制。"},"category":"architecture","module":"m1","refs":["P18","S39"],"priority":"deeper"},{"id":"g42","term":"Pretraining","cn":"预训练","definition":{"en":"Learning broadly useful model parameters from an initial large-scale training objective.","zh":"通过初始大规模训练目标学习广泛适用的模型参数。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g43","term":"Post-training","cn":"后训练","definition":{"en":"Training stages after pretraining that adapt behavior or capabilities, often including instruction or preference learning.","zh":"预训练后用于调整行为或能力的阶段，常包含指令或偏好学习。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g44","term":"Loss function","cn":"损失函数","definition":{"en":"The numerical objective optimized during training; it may differ from the product’s success metric.","zh":"训练中优化的数值目标，可能不同于产品成功指标。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g45","term":"Gradient / backpropagation","cn":"梯度／反向传播","definition":{"en":"A gradient measures how a loss changes with parameters; backpropagation computes these derivatives through a network.","zh":"梯度表示损失对参数的变化率；反向传播计算网络中的这些导数。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"deeper"},{"id":"g46","term":"SFT · Supervised fine-tuning","cn":"监督微调","definition":{"en":"Adapting a model using example inputs with target outputs.","zh":"使用输入与目标输出样例适配模型。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g47","term":"Instruction tuning","cn":"指令微调","definition":{"en":"Fine-tuning on instruction–response examples to improve following task requests.","zh":"利用指令—响应样例微调，以改善任务指令遵循。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g48","term":"RLHF","cn":"基于人类反馈的强化学习","definition":{"en":"A family of methods using human feedback in reinforcement-learning-based behavior optimization.","zh":"在基于强化学习的行为优化中使用人类反馈的一类方法。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g49","term":"Reward model","cn":"奖励模型","definition":{"en":"A learned scoring model used as a training signal; its score is not automatically a business-quality truth.","zh":"作为训练信号的学习评分模型，其分数不自动代表真实业务质量。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"deeper"},{"id":"g50","term":"DPO · Direct preference optimization","cn":"直接偏好优化","definition":{"en":"Learning from preference pairs with a direct objective instead of a separate RL optimization loop.","zh":"通过直接目标从偏好对学习，不需要独立的强化学习优化循环。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g51","term":"PEFT","cn":"参数高效微调","definition":{"en":"Adaptation methods that train a relatively small subset or addition of parameters.","zh":"仅训练相对较少参数或新增参数的适配方法。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g52","term":"LoRA","cn":"低秩适配","definition":{"en":"Learning low-rank weight updates rather than updating all original model weights.","zh":"学习低秩权重更新，而非更新全部原始权重。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g53","term":"QLoRA","cn":"量化低秩适配","definition":{"en":"Training low-rank adapters while using a quantized base model to reduce memory needs.","zh":"在量化基础模型上训练低秩适配器，以降低内存需求。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"deeper"},{"id":"g54","term":"In-context learning","cn":"上下文学习","definition":{"en":"Using examples or instructions in the current context without ordinarily updating model weights.","zh":"利用当前上下文的样例或指令，通常不更新模型权重。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g55","term":"Few-shot / zero-shot","cn":"少样本／零样本提示","definition":{"en":"Providing a few task examples—or none—in the prompt; different from the amount of pretraining data.","zh":"在提示中提供少量任务样例或不提供样例，不代表预训练数据的多少。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g56","term":"Catastrophic forgetting","cn":"灾难性遗忘","definition":{"en":"Losing previously learned capabilities during subsequent training.","zh":"后续训练导致先前学会的能力退化。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"deeper"},{"id":"g57","term":"Distillation","cn":"知识蒸馏","definition":{"en":"Training a student model using a teacher’s outputs or other training signals.","zh":"利用教师模型输出或其他训练信号训练学生模型。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"deeper"},{"id":"g58","term":"Reasoning model","cn":"推理模型","definition":{"en":"A model designed or trained to use additional reasoning-oriented computation; recipes vary across systems.","zh":"针对推理型计算设计或训练的模型；各系统方法不同。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g59","term":"Inference-time compute","cn":"推理时计算","definition":{"en":"Computation spent while solving a task, such as additional steps, search or verification.","zh":"解决任务时投入的计算，例如额外步骤、搜索或验证。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g60","term":"Chain of thought · CoT","cn":"思维链","definition":{"en":"Intermediate reasoning steps used in prompting or generation; a narrative is not proof of correctness.","zh":"提示或生成中的中间推理步骤，其叙述不能证明结果正确。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g61","term":"Open weights","cn":"开放权重","definition":{"en":"Model weights are available under stated terms; this is not necessarily open training data or unrestricted use.","zh":"模型权重按指定条款提供，并不必然意味着训练数据开放或用途无限制。"},"category":"training","module":"m2","refs":["S10","S38","P08","P11","P17"],"priority":"core"},{"id":"g62","term":"Prompt engineering","cn":"提示工程","definition":{"en":"Designing and testing instructions and examples supplied to a model.","zh":"设计与测试提供给模型的指令和样例。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g63","term":"Context engineering","cn":"上下文工程","definition":{"en":"Selecting, structuring and maintaining the information supplied to each model call.","zh":"选择、组织和维护每次模型调用获得的信息。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g64","term":"System / developer / user messages","cn":"系统／开发者／用户消息","definition":{"en":"Message roles used by some APIs to represent instruction sources; exact hierarchy is implementation-specific.","zh":"部分 API 用于表达指令来源的消息角色，具体层级依实现而定。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g65","term":"Structured outputs","cn":"结构化输出","definition":{"en":"Generating content constrained to a supported schema; structure does not verify factual correctness.","zh":"按受支持的结构定义约束生成内容，但结构不验证事实正确性。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g66","term":"JSON Schema","cn":"JSON 结构定义","definition":{"en":"A language for specifying data structure and constraints, not a permission policy.","zh":"描述数据结构与约束的语言，不是权限策略。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g67","term":"Hallucination","cn":"幻觉／无依据生成","definition":{"en":"Output presented as true that is unsupported or incorrect in the task context.","zh":"在任务上下文中，将没有依据或不正确的内容当成事实输出。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g68","term":"Grounding","cn":"依据绑定","definition":{"en":"Connecting an answer or action to appropriate evidence or authoritative data.","zh":"将答案或行动连接到适当证据或权威数据。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g69","term":"Abstention","cn":"弃答／转交","definition":{"en":"Declining to complete a claim or action when evidence or authorization is insufficient.","zh":"证据或授权不足时，不继续作出结论或执行行动。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g70","term":"Prompt injection","cn":"提示注入","definition":{"en":"Untrusted content attempting to redirect model behavior away from the authorized task.","zh":"不可信内容试图把模型行为引向获授权任务之外。"},"category":"context","module":"m3","refs":["S27","S31","S35","P15"],"priority":"core"},{"id":"g71","term":"Context compaction","cn":"上下文压缩整理","definition":{"en":"Reducing accumulated
